          description: |
            The suite's creator, when known. Absent when creator identity is
            unknown or no longer retained.
        configurations:
          type: array
          description: File-authored launch defaults. Omitted on suites without persistent configurations.
          items:
            $ref: '#/components/schemas/BenchmarkConfigurationInput'
    BenchmarkSuiteCreator:
      type: object
      required:
        - type
        - uid
