  '/factory/{uid}/pull-requests':
    get:
      summary: List the factory's pull requests
      description: |
        One record per pull request produced by the factory's runs, newest
        opened first. A PR someone opened in one of the factory's
        repositories without a factory run (by hand, for example) is not
        listed. Each record carries the PR's identity, state and times,
        size, human interactions, the runs that produced it, and its cycle
        time. Pages are keyset-paginated: pass page_info.next_cursor back as
        cursor to continue. Pass updated_after to sync incrementally.
      operationId: listFactoryPullRequests
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          description: The public UID of the factory.
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Records per page. Defaults to 50; at most 500.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: cursor
          in: query
          description: Opaque cursor from a previous page's page_info.next_cursor.
          required: false
          schema:
            type: string
        - name: repo
          in: query
          description: 'Only PRs in this repository, as owner/repo (case-insensitive).'
          required: false
          schema:
            type: string
        - name: state
          in: query
          description: |
            Only PRs in these states. Can be specified multiple times to match any of the given states.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/FactoryPullRequestState'
        - name: opened_after
          in: query
          description: Only PRs opened after this RFC3339 time (exclusive).
          required: false
          schema:
            type: string
            format: date-time
        - name: opened_before
          in: query
          description: Only PRs opened before this RFC3339 time (exclusive).
          required: false
          schema:
            type: string
            format: date-time
        - name: merged_after
          in: query
          description: Only PRs merged after this RFC3339 time (exclusive).
          required: false
          schema:
            type: string
            format: date-time
        - name: merged_before
          in: query
          description: Only PRs merged before this RFC3339 time (exclusive).
          required: false
          schema:
            type: string
            format: date-time
        - name: updated_after
          in: query
          description: |
            Only PRs whose updated_at is after this RFC3339 time
            (exclusive). updated_at tracks the PR on the code host; fields
            derived from the factory's runs (runs, kickoff_at,
            human_interactions.follow_up_message, and the kickoff-based
            cycle_time stages) can change without moving it.
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: One page of the factory's pull requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryPullRequestsResponse'
        '400':
          description: 'Invalid limit, cursor, state, or timestamp filter, or a time window whose *_after bound is not before its *_before bound'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: Factory not found or not accessible
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/FactoryMetricsRateLimited'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
