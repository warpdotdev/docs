        '404':
          description: Artifact not found or unsupported artifact type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/{uid}/scorers/{scorer_uid}':
    parameters:
      - name: uid
        in: path
        description: UID of the factory that owns the scorer
        required: true
        schema:
          type: string
    patch:
      summary: Update a scorer's definition
      description: |
        Apply a partial update to a scorer's definition; omitted fields are
        left unchanged, but at least one field must be provided, and the
        owning factory is immutable. Each update bumps the scorer's version
        without invalidating any scoring judge already in flight, since
        judges validate against the definition snapshot taken at dispatch
        time, and historical scores keep their recorded classification
        values. Supplying `scope_mode` or `agent_uids` replaces the scorer's
        scope in full.
      operationId: updateScorer
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - name: scorer_uid
          in: path
          description: The scorer identifier
          required: true
          schema:
            type: string
            description: Scorer UUID or temporary positive decimal integer ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScorerRequest'
      responses:
        '200':
          description: The updated scorer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScorerResponse'
        '400':
          description: Invalid scorer update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: 'Scorer not found, or the caller cannot manage its factory'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a scorer
      description: |
        Permanently delete a scorer. This is not reversible and it is not an
        archive: the scorer's scoring attempts, scores, judge reasoning, self-improvement
        config, and self-improvement triage results go with it, and the scorer stops
        being readable through this API as soon as the call returns.

        The underlying rows and the judge-reasoning blobs stored outside the
        database are destroyed shortly afterwards by the deletion sweep, which
        removes each blob before the record that references it and retries until
        both are gone.
      operationId: deleteScorer
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - name: scorer_uid
          in: path
          description: The scorer identifier
          required: true
          schema:
            type: string
            description: Scorer UUID or temporary positive decimal integer ID.
      responses:
        '204':
          description: Scorer deleted
        '400':
          description: Invalid scorer ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: 'Scorer not found, or the caller cannot manage its factory'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/agent/conversations/{conversationId}/block-snapshot':
    get:
      summary: Download a conversation's block snapshot
      description: |
        Redirect to a signed storage URL for the serialized block snapshot.
        Set redirect=false to return the URL as JSON instead. Both modes require
        permission to view the conversation.
      operationId: getConversationBlockSnapshot
