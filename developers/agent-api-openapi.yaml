        - name: start_date
          in: query
          deprecated: true
          description: |
            Legacy summary range start (RFC3339 UTC, inclusive). Accepted
            and validated for compatibility; does not affect the list
            response. Must be provided together with end_date and be
            strictly before it.
          required: false
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          deprecated: true
          description: |
            Legacy summary range end (RFC3339 UTC, exclusive). See start_date.
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Scorers for the factory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListScorersResponse'
        '400':
          description: |
            Invalid recent_outcomes_limit (not an integer in 1-100), or an
            invalid start_date/end_date pair: one given without the other,
            an unparseable RFC3339 timestamp, or start_date not strictly
            before end_date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Factory not found or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/{uid}/scorers/{scorer_uid}/results':
    parameters:
      - name: uid
        in: path
        description: UID of the factory that owns the scorer
        required: true
        schema:
          type: string
    get:
      summary: List results for a scorer
      description: |
        List the scorer's most recent scoring attempts, newest first. A
        failed attempt carries no classification. Pagination is a keyset
        cursor over attempted_at with the attempt id as a stable tiebreak.
        Repeat `run_id` to return all matching results without pagination; unknown runs are omitted.
        Reasons are read from object storage only when include_reasons is true.
      operationId: listScorerResults
      tags:
        - agent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamUidHeaderParam'
        - name: scorer_uid
          in: path
          description: The scorer identifier
          required: true
          schema:
            type: string
            description: Scorer UUID or temporary positive decimal integer ID.
        - name: limit
          in: query
          description: 'Maximum number of results to return (1-100, default 50)'
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: Opaque cursor returned by a previous list response.
          required: false
          schema:
            type: string
        - name: include_reasons
          in: query
          description: Include reason availability and readable judge reasoning.
          required: false
          schema:
            type: boolean
            default: false
        - name: run_id
          in: query
          description: |
            Exact run filters, repeated once per run. Values are trimmed and
            deduplicated; require 1-100 distinct nonblank runs when present.
            Cannot be combined with cursor or limit.
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Recent results for the scorer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListScorerResultsResponse'
        '400':
          description: 'Invalid scorer ID, limit, cursor, include_reasons, or run_id filters'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: Scorer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/{uid}/scorers/{scorer_uid}/metrics':
    parameters:
      - name: uid
        in: path
        description: UID of the factory that owns the scorer
        required: true
        schema:
          type: string
    get:
      summary: Get scorer metrics over a date range
      description: |
        Returns a period-aligned pass-rate series plus a full-range aggregate
        for the scorer, computed directly from every live
        score in [start_date, end_date).
        Binning follows the same day/week/month rules and 365-period cap as
        `GET /factory/{uid}/metrics`.
      operationId: getScorerMetrics
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamUidHeaderParam'
        - name: scorer_uid
          in: path
          description: The scorer identifier
          required: true
          schema:
            type: string
            description: Scorer UUID or temporary positive decimal integer ID.
        - name: start_date
          in: query
          description: 'RFC3339 UTC range start, inclusive. Defaults to 30 days before end_date.'
          required: false
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          description: 'RFC3339 UTC range end, exclusive. Defaults to now.'
          required: false
          schema:
            type: string
            format: date-time
        - name: group_by_period
          in: query
          description: Binning granularity for the series. Defaults to day.
          required: false
          schema:
            $ref: '#/components/schemas/FactoryMetricsGroupByPeriod'
        - name: include_cost
          in: query
          description: Include the scorer's judge-run cost for each period. Defaults to false.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: The scorer's pass-rate series and range aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScorerMetricsResponse'
        '400':
          description: 'Invalid scorer ID, date range, group_by_period, or include_cost'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Scorer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/{factory_uid}/runs/{run_id}/scorer_dispatch':
    post:
      summary: Manually dispatch scorers for a run
      description: |
        Evaluate one run with the scorers in `scorer_uids`. To evaluate multiple
        runs with one scorer, use
        `/factory/{factory_uid}/scorers/{scorer_uid}/dispatch`.
        Manual dispatch skips automatic scoring's cool-down and sampling
        (including 0%) and supports older or previously scored runs.

        Requires manage access to the factory and view access to the run.
        The run must have a conversation and be executed by a factory agent,
        not be a scoring job. The run and scorers must belong to this factory
        and team. Each scorer must be configured for the run's agent and must
        not be benchmark-managed.

        Provide 1–100 scorer UUIDs. Run and scorer UUIDs must be nonzero.
        Invalid selections reject the whole request before any scoring jobs start.

        Returns dispatch outcomes, not completed scores. Valid requests can have
        individual failures; inspect each result's `status` and `error`.
      operationId: dispatchRunScorers
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - name: factory_uid
          in: path
          required: true
          description: The factory containing the run and scorers.
          schema:
            type: string
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunScorerDispatchRequest'
            example:
              scorer_uids:
                - 0199b01b-b7c0-7000-8000-000000000007
                - 0199b01b-b7c0-7000-8000-000000000008
      responses:
        '202':
          description: Per-pair dispatch outcomes; scoring completes asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualScoringDispatchResponse'
        '400':
          description: 'Invalid selection, ineligible run or scorer, or more than 100 scorer UUIDs.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: 'A named run or scorer does not exist, or the caller lacks access'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error; no scoring job was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/{factory_uid}/scorers/{scorer_uid}/dispatch':
    post:
      summary: Manually dispatch a scorer for selected runs
      description: |
        Evaluate the runs in `run_ids` with one scorer. To evaluate one run with
        multiple scorers, use
        `/factory/{factory_uid}/runs/{run_id}/scorer_dispatch`.
        Manual dispatch skips automatic scoring's cool-down and sampling
        (including 0%) and supports older or previously scored runs.

        Requires manage access to the factory and view access to every run.
        Runs must have conversations and be executed by factory agents,
        not be scoring jobs. The scorer and runs must belong to this factory
        and team. The scorer must be configured for each run's agent and must
        not be benchmark-managed.

        Provide 1–100 run UUIDs. Run and scorer UUIDs must be nonzero.
        Invalid selections reject the whole request before any scoring jobs start.

        Returns dispatch outcomes, not completed scores. Valid requests can have
        individual failures; inspect each result's `status` and `error`.
      operationId: dispatchScorer
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - name: factory_uid
          in: path
          required: true
          description: The factory containing the scorer and runs.
          schema:
            type: string
        - name: scorer_uid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScorerDispatchRequest'
            example:
              run_ids:
                - 0199b01b-b7c0-7000-8000-000000000001
                - 0199b01b-b7c0-7000-8000-000000000002
      responses:
        '202':
          description: Per-pair dispatch outcomes; scoring completes asynchronously.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualScoringDispatchResponse'
        '400':
          description: 'Invalid selection, ineligible run or scorer, or more than 100 run UUIDs.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: 'A named run or scorer does not exist, or the caller lacks access'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error; no judge run was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/runs/{run_id}/scores':
    get:
      summary: Read a run's current scores
