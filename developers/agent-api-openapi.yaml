  '/factory/{factory_uid}/benchmarks/{suite_uid}/runs':
    post:
      summary: Launch a benchmark run from the current suite version
      description: |
        Each successful request creates a new run. Launch is not idempotent:
        disable automatic retries for this request and reconcile an uncertain
        outcome by listing runs before launching again.
        Retries are a client transport option, not a request-body field.
        In the TypeScript SDK, pass { maxRetries: 0 } as the request options.
        In the Python SDK, call create through client.with_options(max_retries=0).
        These options do not change execution retries within the benchmark run.
      operationId: launchBenchmarkRun
      tags:
        - factory
        - benchmark
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BenchmarkFactoryPath'
        - $ref: '#/components/parameters/BenchmarkSuitePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LaunchBenchmarkRunRequest'
            examples:
              full_suite:
                summary: Launch every current task in the suite
                value:
                  repetition_count: 1
              task_subset:
                summary: Launch a subset selected by task UID
                value:
                  repetition_count: 1
                  tasks:
                    - 7d69fb52-71c5-4e27-914e-8764ee9c5246
                    - ad8ff7dc-a7d1-4ed6-9f50-650010bb39aa
      responses:
        '201':
          description: Run launched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkRunLaunchResponse'
        '400':
          description: Suite not runnable; body contains violations list
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BenchmarkLaunchViolationError'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: Suite not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List benchmark runs
      operationId: listBenchmarkRuns
      description: |
        List runs launched from this benchmark suite. Each entry contains the
        run's status and execution/scoring progress. Use `include` to add launch
        settings, aggregate results, or the creator's display name to each entry.
        The response contains a page of runs in `data` and continuation
        information in `page_info`. Retained runs remain readable after the
        suite is deleted; an unknown suite returns an empty list.
      tags:
        - factory
        - benchmark
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BenchmarkRunInclude'
        - $ref: '#/components/parameters/BenchmarkFactoryPath'
        - $ref: '#/components/parameters/BenchmarkSuitePath'
        - name: state
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/BenchmarkRunState'
          style: form
          explode: true
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 'Runs from the frozen suite identity, including deleted suites; empty for an unknown suite'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkRunList'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: Factory not found or not accessible
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/{factory_uid}/benchmarks/{suite_uid}/runs/{run_uid}':
    get:
      summary: Get benchmark run detail
      operationId: getBenchmarkRun
      description: |
        Retrieve a benchmark run's status and execution/scoring progress.
        By default, the response omits launch settings and aggregate results.
        Use `include` to add these fields or the creator's display name.
        Retrieve trials separately for individual scores and execution history.
      tags:
        - factory
        - benchmark
      security:
