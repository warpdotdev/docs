                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: 'Run not found, or the caller cannot view it'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
