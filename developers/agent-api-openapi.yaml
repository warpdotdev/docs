        full_path:
          type: string
          description: Path to the SKILL.md file (for file-based skills)
        bundled_skill_id:
          type: string
          description: Unique identifier for bundled skills
    ListEnvironmentsResponse:
      type: object
      required:
        - environments
      properties:
        environments:
          type: array
          items:
            $ref: '#/components/schemas/CloudEnvironment'
          description: List of accessible cloud environments
    CloudEnvironment:
      type: object
      description: A cloud environment for running agents
      required:
        - uid
        - config
        - last_updated
        - setup_failed
      properties:
        uid:
          type: string
          description: Unique identifier for the environment
        config:
          $ref: '#/components/schemas/CloudEnvironmentConfig'
        last_updated:
          type: string
          format: date-time
          description: Timestamp when the environment was last updated (RFC3339)
        last_task_run_timestamp:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp of the most recent task run in this environment (RFC3339)
        last_task_created:
          $ref: '#/components/schemas/EnvironmentLastTask'
        setup_failed:
          type: boolean
          description: True when the most recent task failed during setup before it started running
        scope:
          $ref: '#/components/schemas/Scope'
        creator:
          $ref: '#/components/schemas/RunCreatorInfo'
        last_editor:
          $ref: '#/components/schemas/RunCreatorInfo'
    SecretRef:
      type: object
      description: |
        Reference to a managed secret by name.
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the managed secret.
    MemoryStoreRef:
      type: object
      description: Reference to a memory store to attach to an agent.
      required:
        - uid
        - access
        - instructions
      properties:
        uid:
          type: string
          description: UID of the memory store.
        access:
          type: string
          enum:
            - read_write
            - read_only
          description: Access level for the store.
        instructions:
          type: string
          description: Instructions for how the agent should use this memory store. Must not be empty.
    MemoryStoreAttachmentResponse:
      type: object
      description: Memory store attached to an agent.
      required:
        - uid
        - access
        - instructions
        - owner_type
        - owner_uid
      properties:
        uid:
          type: string
          description: UID of the memory store.
        access:
          type: string
          enum:
            - read_write
            - read_only
          description: Access level for the store.
        instructions:
          type: string
          description: Instructions for how the agent should use this memory store.
        owner_type:
          type: string
          description: Public owner type.
          enum:
            - user
            - service_account
            - team
        owner_uid:
          type: string
          description: 'Public UID of the user, service account, or team that owns the memory store.'
        description:
          type: string
          description: Optional description for the memory store.
    AgentAutoMemoryCreateConfig:
      type: object
      description: Auto-memory settings for creating an agent.
      properties:
        enabled:
          type: boolean
          description: |
            Whether to create and attach a default service-account-owned memory store for this agent.
            Defaults to true when omitted.
    AgentMemoryCreateConfig:
      type: object
      description: Memory settings for creating an agent.
      properties:
        auto_memory:
          allOf:
            - $ref: '#/components/schemas/AgentAutoMemoryCreateConfig'
          description: Agent-owned memory settings. Defaults to enabled when omitted.
        attached_stores:
          type: array
          items:
            $ref: '#/components/schemas/MemoryStoreRef'
          description: |
            Existing team memory stores to attach to the agent.
            Duplicate UIDs within a single request are rejected.
    AgentMemoryUpdateConfig:
      type: object
      description: Memory settings for updating an agent.
      properties:
        attached_stores:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/MemoryStoreRef'
          description: |
            Replacement list of attached team memory stores. Omit to leave unchanged,
            pass an empty array to clear, or pass a non-empty array to replace.
    AgentAutoMemoryResponse:
      type: object
      description: Auto-memory state for an agent.
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Whether this agent has an agent-owned memory store.
        store:
          $ref: '#/components/schemas/MemoryStoreAttachmentResponse'
    AgentMemoryResponse:
      type: object
      description: Memory settings for an agent.
      required:
        - auto_memory
        - attached_stores
      properties:
        auto_memory:
          $ref: '#/components/schemas/AgentAutoMemoryResponse'
        attached_stores:
          type: array
          items:
            $ref: '#/components/schemas/MemoryStoreRef'
          description: Team memory stores attached to the agent.
    AgentCredentialStrategy:
      type: string
      description: |
        Default credential strategy for runs executed by a named agent; an
        agent may leave this unset (see AgentResponse.credential_strategy
        for the full resolution order).
        - EXECUTOR: runs authenticate with the named agent's own credentials
          (e.g. a GitHub App installation token for the agent's team).
        - CREATOR: runs authenticate with the credentials of the principal
          that created the run.
      enum:
        - CREATOR
        - EXECUTOR
    ScorerClassification:
      type: object
      required:
        - value
        - score
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 1048576
          description: Classification value returned by the scorer
        description:
          type:
            - string
            - 'null'
          maxLength: 1048576
          description: |
            Optional free-text meaning of this classification, surfaced to the
            judge alongside the value. Omit or leave blank for a score-only
            label.
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: |
            Score this classification carries, from 0 to 1. A run passes when
            its scored label's score is greater than or equal to the scorer's
            threshold. A score of exactly 0 is valid, so this is not enforced
            with a "required" binding (which would reject the zero value);
            handlers validate its range explicitly instead.
    ScorerAgentConfig:
      type: object
      description: |
        Scorer-specific execution overrides for its hidden judge agent. An
        omitted or null field inherits the corresponding Factory agent default.
        A non-empty value replaces that default. Empty secrets and mcp_servers
        collections explicitly clear the optional Factory defaults.
      properties:
        default_runner_uid:
          type:
            - string
            - 'null'
          description: |
            Runner used by scorer judge runs. Omit or set null to inherit the
            Factory agent default.
        secrets:
          type:
            - array
            - 'null'
          description: |
            Managed secrets attached to scorer judge runs. Omit or set null to
            inherit the Factory agent defaults; an empty array attaches none.
          items:
            $ref: '#/components/schemas/SecretRef'
        mcp_servers:
          type:
            - object
            - 'null'
          description: |
            MCP servers attached to scorer judge runs. Omit or set null to
            inherit the Factory agent defaults; an empty object attaches none.
          additionalProperties:
            $ref: '#/components/schemas/MCPServerConfig'
    CreateScorerRequest:
      type: object
      description: |
        Scorer definition. Text fields are trimmed of surrounding whitespace
        before validation; required text fields must not be blank after trimming,
        and no text field may exceed 1 MiB (1048576 bytes).
      required:
        - name
        - scoring_prompt
        - allowed_classifications
        - threshold
        - scope_mode
        - model_id
      properties:
        factory_uid:
          type: string
          minLength: 1
          description: Optional compatibility scope; must match the factory_uid in the path.
          deprecated: true
        name:
          type: string
          minLength: 1
          maxLength: 1048576
          description: Display name for the scorer
        description:
          type:
            - string
            - 'null'
          maxLength: 1048576
          description: Optional description of the scorer
        scoring_prompt:
          type: string
          minLength: 1
          maxLength: 1048576
          description: Instructions used to score matching runs
        allowed_classifications:
          type: array
          minItems: 1
          maxItems: 20
          description: Values the scorer may return; classification values must be unique
          items:
            $ref: '#/components/schemas/ScorerClassification'
        threshold:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: |
            Score a run's classified label must meet or exceed to pass, from 0
            to 1.
        scope_mode:
          type: string
          enum:
            - all_agents
            - selected_agents
          description: Whether the scorer applies to every factory agent or selected agents
        agent_uids:
          type: array
          description: |
            Legacy shorthand for selected agents with include_descendants=false.
            Required and non-empty for selected_agents when agents is omitted;
            must be empty for all_agents and cannot be combined with agents.
          items:
            type: string
        agents:
          type: array
          description: |
            Selected agents and their evidence policy. Required and non-empty
            for selected_agents when agent_uids is omitted; must be empty for
            all_agents and cannot be combined with agent_uids.
          items:
            $ref: '#/components/schemas/ScorerAgentInput'
        sampling_rate:
          type:
            - number
            - 'null'
          format: double
          minimum: 0
          maximum: 100
          description: |
            Percentage of the scorer's eligible runs to score, from 0 to
            100; omit to score every eligible run, and 0 stops automatic
            scoring (manual dispatch still works). A value with more than
            two decimal places is rounded to two rather than rejected, and
            the rounded value is what is stored. Sampling applies to
            periodic scoring only, and runs are chosen deterministically per
            (scorer, run), so lowering the rate reduces how many runs are
            scored rather than how often.
        model_id:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            LLM model dispatched judge runs use to evaluate this scorer's
            rubric.
        self_improvement_enabled:
          type: boolean
          description: |
            Optionally enable self-improvement for the newly created scorer
            in the same transactional request. Defaults to false; the response
            includes the resulting state.
        agent_config:
          $ref: '#/components/schemas/ScorerAgentConfig'
    UpdateScorerRequest:
      type: object
      description: |
        Partial scorer definition update. Every field is optional, but at least
        one must be present. Text fields are trimmed of surrounding whitespace
        before validation; a provided required text field must not be blank after
        trimming, and no text field may exceed 1 MiB (1048576 bytes).
      properties:
        self_improvement_enabled:
          type: boolean
          description: |
            Enable or disable self-improvement atomically with definition edits.
            Omission leaves the state unchanged. Null is invalid. Enabling
            requires a classification below the merged pass threshold.
        name:
          type: string
          minLength: 1
          maxLength: 1048576
          description: New display name for the scorer
        description:
          type: string
          maxLength: 1048576
          description: New description; an empty string clears it
        scoring_prompt:
          type: string
          minLength: 1
          maxLength: 1048576
          description: New instructions used to score matching runs
        allowed_classifications:
          type: array
          minItems: 1
          maxItems: 20
          description: |
            Replacement set of values the scorer may return; classification
            values must be unique. Removing a classification the scorer's
            self-improvement config still targets is rejected.
          items:
            $ref: '#/components/schemas/ScorerClassification'
        threshold:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: |
            New score a run's classified label must meet or exceed to pass,
            from 0 to 1.
        sampling_rate:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: |
            New percentage of eligible runs this scorer should score, rounded
            to two decimal places. 0 stops automatic scoring; manual dispatch
            still works.
        scope_mode:
          type: string
          enum:
            - all_agents
            - selected_agents
          description: |
            New scope mode. Defaults to the scorer's current mode when only
            agent_uids or agents is supplied.
        agent_uids:
          type: array
          description: |
            Complete replacement membership for the scorer's scope. Required and
            non-empty when the resulting scope_mode is selected_agents; must be
            empty for all_agents. Legacy shorthand for agents whose
            include_descendants value is false; cannot be combined with agents.
          items:
            type: string
        agents:
          type: array
          description: |
            Complete replacement selected-agent configuration. Required and
            non-empty when the resulting scope_mode is selected_agents and
            agent_uids is omitted; must be empty for all_agents and cannot be
            combined with agent_uids.
          items:
            $ref: '#/components/schemas/ScorerAgentInput'
        model_id:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            New LLM model dispatched judge runs use to evaluate this scorer's
            rubric. Must not be blank when provided.
        agent_config:
          anyOf:
            - $ref: '#/components/schemas/ScorerAgentConfig'
            - type: 'null'
          description: |
            Partial execution override update. A null object resets every
            override to inherit the Factory agent defaults. Otherwise, omitted
            nested fields stay unchanged, a null nested field resets that
            override to inheritance, and empty secrets and mcp_servers
            collections explicitly attach none.
    ScorerUID:
      type: string
      format: uuid
      description: Stable scorer UUID; new scorers use UUIDv4. Nil UUIDs are invalid.
    ScorerKind:
      type: string
      description: |
        Whether the scorer is user-defined or a platform-owned managed scorer.
        Read-only on responses; create input does not accept scorer_kind.
      enum:
        - user
        - benchmark_task_correctness
    ScorerResponse:
      type: object
      required:
        - scorer_uid
        - id
        - factory_uid
        - name
        - description
        - scoring_prompt
        - allowed_classifications
        - threshold
        - self_improvement_enabled
        - scorer_kind
        - scope_mode
        - agent_uids
        - agents
        - sampling_rate
        - model_id
        - agent_config
        - created_at
        - updated_at
      properties:
        scorer_uid:
          $ref: '#/components/schemas/ScorerUID'
        self_improvement_enabled:
          type: boolean
          description: Whether self-improvement is enabled for this scorer
        id:
          type: integer
          description: Scorer identifier
        factory_uid:
          type: string
          description: UID of the factory that owns the scorer
        name:
          type: string
          description: Display name for the scorer
        description:
          type: string
          description: Description of the scorer
        scoring_prompt:
          type: string
          description: Instructions used to score matching runs
        allowed_classifications:
          type: array
          items:
            $ref: '#/components/schemas/ScorerClassification'
        threshold:
          type: number
          format: double
          description: 'Score a run''s classified label must meet or exceed to pass, from 0 to 1'
        scorer_kind:
          $ref: '#/components/schemas/ScorerKind'
        scope_mode:
          type: string
          enum:
            - all_agents
            - selected_agents
          description: Whether the scorer applies to every factory agent or selected agents
        agent_uids:
          type: array
          description: Agents attached to a selected_agents scorer; empty for all_agents
          items:
            type: string
        agents:
          type: array
          description: Selected agents and whether each evaluation includes its run descendants
          items:
            $ref: '#/components/schemas/ScorerAgentInput'
        sampling_rate:
          type: number
          format: double
          description: |
            Percentage of the scorer's eligible runs that periodic scoring scores,
            to two decimal places. 0 stops automatic scoring.
        model_id:
          type: string
          description: |
            LLM model dispatched judge runs use to evaluate this scorer's
            rubric.
        agent_config:
          $ref: '#/components/schemas/ScorerAgentConfig'
        created_at:
          type: string
          format: date-time
          description: When the scorer was created
        updated_at:
          type: string
          format: date-time
          description: When the scorer was updated
    ScorerScopeAgent:
      type: object
      required:
        - uid
        - name
        - include_descendants
      properties:
        uid:
          type: string
          description: Unique identifier of the agent
        name:
          type: string
          description: Display name of the agent
        include_descendants:
          type: boolean
          description: Whether scoring this agent's run includes its descendant subtree
    ScorerAgentInput:
      type: object
      required:
        - uid
      properties:
        uid:
          type: string
          description: Unique identifier of the selected agent
        include_descendants:
          type: boolean
          default: false
          description: Whether scoring this agent's run includes its descendant subtree
    ScorerListItem:
      type: object
      required:
        - scorer_uid
        - id
        - factory_uid
        - name
        - description
        - scoring_prompt
        - allowed_classifications
        - threshold
        - scope_mode
        - agents
        - scorer_kind
        - sampling_rate
        - created_at
        - updated_at
        - result_count
        - model_id
        - agent_config
        - self_improvement_enabled
      properties:
        scorer_uid:
          $ref: '#/components/schemas/ScorerUID'
        id:
          type: integer
          description: Scorer identifier
        factory_uid:
          type: string
          description: Public UID of the factory that owns the scorer
        name:
          type: string
          description: Display name for the scorer
        description:
          type: string
          description: Description of the scorer
        scoring_prompt:
          type: string
          description: Instructions used to score the agent's runs
        allowed_classifications:
          type: array
          items:
            $ref: '#/components/schemas/ScorerClassification'
        threshold:
          type: number
          format: double
          description: 'Score a run''s classified label must meet or exceed to pass, from 0 to 1'
        scope_mode:
          type: string
          enum:
            - all_agents
            - selected_agents
          description: all_agents (every agent in the scorer's factory) or selected_agents
        agents:
          type: array
          items:
            $ref: '#/components/schemas/ScorerScopeAgent'
          description: Named agents in scope; empty when the scorer covers all factory agents
        scorer_kind:
          $ref: '#/components/schemas/ScorerKind'
        sampling_rate:
          type: number
          format: double
          description: |
            Percentage of the scorer's eligible runs that periodic scoring scores,
            to two decimal places. 0 stops automatic scoring.
        agent_config:
          $ref: '#/components/schemas/ScorerAgentConfig'
        created_at:
          type: string
          format: date-time
          description: When the scorer was created
        updated_at:
          type: string
          format: date-time
          description: When the scorer was last updated
        result_count:
          type: integer
          description: Number of live scores recorded for the scorer
        last_scored_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the scorer last recorded a score
        model_id:
          type: string
          description: |
            LLM model dispatched judge runs use to evaluate this scorer's
            rubric.
        self_improvement_enabled:
          type: boolean
          description: Whether self-improvement is enabled for this scorer
    ListScorersResponse:
      type: object
      required:
        - scorers
      properties:
        scorers:
          type: array
          items:
            $ref: '#/components/schemas/ScorerListItem'
    ScorerOutcome:
      type: string
      enum:
        - pass
        - fail
      description: |
        Pass/fail verdict of a recorded score, derived at read time against
        the evaluation's current threshold rather than frozen at scoring
        time — editing the threshold retroactively changes the outcome of
        already-scored runs. Today this is "pass" or "fail"; clients should
        tolerate additional values so future non-scoreable verdicts (for
        example, excluded from scoring) do not break them. Do not use
        result_count as a pass-rate denominator: only pass and fail count.
    ScorerResultStatus:
      type: string
      enum:
        - scored
        - failed
        - in_flight
      description: |
        Outcome of a scoring attempt: "scored", "failed", or "in_flight" (no
        live score yet and a judge is currently running). A failed or
        in_flight attempt has no classification. A scored attempt whose
        is_in_flight is also true has a live classification while a
        replacement judge runs.
    ScorerReasonStatus:
      type: string
      enum:
        - available
        - absent
        - unavailable
      description: |
        Available when the judge reason was read, absent when none was
        recorded, and unavailable when a recorded reason could not be read.
    ScorerResult:
      type: object
      required:
        - run_id
        - status
        - attempted_at
        - is_in_flight
      properties:
        run_id:
          type: string
          description: The selected agent run that anchors the scoring attempt
        conversation_id:
          type:
            - string
            - 'null'
          description: Conversation whose transcript was judged
        conversation_title:
          type:
            - string
            - 'null'
          description: Title of the judged conversation
        status:
          $ref: '#/components/schemas/ScorerResultStatus'
        reason_status:
          allOf:
            - $ref: '#/components/schemas/ScorerReasonStatus'
          description: Present only when include_reasons is true.
        reason:
          type: string
          description: Judge reasoning; present only when reason_status is available.
        classification:
          type:
            - string
            - 'null'
          description: The chosen classification; absent when the attempt failed
        attempted_at:
          type: string
          format: date-time
          description: When the scorer last attempted this run
        scored_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the live score was recorded; absent for failed attempts
        scoring_run_id:
          type:
            - string
            - 'null'
          description: The Warp run that performed the judging; absent when scoring was never dispatched for this attempt
        scoring_run_usage:
          allOf:
            - $ref: '#/components/schemas/RequestUsage'
          description: |
            Cost of the scoring run (the Warp judge run), independent of the
            scored run's own cost. Absent when there is no scoring run yet, or
            its usage is not yet available (e.g. the judge is still in flight).
        scoring_run_time:
          type:
            - string
            - 'null'
          description: |
            Total runtime of the scoring run as an ISO 8601 duration. Absent
            when there is no scoring run or its execution duration is not yet
            available.
        score:
          type:
            - number
            - 'null'
          format: double
          description: |
            Numeric score of the classified label, resolved from the attempt's
            config snapshot at scoring time. Absent when the attempt failed.
        outcome:
          anyOf:
            - $ref: '#/components/schemas/ScorerOutcome'
            - type: 'null'
          description: |
            Pass/fail verdict for this score, derived at read time against the
            evaluation's current threshold. Absent when the attempt failed.
        is_in_flight:
          type: boolean
          description: |
            True when a non-terminal judge run currently holds this pair.
            Independent of status/classification: a previous live
            classification stays visible while a replacement judge runs.
    ListScorerResultsResponse:
      type: object
      required:
        - results
        - page_info
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ScorerResult'
        page_info:
          $ref: '#/components/schemas/PageInfo'
    ScorerMetricsResponse:
      type: object
      description: |
        A scorer's pass-rate series over one date range, period-aligned to
        period_list, plus a full-range aggregate computed over the exact
        same set of live scores as the series.
      required:
        - group_by_period
        - period_list
        - pass_count
        - fail_count
        - pass_rate
        - pass_count_series
        - fail_count_series
        - pass_rate_series
      properties:
        group_by_period:
          $ref: '#/components/schemas/FactoryMetricsGroupByPeriod'
        period_list:
          type: array
          description: |
            Period labels every series aligns to (dates like 2026-07-01;
            weeks labeled by their Sunday start date).
          items:
            type: string
        pass_count:
          type: integer
          format: int64
          description: 'Live scores whose derived outcome is pass, over the whole range.'
        fail_count:
          type: integer
          format: int64
          description: 'Live scores whose derived outcome is fail, over the whole range.'
        pass_rate:
          type:
            - number
            - 'null'
          format: double
          description: |
            pass_count / (pass_count + fail_count) over the whole range; null
            when the range has no pass/fail scores. The dashboard headline
            should use this field, not a per-period value, so it always
            describes the same window as the chart.
        pass_count_series:
          type: array
          description: 'One entry per period_list entry, zero-filled.'
          items:
            type: integer
            format: int64
        fail_count_series:
          type: array
          description: 'One entry per period_list entry, zero-filled.'
          items:
            type: integer
            format: int64
        pass_rate_series:
          type: array
          description: |
            One entry per period_list entry; pass_count_series[i] /
            (pass_count_series[i] + fail_count_series[i]). Null for a period
            with no pass/fail scores, so the chart renders a gap there
            instead of a false 0%.
          items:
            type:
              - number
              - 'null'
            format: double
        cost_usd_series:
          type: array
          description: |
            What the owning team was billed for the scorer's judge runs in
            each period_list entry, in US dollars; charges recorded before
            billed amounts were tracked fall back to an estimated cost.
            Present only when include_cost=true.
          items:
            type: number
            format: double
        total_cost_usd:
          type: number
          format: double
          description: |
            What the owning team was billed for all of the scorer's live
            judge runs, in US dollars, with the same estimated fallback as
            cost_usd_series. Present only when include_cost=true.
    RunScorerDispatchRequest:
      type: object
      required:
        - scorer_uids
      properties:
        scorer_uids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ScorerUID'
          description: Scorer UUIDs to apply to the run.
    ScorerDispatchRequest:
      type: object
      required:
        - run_ids
      properties:
        run_ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            format: uuid
          description: Run UUIDs to evaluate with the scorer.
    ManualScoringDispatchStatus:
      type: string
      enum:
        - dispatched
        - already_in_flight
        - failed_no_transcript
        - failed_run_tree_not_ready
        - failed_run_tree_incomplete
        - failed_run_tree_too_large
        - failed_to_dispatch
      description: |
        Outcome of one dispatched (run, scorer) pair: "dispatched" (stamped
        with a new or shared judge run), "already_in_flight" (an existing live
        judge already holds the pair; it is not queued, cancelled, or
        replaced), "failed_no_transcript" (no scoreable transcript existed, so
        a failed attempt was stamped instead), "failed_run_tree_not_ready"
        (the selected run or a descendant can be retried after execution or
        synchronization finishes), "failed_run_tree_incomplete" or
        "failed_run_tree_too_large" (a failed anchor attempt was stamped), or
        "failed_to_dispatch" (validation rejected the target or an operational
        error occurred; inspect error before retrying).
    ManualScoringDispatchResult:
      type: object
      required:
        - scorer_uid
        - run_id
        - status
      properties:
        scorer_uid:
          $ref: '#/components/schemas/ScorerUID'
        run_id:
          type: string
          format: uuid
          description: The selected agent run that anchors the scoring attempt
        status:
          $ref: '#/components/schemas/ManualScoringDispatchStatus'
        scoring_run_id:
          type:
            - string
            - 'null'
          format: uuid
          description: |
            The judge run covering this pair; present for dispatched and
            already_in_flight, absent otherwise. Multiple pairs for the same
            run can share one scoring_run_id.
        error:
          type:
            - string
            - 'null'
          description: Safe error detail; present only for failed_to_dispatch
    ManualScoringDispatchResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ManualScoringDispatchResult'
          description: 'One entry per requested pair, in no particular order'
    RunScoreAttemptStatus:
      type: string
      enum:
        - in_flight
        - scored
        - failed
      description: |
        Classification of a run's current attempt against one evaluation.
        "scored" takes precedence over in-flight: a live score reads as
        scored even while a replacement judge runs, and is_in_flight reports
        that overlap independently.
    RunScoreTriggerSource:
      type: string
      enum:
        - automatic
        - manual
      description: Whether the current attempt was requested by an automatic scoring dispatch or a manual dispatch request
    RunScoreItem:
      type: object
      required:
        - scorer_uid
        - scorer_id
        - scorer_name
        - attempt_status
        - is_in_flight
        - trigger_source
        - attempted_at
      properties:
        scorer_uid:
          $ref: '#/components/schemas/ScorerUID'
        scorer_id:
          type: integer
          description: The evaluation that attempted this run
        scorer_name:
          type: string
          description: Display name of the evaluation
        attempt_status:
          $ref: '#/components/schemas/RunScoreAttemptStatus'
        is_in_flight:
          type: boolean
          description: True when a non-terminal judge run currently holds this pair
        trigger_source:
          $ref: '#/components/schemas/RunScoreTriggerSource'
        classification:
          type:
            - string
            - 'null'
          description: The live classification; absent when there is no live score
        attempted_at:
          type: string
          format: date-time
          description: When the evaluation last attempted this run
        scored_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the live score was recorded; absent when there is no live score
        scoring_run_id:
          type:
            - string
            - 'null'
          description: The Warp run that performed the judging; absent when scoring was never dispatched for this attempt
    GetRunScoresResponse:
      type: object
      required:
        - run_id
        - scores
      properties:
        run_id:
          type: string
          description: The run these scores belong to
        scores:
          type: array
          items:
            $ref: '#/components/schemas/RunScoreItem'
          description: 'One entry per evaluation that has attempted the run, most recent attempt first'
    CreateAgentRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: A name for the agent
        description:
          type:
            - string
            - 'null'
          description: Optional description of the agent
        prompt:
          type:
            - string
            - 'null'
          description: |
            Optional base prompt for this agent
        environment_id:
          type:
            - string
            - 'null'
          description: |
            Optional default cloud environment ID for runs executed by this agent.
            The environment must be owned by the same team as the agent.
        default_runner_uid:
          type:
            - string
            - 'null'
          description: |
            Optional default runner UID for runs executed by this agent. When set,
            it overrides the selected environment's default runner for runs that
            do not specify their own `runner_id`. The editor must have View
            permission on the referenced runner.
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SecretRef'
          description: |
            Optional list of secrets associated with the agent.
            Duplicate names within a single request are rejected.
            Each entry is unioned into the run-time secret scope when the agent executes.
        skills:
          type: array
          items:
            type: string
          description: |
            Optional list of skill specs to associate with the agent.
            Format: "{owner}/{repo}:{skill_path}" (e.g., "warpdotdev/warp-server:.claude/skills/deploy/SKILL.md").
            Each spec is validated and normalized at attach time using the team's GitHub
            credentials; inaccessible or malformed specs are rejected.
        base_model:
          type:
            - string
            - 'null'
          description: |
            Optional base model for runs executed by this agent.
        inference_providers:
          allOf:
            - $ref: '#/components/schemas/InferenceProvidersConfig'
          description: |
            Optional inference provider settings for this agent.
            Agent-level config takes precedence over the workspace's
            admin-configured defaults.
        memory:
          allOf:
            - $ref: '#/components/schemas/AgentMemoryCreateConfig'
          description: Optional memory settings for the agent.
        mcp_servers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MCPServerConfig'
          description: |
            Optional map of MCP server configurations by name to attach to runs executed by this agent.
            Run-level MCP config takes precedence over this agent-level default.
        base_harness:
          type:
            - string
            - 'null'
          deprecated: true
          description: |
            Optional default harness for runs executed by this agent.
            Deprecated - use harness instead. Kept for backward compatibility;
            when both are sent, harness is authoritative and a conflicting
            type is rejected with invalid_request.
        harness:
          allOf:
            - $ref: '#/components/schemas/Harness'
          description: |
            Optional default harness for runs executed by this agent.
            Omission or an empty object stores no harness default.
        credential_strategy:
          oneOf:
            - $ref: '#/components/schemas/AgentCredentialStrategy'
            - type: 'null'
          description: |
            Optional default credential strategy for runs executed by this
            agent. When omitted or null, the agent has no opinion and runs fall
            back to the factory default (for factory-seeded agents) and then to
            EXECUTOR.
        harness_auth_secrets:
          allOf:
            - $ref: '#/components/schemas/HarnessAuthSecrets'
          description: |
            Optional per-harness authentication secrets for this agent.
            Each field names a managed secret for the corresponding harness.
            Secrets are resolved at execution time from the agent's team scope.
        on_behalf_of_enabled:
          type: boolean
          description: |
            Whether runs created with this agent's API key may use the on_behalf_of
            field to attribute runs to another team member. Defaults to false.
            Only team admins may set this field.
        worker_host:
          type:
            - string
            - 'null'
          description: |
            Optional default worker host for runs executed by this agent;
            omission, null, or an empty value stores no Agent default, in
            which case the workspace default applies. A non-empty value is
            trimmed and stored (use "warp" to force Warp-hosted execution
            over a self-hosted workspace default), and is resolved in this
            order:
            1. The host specified on the run itself
            2. The agent's default host
            3. The workspace default host
    UpdateAgentRequest:
      type: object
      description: |
        Partial update for an agent; each field is optional:
          * Omitted or `null`: leave the field unchanged.
          * Empty value: clear the field.
          * Non-empty: replace the field wholesale with the provided value.
        `secrets_append` is an exception: it appends secrets idempotently and
        must be the only supplied field, including fields supplied as `null`.
        `network_policy` is also an exception: omission preserves the policy,
        null clears it, and an object replaces it wholesale. An object with
        no allowed hosts carries deny-all intent.
      properties:
        name:
          type: string
          description: The new name for the agent
        description:
          type:
            - string
            - 'null'
          description: |
            Replacement description. Omit or pass `null` to leave unchanged, or use an empty value to clear.
        prompt:
          type:
            - string
            - 'null'
          description: |
            Replacement prompt. Omit or pass `null` to leave unchanged, or use an empty value to clear.
        environment_id:
          type:
            - string
            - 'null'
          description: |
            Replacement default cloud environment ID. Omit or pass `null` to leave unchanged,
            or pass an empty string to clear.
        default_runner_uid:
          type:
            - string
            - 'null'
          description: |
            Replacement default runner UID. Omit or pass `null` to leave unchanged,
            or pass an empty string to clear. A non-empty value must reference a
            runner the editor can View.
        secrets:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/SecretRef'
          description: |
            Replacement list of secrets. Omit to leave unchanged, pass an
            empty array to clear, or pass a non-empty array to replace.
            Duplicate names are rejected.
        secrets_append:
          type: array
          items:
            $ref: '#/components/schemas/SecretRef'
          description: |
            Adds team-owned raw-value secrets to this agent without removing or
            replacing its existing ones. Secrets it already has and any duplicates
            are skipped, and an empty array is a no-op. If any name is invalid, the
            whole request is rejected. Send this field by itself. Including any other
            field returns 400, even if that field is null, and null is not a valid
            value here. Appending requires edit and privileged-config-edit access on
            the agent plus secret-attach access on its Factory. Agents managed in
            external source files return 409.
        skills:
          type:
            - array
            - 'null'
          items:
            type: string
          description: |
            Replacement list of skill specs. Omit to leave unchanged, pass an empty array
            to clear, or pass a non-empty array to replace.
        base_model:
          type:
            - string
            - 'null'
          description: |
            Replacement base model. Omit or pass `null` to leave unchanged,
            or pass an empty string to clear.
        memory:
          oneOf:
            - $ref: '#/components/schemas/AgentMemoryUpdateConfig'
            - type: 'null'
          description: Replacement memory settings for this agent.
        mcp_servers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MCPServerConfig'
          description: |
            Replacement map of MCP server configurations by name. Omit to leave
            unchanged, pass an empty object to clear, or pass a non-empty object
            to replace. Run-level MCP config takes precedence over this agent-level
            default.
        inference_providers:
          oneOf:
            - $ref: '#/components/schemas/InferenceProvidersConfig'
            - type: 'null'
          description: |
            Replacement inference provider settings for this agent, which
            take precedence over the workspace's admin-configured defaults;
            omit or pass `null` to leave unchanged, or pass an empty object
            `{}` to clear.
        base_harness:
          type:
            - string
            - 'null'
          deprecated: true
          description: |
            Replacement default harness; omit or pass `null` to leave
            unchanged, or pass an empty string to clear. Deprecated - use
            harness instead, kept only for backward compatibility: when both
            are sent, harness is authoritative and a conflicting type is
            rejected with invalid_request.
        harness:
          oneOf:
            - $ref: '#/components/schemas/Harness'
            - type: 'null'
          description: |
            Replacement default harness for runs executed by this agent. Omit
            or pass `null` to leave unchanged, pass `{}` to clear the stored
            default, or pass a populated object to replace it wholesale.
        credential_strategy:
          oneOf:
            - $ref: '#/components/schemas/AgentCredentialStrategy'
            - type: 'null'
          description: |
            Replacement default credential strategy. Omit or pass `null` to
            leave unchanged, or pass an empty string to clear the agent's
            default. An agent belonging to a file-managed factory cannot clear
            it: its agent file expresses the strategy by declaring it, and a
            file that declares none keeps the strategy already projected, so a
            clear is rejected with a 400.
        harness_auth_secrets:
          oneOf:
            - $ref: '#/components/schemas/HarnessAuthSecrets'
            - type: 'null'
          description: |
            Replacement per-harness authentication secrets. Omit or pass `null`
            to leave unchanged, or pass an empty object to clear all secrets.
        on_behalf_of_enabled:
          type:
            - boolean
            - 'null'
          description: |
            Whether runs created with this agent's API key may use the on_behalf_of
            field to attribute runs to another team member. Omit or pass `null` to
            leave unchanged. Only team admins may set this field.
        worker_host:
          type:
            - string
            - 'null'
          description: |
            Replacement default worker host. Omit or pass `null` to leave
            unchanged, or pass an empty string to clear (the workspace default
            then applies). A non-empty value is trimmed and replaces the
            stored default; use "warp" to force Warp-hosted execution over a
            self-hosted workspace default.
    AgentResponse:
      type: object
      required:
        - uid
        - name
        - available
        - created_at
        - updated_at
        - secrets
        - skills
        - memory
        - default_runner_uid
      properties:
        uid:
          type: string
          description: Unique identifier for the agent
        name:
          type: string
          description: Name of the agent
        description:
          type:
            - string
            - 'null'
          description: Optional description of the agent
        prompt:
          type:
            - string
            - 'null'
          description: |
            Optional base prompt for this agent
        environment_id:
          type: string
          description: |
            Default cloud environment ID for runs executed by this agent;
            the precedence order for environment resolution is:
            1. The environment specified on the run itself
            2. The agent's default environment
            3. An empty environment
        default_runner_uid:
          type: string
          description: |
            Default runner UID for runs executed by this agent; when set,
            it overrides the selected environment's default runner for
            runs that do not specify their own `runner_id`. The precedence
            order for runner resolution is:
            1. The runner specified on the run itself
            2. The agent's default runner
            3. The selected environment's default runner
            4. The environment's legacy inline compute fields
            5. System defaults
        available:
          type: boolean
          description: Whether the agent is currently enabled. Defaults to true.
        created_at:
          type: string
          format: date-time
          description: When the agent was created (RFC3339)
        updated_at:
          type: string
          format: date-time
          description: When the agent was last updated (RFC3339)
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SecretRef'
          description: |
            Secrets that this agent may access by default.
        skills:
          type: array
          items:
            type: string
          description: |
            Ordered list of normalized skill specs associated with this agent.
            Always present; empty when no skills are attached.
        base_model:
          type: string
          description: |
            Base model for runs executed by this agent; the precedence
            order for model resolution is:
            1. The model specified on the run itself
            2. The agent's base model
            3. The team's default model
        inference_providers:
          allOf:
            - $ref: '#/components/schemas/InferenceProvidersConfig'
          description: |
            The agent's stored inference provider settings. May be overridden
            by run-level config; if empty, falls back to the workspace's
            admin-configured defaults.
        memory:
          allOf:
            - $ref: '#/components/schemas/AgentMemoryResponse'
          description: |
            Memory settings for this agent.
            Always present; attached_stores is empty when no team stores are attached.
        mcp_servers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MCPServerConfig'
          description: |
            MCP server configurations attached to this agent by default.
            Run-level MCP config takes precedence over this agent-level default.
        base_harness:
          type: string
          deprecated: true
          description: |
            Default harness for runs executed by this agent; the
            precedence order for harness resolution is:
            1. The harness specified on the run itself
            2. The agent's base harness
            3. Warp
            Deprecated: use harness instead, which carries the full
            {type, model_id, reasoning_level} default.
        harness:
          allOf:
            - $ref: '#/components/schemas/Harness'
          description: |
            Default harness for runs executed by this agent. Absent when the
            agent has no harness default. A stored model_id/reasoning_level
            pair is still returned even if the model has since left the
            harness's catalog.
        credential_strategy:
          allOf:
            - $ref: '#/components/schemas/AgentCredentialStrategy'
          description: |
            Default credential strategy for runs executed by this agent.
            Absent when the agent has no default. The precedence order for
            credential strategy resolution is:
            1. The strategy specified on the run itself
            2. The agent's default strategy
            3. The factory's default strategy, for factory-seeded agents
            4. EXECUTOR
            The resolved strategy is credential-validated at run creation;
            an unavailable credential rejects the request before execution.
        harness_auth_secrets:
          allOf:
            - $ref: '#/components/schemas/HarnessAuthSecrets'
          description: |
            Per-harness authentication secrets configured on this agent.
            Each field names a managed secret for the corresponding harness.
            Secrets can be overridden per run.
        on_behalf_of_enabled:
          type: boolean
          description: |
            Whether runs created with this agent's API key may use the on_behalf_of
            field to attribute runs to another team member.
        worker_host:
          type: string
          description: |
            Default worker host for runs executed by this agent, or empty
            when unset; the precedence order for worker host resolution is:
            1. The host specified on the run itself
            2. The agent's default host
            3. The workspace default host
    ListAgentIdentitiesResponse:
      type: object
      required:
        - agents
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentResponse'
    EnvironmentLastTask:
