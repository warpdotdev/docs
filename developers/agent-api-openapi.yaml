    get:
      summary: Get conversation redirect
      description: |
        Check whether a conversation should redirect to a live shared
        session, returning a session_id if the underlying ambient agent task
        still has one (or an empty object if no redirect is needed). Public
        and unauthenticated, so anonymous viewers can resolve a shared
        conversation link before signing in; access to the underlying live
        session is still gated by the session-sharing service ACLs.
      operationId: getConversationRedirect
      tags:
        - agent
      security: []
      parameters:
        - name: conversationId
          in: path
          description: The ID of the conversation
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            Redirect information. Contains session_id if redirect is needed,
            otherwise an empty object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id:
                    type: string
                    description: The shared session UUID to redirect to (only present when redirect is needed)
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
