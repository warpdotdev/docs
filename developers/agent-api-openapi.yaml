            $ref: '#/components/schemas/BenchmarkRepoRef'
    BenchmarkAgentConfigInput:
      type: object
      required:
        - agent_uid
        - harness
        - model
      properties:
        agent_uid:
          type: string
          format: uuid
        agent_name:
          type: string
        harness:
          type: string
        model:
          type: string
        harness_auth_secret_name:
          type:
            - string
            - 'null'
    BenchmarkSuite:
      type: object
      required:
        - uid
        - factory_uid
        - name
        - agent_uid
        - factory_agent_type
        - created_at
        - updated_at
      properties:
        uid:
          type: string
        factory_uid:
          type: string
        name:
          type: string
        description:
          type: string
        agent_uid:
          type: string
          description: |
            UID of the concrete Factory agent every task in this suite dispatches
            as. Must resolve to a live, available agent linked to this Factory
            whose agent_type equals factory_agent_type.
        factory_agent_type:
          type: string
          description: |
            Coarse Factory agent type of the selected agent_uid, kept in sync with
            it at save time.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        creator:
          allOf:
