          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListHandoffSnapshotAttachmentsResponse'
        '400':
          description: Missing run ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No permission to view the run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/agent/conversations/{conversation_id}/followups':
    post:
      summary: Submit a follow-up message to the run behind a conversation
      description: |
        The same operation as `POST /agent/runs/{runId}/followups`, targeted
        by the conversation the run is serving rather than the run itself.

        `attachments` must name ids prepared through
        `POST /agent/conversations/{conversation_id}/attachments/prepare` (or
        the run-keyed prepare) for the run that is newest at that time. If a
        new run appears for the conversation between prepare and follow-up,
        the follow-up resolves to the new run and answers 422
        `unknown_attachment`; prepare again. A handoff is a new execution of
        the same run and does not have this problem.

        `mode` only takes effect when the follow-up is queued ahead of the run
        starting or starts a new execution; a follow-up injected into a live
        session runs in the session's current mode.
      operationId: submitConversationFollowup
      tags:
        - agent
      security:
        - bearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          description: The UUID of the Warp-native conversation
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunFollowupRequest'
      responses:
        '200':
          description: Follow-up accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationFollowupResponse'
        '400':
          description: Invalid conversation ID or malformed payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No permission to view the conversation or to follow up on its run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The conversation has no run to steer (`reason: no_run`), for
            example a purely local, cloud-synced conversation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            An `attachment_id` is not recorded on the resolved run (`reason:
            unknown_attachment`), or more than 25 attachments were named
            (`reason: too_many_attachments`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/agent/conversations/{conversation_id}/interrupt':
    post:
      summary: Interrupt the turn running on the run behind a conversation
      description: |
        The same operation as `POST /agent/runs/{runId}/interrupt`, addressed
        by the conversation the run is serving. The run is picked with the
        same policy as the conversation follow-up route, and the caller must
        be able to view the conversation and the resolved run.
      operationId: interruptConversation
      tags:
        - agent
      security:
        - bearerAuth: []
      parameters:
        - name: conversation_id
          in: path
          description: The UUID of the Warp-native conversation
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Interrupt accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationInterruptResponse'
        '400':
          description: Invalid conversation ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No permission to view the conversation or to steer its run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The run cannot be interrupted. `reason` is one of `no_run`,
            `no_live_session`, `session_ended` or `unsupported_harness`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/agent/conversations/{conversation_id}':
