          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/{factory_uid}/benchmarks/{suite_uid}/runs/{run_uid}/results':
    get:
      summary: Get benchmark run results
      operationId: getBenchmarkRunResults
      description: |
        Retrieve aggregate outcomes, coverage, and costs for the run.
        Task and tag filters select the trials used to calculate the results.
        By default, the response contains summary fields without detailed
        metric arrays; use `include` to add those arrays.
        Configuration and scorer filters limit returned metric rows without
        changing the summary or comparison populations. Results cover the whole
        selected dataset, independently of trial-list pages, and are not paginated.
      tags:
        - factory
        - benchmark
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BenchmarkResultsInclude'
        - $ref: '#/components/parameters/BenchmarkTaskSelection'
        - $ref: '#/components/parameters/BenchmarkTagSelection'
        - $ref: '#/components/parameters/BenchmarkConfigurationProjection'
        - $ref: '#/components/parameters/BenchmarkScorerProjection'
        - $ref: '#/components/parameters/BenchmarkFactoryPath'
        - $ref: '#/components/parameters/BenchmarkSuitePath'
        - $ref: '#/components/parameters/BenchmarkRunPath'
      responses:
        '200':
          description: Results aggregate (JSON)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkResults'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: Run not found in this suite
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/{factory_uid}/benchmarks/{suite_uid}/runs/{run_uid}/trials':
    get:
      summary: List benchmark trials or find the trial for an agent run
      operationId: listBenchmarkTrials
      description: |
        Each trial represents one task, configuration, and repetition within
        the benchmark run. The response contains a page of trials in `data`
        and continuation information in `page_info`. Use `include` to add
        scores, metrics, or retained execution history to each trial.
        Repeated values match any value within a filter; different filters
        must all match.
        To find the trial for a primary agent execution, pass `agent_run_id`.
        This returns zero or one trial, with `matched_attempt_number` identifying
        the matching attempt. Judge runs and spawned descendant runs do not match.
        This lookup accepts `include` and an omitted `limit` or `limit=1`, but
        no cursor or other filters. Filtering by scorer is not supported.
      tags:
        - factory
        - benchmark
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BenchmarkFactoryPath'
        - $ref: '#/components/parameters/BenchmarkSuitePath'
        - $ref: '#/components/parameters/BenchmarkRunPath'
        - $ref: '#/components/parameters/BenchmarkTrialInclude'
        - $ref: '#/components/parameters/BenchmarkTaskSelection'
        - $ref: '#/components/parameters/BenchmarkTagSelection'
        - name: configuration_uid
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: state
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/BenchmarkTrialState'
        - name: agent_run_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          description: Pass the previous response's page_info.next_cursor with the same filters to retrieve the next page.
          schema:
            type: string
      responses:
        '200':
          description: Complete requested Trial rows on one page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkTrialList'
        '400':
          description: 'Invalid selection, include, or cursor'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Factory or Run not found or not accessible in this suite
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/{factory_uid}/benchmarks/{suite_uid}/runs/{run_uid}/trials/{trial_uid}':
    get:
      summary: Retrieve an individual benchmark trial within a run
      operationId: getBenchmarkTrial
      description: |
        Retrieve the trial's execution and scoring status for one task,
        configuration, and repetition within the run. Include results to
        retrieve its scores and metrics, or details to retrieve retained
        execution attempts and judge history. Each requested expansion is
        complete. Selection and pagination parameters are not supported.
      tags:
        - factory
        - benchmark
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BenchmarkFactoryPath'
        - $ref: '#/components/parameters/BenchmarkSuitePath'
        - $ref: '#/components/parameters/BenchmarkRunPath'
        - $ref: '#/components/parameters/BenchmarkTrialInclude'
        - name: trial_uid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Logical Trial with complete requested expansions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkTrial'
        '400':
          description: Invalid query
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Trial not found or not accessible in this Run
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  /factory-files/schemas:
    get:
      summary: List the supported Factory file schema versions
      description: |
        Returns every Factory file schema version this server can describe,
        with a link to each version's schema bundle.
      operationId: listFactoryFileSchemaVersions
      tags:
        - factory
      security: []
      parameters:
        - name: If-None-Match
          in: header
          required: false
          description: A previously returned ETag. A match returns 304 with no body.
          schema:
            type: string
      responses:
        '200':
          description: The supported schema versions
          headers:
            ETag:
              description: Strong validator derived from the response bytes
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryFileSchemaRegistry'
        '304':
          description: The cached response is still current
  '/factory-files/schemas/{schema_version}':
    get:
      summary: Get the JSON Schema bundle for one Factory file schema version
      description: |
        Returns every JSON Schema 2020-12 document describing one Factory file
        schema version, as a single bundle so the relative `$id` and `$ref`
        identities between the documents keep resolving.
      operationId: getFactoryFileSchemaBundle
      tags:
        - factory
      security: []
      parameters:
        - name: schema_version
          in: path
          required: true
          description: 'A Factory file schema version, for example `v1alpha1`.'
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          description: A previously returned ETag. A match returns 304 with no body.
          schema:
            type: string
      responses:
        '200':
          description: The schema documents for this version
          headers:
            ETag:
              description: Strong validator derived from the response bytes
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryFileSchemaBundle'
        '304':
          description: The cached response is still current
        '404':
          description: The schema version is not supported by this server
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory-files/schemas/{schema_version}/{document}':
    get:
      summary: Get one Factory file schema document
      description: |
        Returns a single generated JSON Schema document on its own, rather
        than inside the bundle envelope, so it can be used directly as a
        schema reference. A document served here resolves its relative
        `$ref`s against its siblings at this same path, which is what each
        document's `$id` assumes, making the URL usable directly from an
        editor or YAML language server, for example:

        ```yaml
        # yaml-language-server: $schema=/api/v1/factory-files/schemas/v1alpha1/factory.schema.json
        ```
      operationId: getFactoryFileSchemaDocument
      tags:
        - factory
      security: []
      parameters:
        - name: schema_version
          in: path
          required: true
          schema:
            type: string
          description: 'Factory file schema version, such as v1alpha1'
        - name: document
          in: path
          required: true
          schema:
            type: string
          description: |
            Document file name: common.schema.json, factory.schema.json,
            agent.schema.json, automation.schema.json, runner.schema.json, or
            scorer.schema.json
      responses:
        '200':
          description: The requested JSON Schema document
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: The version or the document is unknown
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Authentication via a Warp API key or a supported Warp-issued user token.
  parameters:
    PresignedDownloadRedirect:
      name: redirect
      in: query
      required: false
      description: Set to false to return a signed storage URL as JSON rather than redirecting.
      schema:
        type: boolean
        default: true
    BenchmarkFactoryPath:
      name: factory_uid
      in: path
      description: UID of the factory that owns the benchmark suite.
      required: true
      schema:
        type: string
    BenchmarkSuitePath:
      name: suite_uid
      in: path
      description: UID of the benchmark suite within this factory.
      required: true
      schema:
        type: string
    BenchmarkRunPath:
      name: run_uid
      in: path
      description: UID of the benchmark run within this suite.
      required: true
      schema:
        type: string
    BenchmarkRunInclude:
      name: include
      in: query
      description: |
        Controls additional fields in each returned run object. `details` adds
        launch settings, including tasks, configurations, repetitions, and scorers.
        `summary_results` adds aggregate results for the entire run.
        `creator_display_name` adds `creator.display_name` when the creator is
        known; the name is null if unavailable. Unrequested fields are omitted.
        Repeat this parameter to include multiple fields, for example
        `include=details&include=summary_results`. Values are case-sensitive;
        empty, comma-separated, and unknown values are invalid.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - details
            - summary_results
            - creator_display_name
    BenchmarkTrialInclude:
      name: include
      in: query
      description: |
        Controls additional fields in each returned trial object. `results` adds
        scores, metrics, and spend. `details` adds retained execution attempts and
        judge-run history. Request either or both; unrequested fields are omitted.
        Each requested field contains all available entries, not a separate page.
        Repeat this parameter to request both, for example
        `include=results&include=details`. Values are case-sensitive;
        empty, comma-separated, and unknown values are invalid.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - results
            - details
    BenchmarkResultsInclude:
      name: include
      in: query
      description: |
        Controls which detailed metric arrays appear alongside the result summary.
        Each value adds the response field with the same name; unrequested arrays
        are omitted. Requested arrays contain every matching entry and are empty,
        never null, when there are no entries. This response is not paginated.
        Repeat this parameter to request multiple arrays, for example
        `include=configuration_metrics&include=agent_metrics`. Values are
        case-sensitive; empty, comma-separated, and unknown values are invalid.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - configuration_metrics
            - scorer_configuration_metrics
            - task_scorer_configuration_metrics
            - agent_metrics
    BenchmarkTaskSelection:
      name: task_uid
      in: query
      description: |
        Select trials or result aggregates for these task UIDs, using the tasks
        recorded when the run was launched. Repeat to match any specified task.
        Result summaries and metrics are calculated only from the selected tasks.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    BenchmarkTagSelection:
      name: tag
      in: query
      description: |
        Select trials or result aggregates by task tags recorded when the run was
        launched. Repeat to match any specified tag; matching is case-sensitive.
        Result summaries and metrics are calculated only from the selected tasks.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    BenchmarkConfigurationProjection:
      name: configuration_uid
      in: query
      description: |
        Return detailed metric rows only for these configuration UIDs. Summary
        counts and comparison populations still cover all configurations in the
        selected dataset. Repeat to return multiple configurations.
        Requires at least one metric array requested through `include`.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    BenchmarkScorerProjection:
      name: scorer_uid
      in: query
      description: |
        Return scorer-specific metric rows only for these scorer UIDs. Overall
        results and comparison populations still cover all applicable scorers.
        Repeat to return multiple scorers. Requires
        `include=scorer_configuration_metrics` or
        `include=task_scorer_configuration_metrics`.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    TeamUidHeaderParam:
      name: X-Warp-Team-Uid
      in: header
      required: false
      description: |
        UID of the team to use as the request's active team. Ignored for
        service-account callers, which always act as their bound team.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    FactoryBranchStatusResponse:
      description: Current observation of the tracked Branch
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FactoryBranchStatus'
    FactoryBranchNotFound:
      description: 'Hidden Factory, unknown or cross-Factory tracking, or disabled Branch surface'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    FactoryBranchConflict:
      description: |
        Classified conflict with reason branch_sync_pending, branch_head_moved,
        factory_source_changed, branch_deleted, or factory_scope_unavailable.
        Pending synchronization, moving heads, and source changes are retryable;
        deleted or unavailable identity is not.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    FactoryBranchUnavailable:
      description: 'Retryable resource_unavailable for source, synchronization, or database failure'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    FactoryAccessDenied:
      description: Factory access is not enabled for the authenticated principal
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    FactoryMetricsRateLimited:
      description: |
        The caller has used up the request budget shared by the factory
        metrics endpoints. Wait the number of seconds in Retry-After, then
        retry.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    EgressRangesResponse:
      type: object
      required:
        - cidrs
      properties:
        cidrs:
          type: array
          items:
            type: string
          description: 'Canonical, deduplicated IPv4 and IPv6 network ranges.'
    FactoryFileSchemaRegistry:
      type: object
      description: The Factory file schema versions a server can describe.
      required:
        - current_version
        - versions
      properties:
        current_version:
          type: string
          description: The version a new Factory tree should declare.
          examples:
            - v1alpha1
        versions:
          type: array
          description: 'Every supported version, sorted by schema version.'
          items:
            $ref: '#/components/schemas/FactoryFileSchemaVersionRef'
    FactoryFileSchemaVersionRef:
      type: object
      required:
        - schema_version
        - schema_url
      properties:
        schema_version:
          type: string
          examples:
            - v1alpha1
        schema_url:
          type: string
          description: Root-relative path of this version's schema bundle.
          examples:
            - /api/v1/factory-files/schemas/v1alpha1
    FactoryFileSchemaBundle:
      type: object
      description: |
        Every JSON Schema document describing one Factory file schema version.
        The envelope is plain JSON; each value in `documents` is a JSON Schema
        2020-12 document keyed by its `$id`.
      required:
        - schema_version
        - documents
      properties:
        schema_version:
          type: string
          examples:
            - v1alpha1
        documents:
          type: object
          description: 'Schema documents keyed by file name, which is also each document''s $id.'
          additionalProperties:
            description: A JSON Schema 2020-12 document.
    Factory:
      type: object
      description: Public representation of a factory.
      required:
        - uid
        - team_uid
        - name
        - description
        - alias
        - avatar_url
        - code_forge
        - code_forges
        - repositories
        - default_environment
        - default_model
        - scoring
        - credential_strategy
        - integrations
        - agent_defaults
        - scorer_defaults
        - created_at
        - updated_at
      properties:
        uid:
          type: string
          description: Public UID of the factory.
        team_uid:
          type: string
          description: Public UID of the team that owns the factory.
        name:
          type: string
          description: Display name of the factory.
        description:
          type:
            - string
            - 'null'
          description: Optional description of the factory.
        alias:
          type:
            - string
            - 'null'
          description: |
            Optional display handle for the factory, unique across the team's
            Warp workspace when set.
        avatar_url:
          type:
            - string
            - 'null'
          description: |
            Short-lived signed URL for displaying the factory's avatar. The URL
            may change between reads.
        code_forge:
          $ref: '#/components/schemas/FactoryCodeForge'
        code_forges:
          type: array
          items:
            $ref: '#/components/schemas/FactoryCodeForge'
          description: |
            Effective source-control providers for the factory. When the
            effective set is empty, this contains the primary code_forge.
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/FactoryRepository'
          description: 'Repositories scoped to the factory, independent of its default environment.'
        default_environment:
          type:
            - string
            - 'null'
          description: |
            Public UID of the factory's default environment. File-managed
            factories may omit this default.
        default_model:
          type:
            - string
            - 'null'
          description: |
            The default model ID for the factory's runs. File-managed factories
            may omit this default. Live-managed create and PATCH requests still
            capture a concrete validated model ID.
        scoring:
          $ref: '#/components/schemas/FactoryScoringConfig'
        self_improvement:
          allOf:
            - $ref: '#/components/schemas/FactorySelfImprovementConfig'
          readOnly: true
          description: 'Self-improvement settings from the Factory YAML. Omitted when none are declared, in which case `self_improvement_defaults` apply.'
        self_improvement_defaults:
          allOf:
            - $ref: '#/components/schemas/FactorySelfImprovementDefaults'
          readOnly: true
          description: Server defaults applied to self-improvement settings the Factory does not declare.
        credential_strategy:
          allOf:
            - $ref: '#/components/schemas/FactoryCredentialStrategy'
          description: |
            Default credential strategy for runs executed by the factory's
            named agents. Always a concrete value; factories default to
            EXECUTOR unless explicitly set to CREATOR.
        integrations:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/FactoryIntegration'
          description: |
            Integration providers attached to the factory, independent of the
            automation triggers configured for it. null means the factory has
            not declared anything yet; an empty array means no providers are
            attached.
        agent_defaults:
          $ref: '#/components/schemas/FactoryAgentDefaults'
        scorer_defaults:
          $ref: '#/components/schemas/FactoryScorerDefaults'
        creator:
          allOf:
            - $ref: '#/components/schemas/FactoryCreator'
          description: |
            The user who created the factory. Absent when there is no
            resolvable creator: the factory predates creator tracking, it was
            created by a service account, or the creating user's account no
            longer exists.
        created_at:
          type: string
          format: date-time
          description: Time the factory was created.
        updated_at:
          type: string
          format: date-time
          description: Time the factory was last updated.
    FactoryCreator:
      type: object
      description: 'The user who created a factory, when resolvable.'
      required:
        - uid
      properties:
        uid:
          type: string
          description: Firebase UID of the user who created the factory.
        email:
          type:
            - string
            - 'null'
          description: 'Creator''s email, when available.'
    FactoryAgentDefaults:
      type: object
      description: |
        Default execution settings inherited by the factory's named agents
        when they declare no override of their own.
      required:
        - default_runner_uid
        - secrets
        - mcp_servers
        - worker_host
      properties:
        harness:
          allOf:
            - $ref: '#/components/schemas/Harness'
          description: |
            Default harness for the factory's named agents. Absent when the
            factory defaults to Warp's built-in harness. model_id and
            reasoning_level carry the harness-scoped default model, which is
            also reported in the factory's default_model.
        harness_auth_secrets:
          allOf:
            - $ref: '#/components/schemas/HarnessAuthSecrets'
          description: |
            Per-harness authentication secrets inherited by the factory's
            named agents. Only the secret for the default harness is ever
            populated. A third-party default harness with no secret here
            takes its credentials from the worker environment.
        default_runner_uid:
          type: string
          description: |
            Default runner UID for the factory's named agents. Empty when
            unset, in which case the environment's default runner applies.
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SecretRef'
          description: Secrets attached to the factory's named agents by default.
        mcp_servers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MCPServerConfig'
          description: |
            MCP server configurations attached to the factory's named agents
            by default. Only warp_id (managed MCP) entries are representable
            for a Warp-managed factory.
        worker_host:
          type: string
          description: |
            Default worker host for the factory's named agents. Empty when
            unset, in which case the workspace default applies.
    FactoryScorerDefaults:
      type: object
      description: |
        Sparse execution defaults for scorers. An omitted field inherits the
        corresponding agent default; an explicit empty collection overrides
        the agent default with no values.
      properties:
        default_runner_uid:
          type: string
          description: Default runner UID for scorers. Omitted to inherit the agent default.
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SecretRef'
          description: |
            Scorer-default secrets. Omitted to inherit the agent defaults; an
            empty array explicitly clears them.
        mcp_servers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MCPServerConfig'
          description: |
            Scorer-default MCP servers. Omitted to inherit the agent defaults;
            an empty object explicitly clears them.
    FactorySelfImprovementConfig:
      type: object
      properties:
        reviewer_type:
          type: string
          enum:
            - none
            - admins
            - team
            - custom
          description: 'Owning-team pool from which one eligible reviewer is randomly selected for self-improvement pull requests and Factory reviews in GitHub-managed or Warp-managed Factories. `admins` requests a team admin or owner. `team` requests any team member. `custom` requests a member listed in `reviewer_emails`. `none` explicitly disables reviewer assignment. Omitted when the Factory declares no pool, in which case `self_improvement_defaults.reviewer_type` applies.'
        failed_run_threshold:
          type: integer
          minimum: 1
          maximum: 50
          description: 'Per-agent count of distinct scored-failing source runs required for scheduled self-improvement. Must be between 1 and 50: one self-improvement run can triage at most 50 failure findings. Omitted to use the server default. The age-based flush and manual dispatch are unchanged.'
        reviewer_emails:
          type: array
          items:
            type: string
            format: email
          description: 'Owning-team member emails reviewers are chosen from. Only allowed when `reviewer_type` is `custom`: a Factory YAML change that sets emails with any other reviewer type fails validation, including the pull request check.'
        model:
          type: string
          description: 'The model self-improvement runs use, as a model ID or custom model router key. Falls back to `self_improvement_defaults.model` when not provided.'
    FactorySelfImprovementDefaults:
      type: object
      required:
        - failed_run_threshold
        - reviewer_type
        - model
      properties:
        reviewer_type:
          type: string
          enum:
            - none
            - admins
            - team
          description: Reviewer pool used when the Factory declares no `reviewer_type`.
        model:
          type: string
          description: Model self-improvement runs use when the Factory declares no `model`.
        failed_run_threshold:
          type: integer
          minimum: 1
          maximum: 50
          description: Per-agent count of distinct scored-failing source runs that triggers scheduled self-improvement when the Factory declares no `failed_run_threshold`.
    FactoryScoringConfig:
      type: object
      required:
        - default_model
      properties:
        default_model:
          type:
            - string
            - 'null'
          description: |
            Optional factory override for the model used by managed scorers and
            scorer-creation prefills. null or absent resolves to the platform
            judge default. User-created scorers still require an explicit
            model_id on create.
    FactoryIntegration:
      type: object
      description: |
        An integration provider attached to a factory.
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/FactoryIntegrationProvider'
        linear:
          oneOf:
            - $ref: '#/components/schemas/FactoryLinearIntegrationSettings'
            - type: 'null'
          description: |
            Linear team IDs from earlier integration selections, when present.
            Issue discovery follows enabled agent-session automations instead.
        jira:
          oneOf:
            - $ref: '#/components/schemas/FactoryJiraIntegrationSettings'
            - type: 'null'
          description: |
            Jira project keys from earlier integration selections, when present.
            Issue discovery follows enabled agent-session automations instead.
        slack:
          oneOf:
            - $ref: '#/components/schemas/FactorySlackIntegrationSettings'
            - type: 'null'
          description: |
            Persisted Slack settings. Present only when type is slack and the
            factory has declared at least one Slack setting. Omitted fields
            keep their default-on behavior.
        microsoft-teams:
          oneOf:
            - $ref: '#/components/schemas/FactoryTeamsIntegrationSettings'
            - type: 'null'
          description: |
            Persisted Teams reply settings. Valid only when type is
            microsoft-teams. Omitted settings remain undeclared.
    FactoryLinearIntegrationSettings:
      type: object
      required:
        - team_ids
      properties:
        team_ids:
          type: array
          description: |
            Linear team IDs for the one-time agent-session automation seed.
            Discovery follows enabled seated automation filters afterward.
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            pattern: .*\S.*
    FactorySlackIntegrationSettings:
      description: |
        Persisted Slack settings on a factory integration. Omitted fields keep
        their default-on behavior.
      allOf:
        - $ref: '#/components/schemas/FactoryThreadReplySettings'
    FactoryTeamsIntegrationSettings:
      description: Persisted Teams reply settings on a factory integration.
      allOf:
        - $ref: '#/components/schemas/FactoryThreadReplySettings'
    FactoryThreadReplySettings:
      type: object
      description: |
        Plain channel-thread reply settings. These apply when the shared
        per-Factory reply-setting rollout is enabled.
      properties:
        auto_respond_to_thread_replies:
          type:
            - boolean
            - 'null'
          description: |
            When true, eligible plain channel thread replies still reach the
            reply-intent classifier. When false, those replies are ignored
            unless they @-mention the Factory. Each provider defines the
            omitted default. Direct messages are unchanged.
    FactoryJiraIntegrationSettings:
      type: object
      required:
        - project_keys
      properties:
        project_keys:
          type: array
          description: |
            Jira project keys (for example APP, not the numeric project ID)
            for the one-time agent-session automation seed. Discovery follows
            enabled seated automation filters afterward.
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            pattern: .*\S.*
    FactoryIntegrationProvider:
      type: string
      description: |
        Integration provider that can be attached to a factory. github is not
        accepted here; repository access comes from the factory's code forge.
      enum:
        - jira
        - linear
        - microsoft-teams
        - slack
    FactoryCodeForge:
      type: string
      description: |
        Primary source-control provider for the factory. GITHUB and GITLAB
        identify the compatibility primary when repositories span one or more
        forges. AZURE_DEVOPS identifies Azure Repos. NONE declares a repo-less factory with no native repositories;
        its environment relies on setup_commands to clone from any host.
      enum:
        - GITHUB
        - GITLAB
        - AZURE_DEVOPS
        - NONE
    FactoryRepositoryCodeForge:
      type: string
      description: The concrete source-control provider hosting a repository.
      enum:
        - GITHUB
        - GITLAB
        - AZURE_DEVOPS
    FactoryCredentialStrategy:
      type: string
      description: |
        Default credential strategy for runs executed by the factory's named
        agents.
        - EXECUTOR (default): runs authenticate with the named agent's own
          credentials (e.g. a GitHub App installation token for the
          factory's team).
        - CREATOR: runs authenticate with the credentials of the principal
          that created the run.
      enum:
        - CREATOR
        - EXECUTOR
    FactoryRepository:
      type: object
      description: A repository scoped to a factory.
      required:
        - owner
        - repo
      properties:
        owner:
          type: string
          description: Repository owner (or full namespace for GitLab).
        repo:
          type: string
          description: Repository name.
        code_forge:
          allOf:
            - $ref: '#/components/schemas/FactoryRepositoryCodeForge'
          description: |
            The concrete forge hosting this repository. Omitted means the
            factory's primary code_forge.
        provider_metadata:
          type: object
          additionalProperties:
            type: string
          description: 'Provider-specific repository identity and settings, such as the Azure DevOps organization, project ID, and repository ID.'
    FactoryTaskStage:
      type: string
      description: |
        Lifecycle stage of a factory task, mirroring the seeded factory agent
        roles plus the terminal COMPLETE and CANCELLED states. COMPLETE and
        CANCELLED are terminal in intent but not enforced: any stage may be
        written explicitly at any time. CANCELLED is set automatically when
        the task's current top-level run is cancelled, regardless of that
        run's agent type.
      enum:
        - TRIAGE
        - SPEC
        - IMPLEMENT
        - REVIEW
        - COMPLETE
        - CANCELLED
    FactoryTaskCurrentRun:
      type: object
      description: |
        A factory task's current top-level run, resolved from the bound
        conversation at read time. This differs from FactoryTask.run_id,
        which is a creation-time provenance snapshot and is never updated.
      required:
        - run_id
        - state
        - is_run_type_cancellable
      properties:
        run_id:
          type: string
          description: ID of the task's current top-level (root) run.
        state:
          $ref: '#/components/schemas/RunState'
        is_run_type_cancellable:
          type: boolean
          description: |
            Whether the current run's type is eligible for cancellation via
            the API. State-independent; clients should also gate on state.
    FactoryTask:
      type: object
      description: |
        A factory task: the unit of work in a factory, bound to the agent
        conversation that owns it.
      required:
        - uid
        - factory_uid
        - conversation_id
        - run_id
        - title
        - stage
        - created_at
        - updated_at
      properties:
        config_source:
          allOf:
            - $ref: '#/components/schemas/FactoryConfigSource'
          description: |
            Derived from the immutable stored creation run_id, never the
            conversation's latest run. Omitted when any required association
            has been purged or provenance is otherwise unavailable.
        uid:
          type: string
          description: Public UID of the task.
        factory_uid:
          type: string
          description: Public UID of the factory the task belongs to. Fixed at creation.
        conversation_id:
          type: string
          description: UUID of the agent conversation the task is bound to.
        run_id:
          type: string
          description: |
            ID of the bound conversation's most recent run at task creation.
            This is a provenance snapshot and is not updated afterward;
            consumers needing the conversation's live latest run should
            resolve it via the conversation.
        author:
          allOf:
            - $ref: '#/components/schemas/RunCreatorInfo'
          description: |
            Creator of the run captured by run_id. Omitted when the creation
            run or its creator principal can no longer be resolved.
        title:
          type: string
          description: Human-readable title of the task.
        ticket_source:
          type: string
          description: |
            Canonical ticket source from the bound run. Present on list
            responses only when full_list=true and ticket metadata exists.
        ticket_id:
          type: string
          description: |
            Canonical ticket ID from the bound run. Present on list responses
            only when full_list=true and ticket metadata exists.
        description:
          type:
            - string
            - 'null'
          description: Optional description of the task.
        stage:
          $ref: '#/components/schemas/FactoryTaskStage'
        created_at:
          type: string
          format: date-time
          description: Time the task was created.
        updated_at:
          type: string
          format: date-time
          description: |
            Time the task was last created, updated, or deleted. Artifact
            reporting does not bump this; new outputs appear on the next
            detail read.
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactItem'
          description: |
            Derived outputs, newest-first: PULL_REQUEST, EXTERNAL_REFERENCE,
            SCREENSHOT, and FILE artifacts (video recordings are FILE
            artifacts). Present on single-task reads (by uid, by
            conversation, and by run), where outputs are derived from the
            task's whole run tree (every run bound to the conversation plus
            the runs dispatched under them). On list responses with
            full_list=true, outputs are derived from the bound conversation
            only, not the wider run tree.
        current_run:
          allOf:
            - $ref: '#/components/schemas/FactoryTaskCurrentRun'
          description: |
            The task's current top-level run, resolved at read time. Present
            on single-task reads (by uid, by conversation, and after a stop
            request), and on list responses when include_current_run=true;
            omitted when no current root run can be resolved.
    FactoryTaskNotificationKind:
      type: string
      description: The action requested by a Factory notification.
      enum:
        - question
        - answer_question
        - spec_review
        - pr_review
        - blocked
        - failed
    FactoryInboxScope:
      type: string
      description: Personal or team-wide Factory Inbox visibility.
      enum:
        - mine
        - team
      default: mine
    FactoryInboxRecipient:
      type: object
      description: Minimal public identity for a live notification recipient.
      required:
        - uid
      properties:
        uid:
          type: string
          description: Public Warp user UID.
        email:
          type: string
          format: email
          description: 'Recipient email, when available.'
    FactoryAttentionQuestion:
      type: object
      required:
        - id
        - question
        - type
        - options
      properties:
        id:
          type: string
        question:
          type: string
        type:
          type: string
          enum:
            - single_select
            - multi_select
        options:
          type: array
          items:
            type: string
        recommended_option_index:
          type: integer
    FactoryInboxArtifact:
      type: object
      description: An inbox artifact link with an optional provider PR/MR title.
      required:
        - url
      properties:
        url:
          type: string
          description: Artifact URL.
        title:
          type: string
          description: 'Known provider PR/MR title, when available.'
    FactoryInboxItem:
      type: object
      description: One shared unresolved notification in the Factory Inbox.
      required:
        - notification_uid
        - factory_uid
        - factory_task_uid
        - title
        - stage
        - kind
        - created_at
        - recipients
      properties:
        notification_uid:
          type: string
          description: Identifier accepted by the dismiss endpoint.
        factory_uid:
          type: string
        factory_task_uid:
          type: string
        title:
          type: string
          description: Notification headline.
        stage:
          $ref: '#/components/schemas/FactoryTaskStage'
        kind:
          allOf:
            - $ref: '#/components/schemas/FactoryTaskNotificationKind'
        is_read:
          type: boolean
          description: |
            Whether the authenticated user has read this notification.
            Always present in `mine` scope, including when false.
            Omitted in `team` scope, even when filtering by recipient.
        description:
          type: string
          description: 'Notification body, when present.'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/FactoryAttentionQuestion'
        origin_link:
          type: string
          description: 'Server-derived link back to the task''s origin, when present.'
        url:
          type: string
          description: Legacy first artifact URL supplied by a review notification.
        urls:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
          description: Legacy artifact URLs; prefer artifacts for links and titles.
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/FactoryInboxArtifact'
          description: Ordered artifact links with optional provider PR/MR titles.
        run_id:
          type: string
          minLength: 1
          description: |
            Producing run ID from factory_task_notifications.created_by_run_id.
            Present when the producing run is known.
        created_at:
          type: string
          format: date-time
          description: Notification declaration time.
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/FactoryInboxRecipient'
          description: |
            Live, undismissed recipients for this shared notification, sorted
            deterministically. Slack routing and personal dismissal state are
            not exposed.
    ListFactoryInboxResponse:
      type: object
      required:
        - items
        - page_info
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FactoryInboxItem'
        page_info:
          $ref: '#/components/schemas/PageInfo'
    FactoryInboxMutationRequest:
      type: object
      required:
        - notification_uids
      properties:
        notification_uids:
          type: array
          minItems: 1
          maxItems: 10000
          uniqueItems: true
          items:
            type: string
    FactoryInboxMutationOutcome:
      type: object
      required:
        - notification_uid
        - ok
      properties:
        notification_uid:
          type: string
        ok:
          type: boolean
    FactoryInboxMutationResponse:
      type: object
      required:
        - outcomes
      properties:
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/FactoryInboxMutationOutcome'
    FactoryTaskCreateRequest:
      type: object
      description: Request body for creating a factory task.
      required:
        - title
        - conversation_id
      properties:
        title:
          type: string
          description: Human-readable title of the task. Required and non-empty.
        conversation_id:
          type: string
          description: |
            UUID of the agent conversation to bind the task to. The
            conversation's most recent run must be owned by the factory's
            team, and the conversation must not already be bound to a live
            task. Confirmed Branch scope must belong to the requested
            Factory. Binding cannot grant execution scope.
        description:
          type:
            - string
            - 'null'
          description: Optional description of the task.
        stage:
          $ref: '#/components/schemas/FactoryTaskStage'
    FactoryTaskPatchRequest:
      type: object
      description: |
        Request body for partially updating a factory task. Omitted fields
        preserve their current values; last write wins.
      properties:
        title:
          type: string
          description: Updated title. Must be non-empty when provided.
        description:
          type:
            - string
            - 'null'
          description: Updated description. null or an empty string clears the description.
        stage:
          $ref: '#/components/schemas/FactoryTaskStage'
    ListFactoryTasksResponse:
      type: object
      required:
        - tasks
        - page_info
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/FactoryTask'
          description: 'One page of the factory''s tasks, in the requested sort order.'
        page_info:
          $ref: '#/components/schemas/PageInfo'
    FactoryMetricsGroupByPeriod:
      type: string
      description: |
        Binning granularity for factory metrics series. Weeks start on
        Sunday (UTC), consistent with existing Warp analytics.
      enum:
        - day
        - week
        - month
    FactoryDollarsBreakdown:
      type: object
      description: |
        US dollars the owning team was billed, split by source component:
        compute (run execution), platform, and inference (recorded per
        conversation and counted once per distinct conversation). total is
        the sum of the three. Each charge contributes its recorded billed
        amount; charges recorded before billed amounts were tracked fall
        back to an estimated cost.
      required:
        - compute
        - platform
        - inference
        - total
      properties:
        compute:
          type: number
          format: double
        platform:
          type: number
          format: double
        inference:
          type: number
          format: double
        total:
          type: number
          format: double
    FactoryDollarsBreakdownSeries:
      type: object
      description: |
        Per-period dollar series aligned to period_list, zero-filled for
        periods with no attributed cost.
      required:
        - compute
        - platform
        - inference
        - total
      properties:
        compute:
          type: array
          items:
            type: number
            format: double
        platform:
          type: array
          items:
            type: number
            format: double
        inference:
          type: array
          items:
            type: number
            format: double
        total:
          type: array
          items:
            type: number
            format: double
    FactoryMetricCount:
      type: object
      description: |
        A count metric: the aggregate total over the range, plus a
        per-period series when group_by_period was requested. Grouped
        breakdowns (drill-down) may be added as new fields in the future.
      required:
        - total
      properties:
        total:
          type: integer
          format: int64
        series:
          type: array
          description: |
            One entry per period_list entry, zero-filled. Present only when
            group_by_period was requested.
          items:
            type: integer
            format: int64
    FactoryAverageMetric:
      type: object
      description: |
        An average-valued metric: the aggregate average over the range,
        plus a per-period series when group_by_period was requested.
        The aggregate and periods with no qualifying PRs read zero.
      required:
        - average
      properties:
        average:
          type: number
          format: double
          description: Average value over the range; zero when no PRs qualified.
        series:
          type: array
          description: |
            One entry per period_list entry, zero-filled. Present only when
            group_by_period was requested.
          items:
            type: number
            format: double
    FactoryCostPerPRSeries:
      type: object
      description: 'Per-period cost-per-PR series, aligned to period_list.'
      required:
        - pr_count
        - dollars
        - mean
        - compute_mean
        - platform_mean
        - inference_mean
      properties:
        pr_count:
          type: array
          description: Distinct PRs first seen in each period.
          items:
            type: integer
            format: int64
        dollars:
          $ref: '#/components/schemas/FactoryDollarsBreakdownSeries'
        mean:
          type: array
          description: |
            Mean per-PR attributed cost per period, in US dollars; null
            for periods with zero PRs.
          items:
            type:
              - number
              - 'null'
            format: double
        compute_mean:
          type: array
          description: |
            Mean per-PR compute cost per period, in US dollars; null for
            periods with zero PRs.
          items:
            type:
              - number
              - 'null'
            format: double
        platform_mean:
          type: array
          description: |
            Mean per-PR platform cost per period, in US dollars; null for
            periods with zero PRs.
          items:
            type:
              - number
              - 'null'
            format: double
        inference_mean:
          type: array
          description: |
            Mean per-PR inference cost per period, in US dollars; null for
            periods with zero PRs.
          items:
            type:
              - number
              - 'null'
            format: double
    FactoryCostPerPRMetric:
      type: object
      description: |
        Cost per PR over the range, in US dollars: the cost of the run trees
        that produced PRs (split evenly across each tree's PRs so a cost is
        never double-counted), reported as the arithmetic mean of the
        per-PR costs.
      required:
        - pr_count
        - dollars
        - mean
      properties:
        pr_count:
          type: integer
          format: int64
          description: |
            Distinct PRs (deduped by URL) first seen in the range. Matches
            pr_count.total today; kept separate so the cost denominator can
            diverge (e.g. merged-only) in the future.
        dollars:
          $ref: '#/components/schemas/FactoryDollarsBreakdown'
        mean:
          type:
            - number
            - 'null'
          format: double
          description: |
            Mean per-PR attributed cost, in US dollars; null when
            pr_count is 0.
        series:
          $ref: '#/components/schemas/FactoryCostPerPRSeries'
    FactoryCostPerPRResponse:
      allOf:
        - $ref: '#/components/schemas/FactoryMetricsEnvelope'
        - type: object
          required:
            - data
          properties:
            group_by_period:
              $ref: '#/components/schemas/FactoryMetricsGroupByPeriod'
            period_list:
              type: array
              description: |
                Period labels every series aligns to (dates like 2026-07-01;
                weeks labeled by their Sunday start date). Present only when
                group_by_period was requested.
              items:
                type: string
            data:
              $ref: '#/components/schemas/FactoryCostPerPRMetric'
    FactoryCostBreakdownGroupBy:
      type: string
      description: |
        Grouping dimension for the cost-breakdown metric. source and user
        roll each run tree's cost to the root run; agent and model keep
        each run's own cost.
      enum:
        - source
        - user
        - agent
        - model
    FactoryCostBreakdownGroup:
      type: object
      description: |
        One group of the cost breakdown. key is the group's stable identity
        (dimension-specific: source type, user principal, agent uuid, or
        model id); UNKNOWN is reserved for missing/unresolvable values.
        label carries a server-resolved display name and is absent where
        the key is already the display form. deleted is true when the
        entity behind a User or Agent key has been soft-deleted since
        incurring the spend; always false for Source/Model and UNKNOWN.
      required:
        - key
        - deleted
        - dollars
      properties:
        key:
          type: string
        label:
          type: string
        deleted:
          type: boolean
        photo_url:
          type: string
          description: Avatar URL when the group is a user with a resolvable photo.
        dollars:
          $ref: '#/components/schemas/FactoryDollarsBreakdown'
        series:
          allOf:
            - $ref: '#/components/schemas/FactoryDollarsBreakdownSeries'
          description: |
            One entry per period_list entry, zero-filled. Present only when
            group_by_period was requested.
    FactoryCostBreakdownData:
      type: object
      description: |
        Grouped spend. Groups are ordered by total descending (key
        ascending on ties) with UNKNOWN always last. The server never caps
        or folds groups — every entity with nonzero spend is listed.
      required:
        - total
        - groups
      properties:
        total:
          $ref: '#/components/schemas/FactoryDollarsBreakdown'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/FactoryCostBreakdownGroup'
    FactoryCostBreakdownResponse:
      allOf:
        - $ref: '#/components/schemas/FactoryMetricsEnvelope'
        - type: object
          required:
            - group_by
            - data
          properties:
            group_by:
              $ref: '#/components/schemas/FactoryCostBreakdownGroupBy'
            group_by_period:
              $ref: '#/components/schemas/FactoryMetricsGroupByPeriod'
            period_list:
              type: array
              description: |
                Period labels every series aligns to (dates like 2026-07-01;
                weeks labeled by their Sunday start date). Present only when
                group_by_period was requested.
              items:
                type: string
            data:
              $ref: '#/components/schemas/FactoryCostBreakdownData'
    FactoryMetricsData:
      type: object
      required:
        - run_count
        - pr_count
        - merged_pr_count
        - autonomy_funnel
        - impact
        - pr_latency
        - average_human_interactions_per_pr
      properties:
        run_count:
          $ref: '#/components/schemas/FactoryMetricCount'
        pr_count:
          $ref: '#/components/schemas/FactoryMetricCount'
        merged_pr_count:
          allOf:
            - $ref: '#/components/schemas/FactoryMetricCount'
          description: |
            Merged PRs, bucketed by the day the PR was created (merge day
            when the creation time was never observed) so the series reads
            as a cohort of pr_count: of the PRs from a period, how many
            eventually merged. A recent period's value can therefore rise
            later as its open PRs merge. Sourced from webhook-collected PR
            facts, so coverage starts when collection began; earlier periods
            read zero.
        autonomy_funnel:
          $ref: '#/components/schemas/FactoryAutonomyFunnel'
        impact:
          $ref: '#/components/schemas/FactoryImpact'
        pr_latency:
          $ref: '#/components/schemas/FactoryPRLatency'
        average_human_interactions_per_pr:
          allOf:
            - $ref: '#/components/schemas/FactoryAverageMetric'
          description: |
            Average qualifying human interactions per factory-attributed PR
            in the range. The numerator includes live PR interactions with a
            present, non-bot, non-GitHub-App actor and live delivered human
            Slack or Linear follow-ups. Every attributed PR is included in
            the denominator, including those with zero interactions. Sourced
            from webhook-collected PR facts, so coverage starts when
            collection began.
    FactoryAutonomyFunnel:
      type: object
      description: |
        Autonomy funnel over PRs merged in the range, counted by merge time
        (merged_at in [start_date, end_date)); merged rows with no recorded
        merge time are excluded, unlike merged_pr_count's opened-day cohort.
        total_merged is scoped to the factory's configured repositories
        while the factory_* stages follow run linkage regardless of
        repository, so factory_merged can exceed total_merged when a
        repository was renamed or removed — clients should clamp. Human
        code-change verdicts are only complete for PRs whose open event was
        observed (factory_merged_observed); sourced from webhook-collected PR
        facts, so coverage starts when collection began.
      required:
        - total_merged
        - factory_merged
        - factory_merged_observed
        - merged_without_human_code_change
        - repos
      properties:
        total_merged:
          type: integer
          format: int64
          description: |
            All merged PRs — human- and agent-authored — in the factory's
            configured repositories.
        factory_merged:
          type: integer
          format: int64
          description: Merged PRs produced by this factory's runs.
        factory_merged_observed:
          type: integer
          format: int64
          description: |
            factory_merged restricted to PRs whose full history was
            observed; the autonomy denominator.
        merged_without_human_code_change:
          type: integer
          format: int64
          description: |
            Observed merges where no person changed the code — the autonomy
            numerator. A person opening the PR or pushing to it is a code
            change; comments, reviews, and PR actions are not.
        repos:
          type: array
          items:
            type: string
          description: |
            The repositories total_merged was scoped to, as "owner/repo",
            deduplicated in configuration order: the factory's configured
            repositories as of this request, matched against PR facts by
            their current provider name.
    FactoryImpact:
      type: object
      description: |
        Lines-changed impact of the factory's PRs merged in the range,
        counted by merge time like autonomy_funnel; merged rows with no
        recorded merge time are excluded. Line counts are snapshotted from
        webhook payloads and can be unobserved, so additions/deletions sum
        only the measured_pr_count PRs where both were recorded.
      required:
        - additions
        - deletions
        - merged_pr_count
        - measured_pr_count
      properties:
        additions:
          type: integer
          format: int64
          description: Lines added across the measured merged PRs.
        deletions:
          type: integer
          format: int64
          description: Lines deleted across the measured merged PRs.
        merged_pr_count:
          type: integer
          format: int64
          description: PRs produced by this factory's runs and merged in the range.
        measured_pr_count:
          type: integer
          format: int64
          description: |
            merged_pr_count restricted to PRs whose line counts were
            observed; the denominator for additions/deletions.
    FactoryLatencyStage:
      type: object
      description: |
        One stage of the PR latency pipeline: the median duration across the
        PRs where both of the stage's endpoints were observed, plus how many
        PRs that was.
      required:
        - median_seconds
        - measured_pr_count
      properties:
        median_seconds:
          type:
            - number
            - 'null'
          format: double
          description: |
            p50 stage duration in seconds; null when measured_pr_count is
            zero. Durations are clamped at zero, so out-of-order provider
            timestamps never produce negative values.
        measured_pr_count:
          type: integer
          format: int64
          description: PRs with both stage endpoints observed.
    FactoryPRLatency:
      type: object
      description: |
        Median PR throughput/latency pipeline stages over the factory's PRs
        merged in the range, counted by merge time like autonomy_funnel;
        kickoff is the creation time of the earliest of the factory's runs
        linked to the PR (measured from the subrun when only a subrun
        reported it). First review is the earliest observed HUMAN review
        event with a recorded time — any review state qualifies except bot
        reviews and GitHub App reviews (agent reviewers, CI) — so
        review-anchored stages can be empty when the provider's review
        webhooks are absent. Every stage is computed independently over the
        PRs where both endpoints were observed, so stage medians do not sum
        to kickoff_to_merge's median.
      required:
        - merged_pr_count
        - kickoff_to_pr
        - pr_to_first_review
        - first_review_to_merge
        - kickoff_to_merge
      properties:
        merged_pr_count:
          type: integer
          format: int64
          description: PRs produced by this factory's runs and merged in the range.
        kickoff_to_pr:
          allOf:
            - $ref: '#/components/schemas/FactoryLatencyStage'
          description: Run kickoff to PR creation.
        pr_to_first_review:
          allOf:
            - $ref: '#/components/schemas/FactoryLatencyStage'
          description: PR creation to the first observed human review.
        first_review_to_merge:
          allOf:
            - $ref: '#/components/schemas/FactoryLatencyStage'
          description: First observed human review to merge.
        kickoff_to_merge:
          allOf:
            - $ref: '#/components/schemas/FactoryLatencyStage'
          description: 'Run kickoff to merge, measured end to end per PR.'
    FactoryPullRequestState:
      type: string
      description: The pull request's current state.
      enum:
        - open
        - draft
        - merged
        - closed
    FactoryPullRequestHumanInteractions:
      type: object
      description: |
        Actions people took on the pull request, counted by type. A person is
        not a bot and not an app acting on a person's behalf. A review that
        was later dismissed is not counted. A follow-up a person sent to the
        run that produced the PR counts when it came through Slack, Linear,
        Jira, Teams, the web app, or the API; messages relayed through the
        Factory MCP or a local agent do not count, and a follow-up sent as a
        GitHub comment counts once, as a PR comment or review. total is the
        sum of every type.
      required:
        - opened
        - code_push
        - review_approved
        - review_changes_requested
        - review_commented
        - comment
        - review_comment
        - pr_action
        - follow_up_message
        - total
      properties:
        opened:
          type: integer
          format: int64
          description: A person opened the PR.
        code_push:
          type: integer
          format: int64
          description: |
            A person pushed code to the PR. Pushes are attributed to whoever
            triggered them, so the code host's "update branch" button and
            rebases count.
        review_approved:
          type: integer
          format: int64
          description: A person approved the PR.
        review_changes_requested:
          type: integer
          format: int64
          description: A person requested changes.
        review_commented:
          type: integer
          format: int64
          description: A person reviewed with comments only.
        comment:
          type: integer
          format: int64
          description: A person commented on the PR.
        review_comment:
          type: integer
          format: int64
          description: A person commented on a line of code.
        pr_action:
          type: integer
          format: int64
          description: 'Other PR actions by a person, such as closed, reopened, or marked ready.'
        follow_up_message:
          type: integer
          format: int64
          description: A person sent a follow-up message to the run that produced the PR.
        total:
          type: integer
          format: int64
          description: The sum of every interaction type.
    FactoryPullRequestRun:
      type: object
      description: One of the factory's runs that produced the pull request.
      required:
        - run_id
        - root_run_id
        - created_at
      properties:
        run_id:
          type: string
        root_run_id:
          type: string
          description: The top-level run of the run's tree; equals run_id for a top-level run.
        created_at:
          type: string
          format: date-time
    FactoryPullRequestCycleTime:
      type: object
      description: |
        The pull request's pipeline-stage durations in seconds. Each stage
        is null when either end was not observed, and never negative.
        Kickoff is when the earliest run that produced the PR was created;
        first review is the first review by a person.
      required:
        - kickoff_to_pr
        - pr_to_first_review
        - first_review_to_merge
        - kickoff_to_merge
      properties:
        kickoff_to_pr:
          type:
            - number
            - 'null'
          format: double
        pr_to_first_review:
          type:
            - number
            - 'null'
          format: double
        first_review_to_merge:
          type:
            - number
            - 'null'
          format: double
        kickoff_to_merge:
          type:
            - number
            - 'null'
          format: double
    FactoryPullRequest:
      type: object
      description: |
        One pull request produced by the factory's runs. Fields the code
        host has not reported yet (title, size counts, times) are null.
      required:
        - provider
        - repo_full_name
        - pr_number
        - url
        - title
        - author_login
        - factory_uid
        - team_uid
        - state
        - opened_at
        - first_human_review_at
        - merged_at
        - closed_at
        - updated_at
        - additions
        - deletions
        - changed_files
        - num_commits
        - human_interactions
        - human_code_change
        - history_complete
        - runs
        - kickoff_at
        - cycle_time
      properties:
        provider:
          $ref: '#/components/schemas/FactoryRepositoryCodeForge'
        repo_full_name:
          type: string
          description: The repository as owner/repo.
        pr_number:
          type: integer
          description: The provider's PR number.
        url:
          type: string
          description: Canonical PR URL.
        title:
          type:
            - string
            - 'null'
          description: The PR title; null until the code host reports it.
        author_login:
          type:
            - string
            - 'null'
          description: The code-host login that opened the PR.
        factory_uid:
          type: string
          description: Public UID of the factory whose runs produced the PR.
        team_uid:
          type: string
          description: Public UID of the team that owns the factory.
        state:
          $ref: '#/components/schemas/FactoryPullRequestState'
        opened_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the PR was opened; null when Warp did not see it being opened.
        first_human_review_at:
          type:
            - string
            - 'null'
          format: date-time
          description: The first review by a person; null when none was observed.
        merged_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the PR was merged; null while it is not merged.
        closed_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 'When the PR was closed, by merging or otherwise; null while it is open or when the code host did not report it.'
        updated_at:
          type: string
          format: date-time
          description: When the PR itself last changed; the updated_after filter compares against it.
        additions:
          type:
            - integer
            - 'null'
          description: Lines added; null until the code host reports it.
        deletions:
          type:
            - integer
            - 'null'
          description: Lines deleted; null until the code host reports it.
        changed_files:
          type:
            - integer
            - 'null'
          description: Files changed; null until the code host reports it.
        num_commits:
          type:
            - integer
            - 'null'
          description: Commits on the PR; null until the code host reports it.
        human_interactions:
          $ref: '#/components/schemas/FactoryPullRequestHumanInteractions'
        human_code_change:
          type: boolean
          description: |
            Whether a person changed the PR's code: any opened or code_push
            interaction. False only means autonomous when history_complete
            is true.
        history_complete:
          type: boolean
          description: |
            Whether Warp observed the PR from the moment it was opened. When
            false, interactions before Warp started watching the PR are
            missing from the counts.
        runs:
          type: array
          description: 'The factory''s runs that produced the PR, earliest first.'
          items:
            $ref: '#/components/schemas/FactoryPullRequestRun'
        kickoff_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the earliest run that produced the PR was created.
        cycle_time:
          $ref: '#/components/schemas/FactoryPullRequestCycleTime'
    FactoryPullRequestsResponse:
      allOf:
        - $ref: '#/components/schemas/FactoryMetricsEnvelope'
        - type: object
          required:
            - data
            - page_info
          properties:
            data:
              type: array
              description: Newest opened first.
              items:
                $ref: '#/components/schemas/FactoryPullRequest'
            page_info:
              $ref: '#/components/schemas/PageInfo'
    FactoryTopPR:
      type: object
      description: |
        One PR in the most-expensive-PRs listing: the pull request record
        fields plus cost and attribution. Cost fields are always present;
        attribution fields are null when every root run that produced the
        PR has been deleted; the remaining fields are null when the PR
        predates webhook PR-fact collection.
      required:
        - url
        - dollars
        - models
      properties:
        url:
          type: string
          description: Canonical PR URL; the listing's identity.
        dollars:
          $ref: '#/components/schemas/FactoryDollarsBreakdown'
        creator:
          oneOf:
            - $ref: '#/components/schemas/RunCreatorInfo'
            - type: 'null'
          description: Who started the run that kicked off the PR.
        source:
          type:
            - string
            - 'null'
          description: |
            Public source name of the run that kicked off the PR (e.g.
            GITHUB_WEBHOOK, SLACK, API). New values may appear over time.
        requested_model_id:
          type:
            - string
            - 'null'
          description: |
            Model the kicking-off run was configured with; null means the
            server default was used.
        models:
          type: array
          description: |
            Models recorded in the PR's run trees' conversation usage
            metadata, most expensive first, each with its token-weighted
            share of the PR's inference dollars. Shares sum approximately
            to dollars.inference: conversations without per-model token
            counts contribute inference dollars but no shares. Empty when
            no per-model usage was recorded.
          items:
            $ref: '#/components/schemas/FactoryTopPRModel'
        provider:
          oneOf:
            - $ref: '#/components/schemas/FactoryRepositoryCodeForge'
            - type: 'null'
          description: The code host the PR lives on.
        repo_full_name:
          type:
            - string
            - 'null'
          description: The repository as owner/repo.
        pr_number:
          type:
            - integer
            - 'null'
          description: The provider's PR number.
        title:
          type:
            - string
            - 'null'
          description: The PR title; null until the code host reports it.
        author_login:
          type:
            - string
            - 'null'
          description: The code-host login that opened the PR.
        factory_uid:
          type:
            - string
            - 'null'
          description: Public UID of the factory whose runs produced the PR.
        team_uid:
          type:
            - string
            - 'null'
          description: Public UID of the team that owns the factory.
        state:
          oneOf:
            - $ref: '#/components/schemas/FactoryPullRequestState'
            - type: 'null'
          description: The PR's current state.
        opened_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the PR was opened; null when Warp did not see it being opened.
        first_human_review_at:
          type:
            - string
            - 'null'
          format: date-time
          description: The first review by a person; null when none was observed.
        merged_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the PR was merged; null while it is not merged.
        closed_at:
          type:
            - string
            - 'null'
          format: date-time
          description: 'When the PR was closed, by merging or otherwise; null while it is open or when the code host did not report it.'
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the PR itself last changed.
        additions:
          type:
            - integer
            - 'null'
          description: Lines added; null until the code host reports it.
        deletions:
          type:
            - integer
            - 'null'
          description: Lines deleted; null until the code host reports it.
        changed_files:
          type:
            - integer
            - 'null'
          description: Files changed; null until the code host reports it.
        num_commits:
          type:
            - integer
            - 'null'
          description: Commits on the PR; null until the code host reports it.
        human_interactions:
          oneOf:
            - $ref: '#/components/schemas/FactoryPullRequestHumanInteractions'
            - type: 'null'
          description: 'Actions people took on the PR, counted by type.'
        human_code_change:
          type:
            - boolean
            - 'null'
          description: |
            Whether a person changed the PR's code: any opened or code_push
            interaction. False only means autonomous when history_complete
            is true.
        history_complete:
          type:
            - boolean
            - 'null'
          description: |
            Whether Warp observed the PR from the moment it was opened. When
            false, interactions before Warp started watching the PR are
            missing from the counts.
        runs:
          type:
            - array
            - 'null'
          description: 'The factory''s runs that produced the PR, earliest first.'
          items:
            $ref: '#/components/schemas/FactoryPullRequestRun'
        kickoff_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the earliest run that produced the PR was created.
        cycle_time:
          oneOf:
            - $ref: '#/components/schemas/FactoryPullRequestCycleTime'
            - type: 'null'
          description: The PR's pipeline-stage durations in seconds.
    FactoryTopPRModel:
      type: object
      description: One model's share of a top PR's inference cost.
      required:
        - model_id
        - inference_dollars
      properties:
        model_id:
          type: string
        inference_dollars:
          type: number
          format: double
          description: |
            The model's token-weighted share of the PR's inference dollars.
            Inference only; compute and platform costs have no model
            attribution.
    FactoryTopPRsResponse:
      allOf:
        - $ref: '#/components/schemas/FactoryMetricsEnvelope'
        - type: object
          required:
            - data
          properties:
            data:
              type: array
              description: Most expensive first.
              items:
                $ref: '#/components/schemas/FactoryTopPR'
    FactoryMetricsEnvelope:
      type: object
      description: |
        Fields every factory-scoped metrics response carries alongside its
        data, so responses from several factories can be combined or told
        apart.
      required:
        - as_of
        - team_uid
        - factory_uid
      properties:
        as_of:
          type: string
          format: date-time
          description: |
            The time the data is current as of. Data can lag live activity
            by a few minutes.
        team_uid:
          type: string
          description: Public UID of the team that owns the factory.
        factory_uid:
          type: string
          description: Public UID of the factory the response is scoped to.
    FactoryMetricsResponse:
      allOf:
        - $ref: '#/components/schemas/FactoryMetricsEnvelope'
        - type: object
          required:
            - data
          properties:
            group_by_period:
              $ref: '#/components/schemas/FactoryMetricsGroupByPeriod'
            period_list:
              type: array
              description: |
                Period labels every series aligns to (dates like 2026-07-01;
                weeks labeled by their Sunday start date). Present only when
                group_by_period was requested.
              items:
                type: string
            data:
              $ref: '#/components/schemas/FactoryMetricsData'
    FactoryRunBreakdownGroupBy:
      type: string
      description: |
        Grouping dimension for the run-breakdown metric. source counts
        top-level runs only; every other dimension counts subruns
        individually.
      enum:
        - agent_type
        - status
        - source
        - root_vs_subrun
        - model
        - harness
    FactoryRunBreakdownGroup:
      type: object
      description: |
        One group of the run breakdown. key is the group's stable identity
        (dimension-specific: agent type, run state, source type,
        ROOT/SUBRUN, model id, or harness name); OTHER and UNKNOWN are
        reserved for the top-K rollup and missing/unresolvable values
        respectively. label carries a server-resolved display name (harness
        names, source aliases) and is absent where the key is already the
        display form.
      required:
        - key
        - total
      properties:
        key:
          type: string
        label:
          type: string
        total:
          type: integer
          format: int64
        series:
          type: array
          description: |
            One entry per period_list entry, zero-filled. Present only when
            group_by_period was requested.
          items:
            type: integer
            format: int64
    FactoryRunBreakdownData:
      type: object
      description: |
        Grouped run counts. Groups are ordered by total descending (key
        ascending on ties) with the reserved buckets always last — UNKNOWN,
        then OTHER; group totals and series sum to total and its per-period
        distribution.
      required:
        - total
        - root_run_count
        - groups
      properties:
        total:
          type: integer
          format: int64
          description: |
            Sum over groups — top-level runs only when root_runs_only is
            true, so it can undercount the run_count metric there.
        root_run_count:
          type: integer
          format: int64
          description: |
            The factory's top-level runs (no parent run) in the range,
            whatever the dimension — the dashboard's companion stat to the
            all-runs headline. Equals total on root-scoped dimensions.
        root_runs_only:
          type: boolean
          description: |
            Present and true for the source dimension, which counts
            top-level runs only.
        groups:
          type: array
          items:
            $ref: '#/components/schemas/FactoryRunBreakdownGroup'
    FactoryRunBreakdownResponse:
      allOf:
        - $ref: '#/components/schemas/FactoryMetricsEnvelope'
        - type: object
          required:
            - group_by
            - data
          properties:
            group_by:
              $ref: '#/components/schemas/FactoryRunBreakdownGroupBy'
            group_by_period:
              $ref: '#/components/schemas/FactoryMetricsGroupByPeriod'
            period_list:
              type: array
              description: |
                Period labels every series aligns to (dates like 2026-07-01;
                weeks labeled by their Sunday start date). Present only when
                group_by_period was requested.
              items:
                type: string
            data:
              $ref: '#/components/schemas/FactoryRunBreakdownData'
    FactoryPRSizeBucket:
      type: string
      description: |
        A PR's T-shirt size, derived from its webhook-collected line counts
        (additions + deletions): S < 100, M < 500, L < 1000, XL >= 1000.
      enum:
        - S
        - M
        - L
        - XL
    FactoryCostByPRSizeBucket:
      type: object
      description: |
        One size bucket's cost distribution. Mean cost follows the
        cost_per_pr attribution (even run-tree split, in the US dollars the
        owning team was billed).
      required:
        - size
        - pr_count
        - mean
      properties:
        size:
          $ref: '#/components/schemas/FactoryPRSizeBucket'
        pr_count:
          type: integer
          format: int64
          description: Sized PRs in this bucket first seen in the range.
        mean:
          type:
            - number
            - 'null'
          format: double
          description: |
            Mean per-PR attributed cost in US dollars; null when the
            bucket has no PRs in the range.
        mean_series:
          type: array
          description: |
            Mean per-PR cost per period, aligned to period_list; null
            for periods where the bucket has no PRs. Present only when
            group_by_period was requested.
          items:
            type:
              - number
              - 'null'
            format: double
    FactoryCostByPRSizeData:
      type: object
      description: |
        PR cost distribution by size. buckets always lists every size,
        smallest first, so the roster is stable; empty buckets carry
        pr_count 0 and a null mean. sized_pr_count <= pr_count — the
        difference is the PRs whose line counts were never observed and
        are excluded from every bucket.
      required:
        - pr_count
        - sized_pr_count
        - buckets
      properties:
        pr_count:
          type: integer
          format: int64
          description: 'Every PR first seen in the range, sized or not.'
        sized_pr_count:
          type: integer
          format: int64
          description: PRs with observed line counts — the buckets' coverage.
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/FactoryCostByPRSizeBucket'
    FactoryCostByPRSizeResponse:
      allOf:
        - $ref: '#/components/schemas/FactoryMetricsEnvelope'
        - type: object
          required:
            - data
          properties:
            group_by_period:
              $ref: '#/components/schemas/FactoryMetricsGroupByPeriod'
            period_list:
              type: array
              description: |
                Period labels every series aligns to (dates like 2026-07-01;
                weeks labeled by their Sunday start date). Present only when
                group_by_period was requested.
              items:
                type: string
            data:
              $ref: '#/components/schemas/FactoryCostByPRSizeData'
    FactorySyncItem:
      type: object
      description: A single factory sync history/status row.
      required:
        - id
        - factory_uid
        - target_sha
        - trigger
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          description: Internal sync row ID.
        factory_uid:
          type: string
          description: Public UID of the factory.
        target_sha:
          type: string
          description: Target commit SHA for the sync attempt.
        trigger:
          type: string
          description: What initiated the sync attempt.
          enum:
            - webhook
            - explicit_apply
            - anti_entropy
            - source_link
        status:
          $ref: '#/components/schemas/FactorySyncItemStatus'
        plan_summary:
          type:
            - string
            - 'null'
          description: Optional human-readable plan summary for the sync.
        diagnostics:
          type: string
          description: |
            Raw persisted structured diagnostics JSON for the sync attempt
            (parse errors, dependency failures, etc.). Empty when the sync
            had no diagnostics. This POC field carries the persisted JSON
            string verbatim; a future revision may replace it with a
            structured schema.
        created_at:
          type: string
          format: date-time
          description: Time the sync row was created.
        updated_at:
          type: string
          format: date-time
          description: Time the sync row was last updated.
    FactorySyncItemStatus:
      type: string
      description: Outcome of a sync attempt.
      enum:
        - running
        - success
        - failed
        - noop
    ListFactoriesResponse:
      type: object
      description: Response body for listing factories.
      required:
        - factories
        - page_info
      properties:
        factories:
          type: array
          items:
            $ref: '#/components/schemas/Factory'
        page_info:
          $ref: '#/components/schemas/PageInfo'
    FactoryRunRequest:
      type: object
      description: Request body for dispatching a run to a factory.
      required:
        - prompt
      properties:
        branch:
          type: string
          nullable: true
          description: |
            Exact named head in the registered source repository, optionally
            prefixed with refs/heads/. Case and slashes are preserved.
            Omission, null, or the registered production branch uses
            production. Empty strings, revision expressions, tags, forks,
            and alternate repository coordinates are not accepted.
            Non-production selection is rejected when factory_branches is off.
        prompt:
          type: string
          description: |
            The prompt sent to the factory's foreman, not wrapped in any
            factory intake envelope. Required and non-empty.
        title:
          type: string
          description: |
            Human-readable title for the dispatched run and its factory task.
            Omit to derive one automatically from the prompt.
        ticket_ref:
          type: string
          description: |
            Originating ticket reference in <source>:<id> form (for
            example, linear:REMOTE-123); omit to mint an adhoc reference.
            Stamped onto the run as ticket_id/ticket_source metadata.
        ticket_url:
          type: string
          description: |
            Optional URL of the ticket named by ticket_ref. Stamped onto
            the run as ticket_url metadata when given.
    FactoryRunResponse:
      type: object
      description: Response body for a dispatched factory run.
      required:
        - run_id
        - state
        - factory_uid
        - foreman_agent
        - ticket_ref
      properties:
        config_source:
          allOf:
            - $ref: '#/components/schemas/FactoryConfigSource'
        run_id:
          type: string
          description: Unique identifier for the dispatched run.
        run_url:
          type: string
          description: |
            URL to view the dispatched run in the Factory app. Empty when
            the Factory app origin is not configured.
        state:
          $ref: '#/components/schemas/RunState'
        factory_uid:
          type: string
          description: Public UID of the factory the run was dispatched to.
        foreman_agent:
          type: string
          description: Name of the factory's foreman agent that received the run.
        ticket_ref:
          type: string
          description: |
            The canonical <source>:<id> ticket reference the run was
            stamped with, either the caller-supplied ticket_ref or a
            minted adhoc reference.
    FactoryConfigSource:
      type: object
      description: |
        Branch namespace and registered source-generation identity derived
        from the run's execution Agent and required root/Branch associations.
        Omitted for production or unavailable provenance; omission does not
        establish production scope. No historical configuration revision or
        retention guarantee is provided.
      required:
        - branch
        - branch_uid
        - source_generation
      properties:
        branch:
          type: string
          minLength: 1
          description: 'Case-sensitive named head, without refs/heads/.'
        branch_uid:
          type: string
          minLength: 1
          description: Immutable tracking namespace UID.
        source_generation:
          type: string
          minLength: 1
          description: Fingerprint of the registered source generation.
    FactoryBranchState:
      type: string
      enum:
        - UNSYNCED
        - SYNCING
        - FRESH
        - STALE
        - FAILED
        - UNKNOWN
        - DELETED
    FactoryBranchStatus:
      type: object
      description: |
        Read-only observation of an existing Branch. UNKNOWN means the
        current source could not be verified, never permission to execute.
        Lifecycle SHA fields describe current synchronization, not a run's
        historical creation revision.
      required:
        - uid
        - factory_uid
        - branch
        - source_generation
        - state
        - last_success_sha
        - current_head_sha
        - last_synced_at
        - latest_attempt
        - freshness_checked_at
        - last_error
      properties:
        uid:
          type: string
        factory_uid:
          type: string
        branch:
          type: string
        source_generation:
          type: string
        state:
          $ref: '#/components/schemas/FactoryBranchState'
        last_success_sha:
          type:
            - string
            - 'null'
        current_head_sha:
          type:
            - string
            - 'null'
        last_synced_at:
          type:
            - string
            - 'null'
          format: date-time
        latest_attempt:
          oneOf:
            - $ref: '#/components/schemas/FactorySyncItem'
            - type: 'null'
          description: Latest persisted attempt with externally safe diagnostics.
        freshness_checked_at:
          type: string
          format: date-time
        last_error:
          oneOf:
            - $ref: '#/components/schemas/Error'
            - type: 'null'
          description: 'Classified, externally safe source-verification failure.'
    ClaudeHarnessUsagePayload:
      type: object
      additionalProperties: false
      properties:
        usage:
          $ref: '#/components/schemas/ClaudeTokenUsage'
        attribution:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/ClaudeAttributedUsage'
        toolCalls:
          $ref: '#/components/schemas/HarnessToolCalls'
    CodexHarnessUsagePayload:
      type: object
      additionalProperties: false
      properties:
        usage:
          $ref: '#/components/schemas/CodexTokenUsage'
        attribution:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/CodexAttributedUsage'
        toolCalls:
          $ref: '#/components/schemas/HarnessToolCalls'
    HarnessUsageCounter:
      type:
        - integer
        - 'null'
      format: int64
      minimum: 0
      maximum: 9223372036854775807
      description: 'A native count. Absent or null means unmeasured, not zero.'
    ClaudeTokenUsage:
      type:
        - object
        - 'null'
      additionalProperties: false
      description: Native cumulative token categories; cache counters are not added to input_tokens.
      properties:
        input_tokens:
          $ref: '#/components/schemas/HarnessUsageCounter'
        output_tokens:
          $ref: '#/components/schemas/HarnessUsageCounter'
        cache_read_input_tokens:
          $ref: '#/components/schemas/HarnessUsageCounter'
        cache_creation_input_tokens:
          $ref: '#/components/schemas/HarnessUsageCounter'
        cache_creation:
          $ref: '#/components/schemas/ClaudeCacheCreationUsage'
    ClaudeCacheCreationUsage:
      type:
        - object
        - 'null'
      additionalProperties: false
      properties:
        ephemeral_5m_input_tokens:
          $ref: '#/components/schemas/HarnessUsageCounter'
        ephemeral_1h_input_tokens:
          $ref: '#/components/schemas/HarnessUsageCounter'
    CodexTokenUsage:
      type:
        - object
        - 'null'
      additionalProperties: false
      description: Native checkpoint counters. Cached input and reasoning output may overlap other categories; no derived total is inferred.
      properties:
        input_tokens:
          $ref: '#/components/schemas/HarnessUsageCounter'
        cached_input_tokens:
          $ref: '#/components/schemas/HarnessUsageCounter'
        cache_write_input_tokens:
          $ref: '#/components/schemas/HarnessUsageCounter'
        output_tokens:
          $ref: '#/components/schemas/HarnessUsageCounter'
        reasoning_output_tokens:
          $ref: '#/components/schemas/HarnessUsageCounter'
        total_tokens:
          $ref: '#/components/schemas/HarnessUsageCounter'
    ClaudeAttributedUsage:
      type: object
      additionalProperties: false
      required:
        - usage
      properties:
        model:
          type:
            - string
            - 'null'
        service_tier:
          type:
            - string
            - 'null'
        inference_geo:
          type:
            - string
            - 'null'
        speed:
          type:
            - string
            - 'null'
        usage:
          $ref: '#/components/schemas/ClaudeTokenUsage'
    CodexAttributedUsage:
      type: object
      additionalProperties: false
      required:
        - usage
      properties:
        model:
          type:
            - string
            - 'null'
        service_tier:
          type:
            - string
            - 'null'
        inference_geo:
          type:
            - string
            - 'null'
        speed:
          type:
            - string
            - 'null'
        usage:
          $ref: '#/components/schemas/CodexTokenUsage'
    HarnessToolCalls:
      type:
        - object
        - 'null'
      additionalProperties: false
      required:
        - total
        - byName
      description: Native tool invocation counts. Total must equal the sum of byName; tool names are arbitrary map keys.
      properties:
        total:
          type: integer
          format: int64
          minimum: 0
          maximum: 9223372036854775807
        byName:
          type: object
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
            maximum: 9223372036854775807
    GetRunHarnessUsageResponse:
      type: object
      required:
        - run_id
        - conversation_id
        - available
      properties:
        run_id:
          type: string
        conversation_id:
          type: string
        available:
          type: boolean
        age_seconds:
          type:
            - integer
            - 'null'
          format: int64
        usage:
          $ref: '#/components/schemas/HarnessUsageEnvelope'
    HarnessUsageEnvelope:
      oneOf:
        - $ref: '#/components/schemas/ClaudeHarnessUsageEnvelope'
        - $ref: '#/components/schemas/CodexHarnessUsageEnvelope'
      discriminator:
        propertyName: harness
        mapping:
          CLAUDE_CODE: '#/components/schemas/ClaudeHarnessUsageEnvelope'
          CODEX: '#/components/schemas/CodexHarnessUsageEnvelope'
    ClaudeHarnessUsageEnvelope:
      type: object
      additionalProperties: false
      required:
        - metricsVersion
        - harness
        - executionId
        - captureSequence
        - capturedAt
        - snapshot
      properties:
        metricsVersion:
          type: integer
          enum:
            - 1
          description: 'Server-owned storage format metadata, not the producer''s parser version.'
        harness:
          type: string
          enum:
            - CLAUDE_CODE
        executionId:
          type: integer
          format: int64
        captureSequence:
          type: integer
          format: int64
        capturedAt:
          type: string
          format: date-time
        snapshot:
          type: object
          additionalProperties: false
          required:
            - coverage
            - payload
          properties:
            coverage:
              $ref: '#/components/schemas/RetainedHarnessUsageCoverage'
            payload:
              $ref: '#/components/schemas/ClaudeHarnessUsagePayload'
    CodexHarnessUsageEnvelope:
      type: object
      additionalProperties: false
      required:
        - metricsVersion
        - harness
        - executionId
        - captureSequence
        - capturedAt
        - snapshot
      properties:
        metricsVersion:
          type: integer
          enum:
            - 1
          description: 'Server-owned storage format metadata, not the producer''s parser version.'
        harness:
          type: string
          enum:
            - CODEX
        executionId:
          type: integer
          format: int64
        captureSequence:
          type: integer
          format: int64
        capturedAt:
          type: string
          format: date-time
        snapshot:
          type: object
          additionalProperties: false
          required:
            - coverage
            - payload
          properties:
            coverage:
              $ref: '#/components/schemas/RetainedHarnessUsageCoverage'
            payload:
              $ref: '#/components/schemas/CodexHarnessUsagePayload'
    RetainedHarnessUsageCoverage:
      type: object
      additionalProperties: false
      required:
        - tokenStatus
        - toolStatus
      properties:
        tokenStatus:
          type: string
          enum:
            - known
            - partial
            - unavailable
        toolStatus:
          type: string
          enum:
            - known
            - partial
            - unavailable
    RunAgentRequest:
      type: object
      description: |
        Request body for creating a new agent run.
        Either prompt or skill (via skill field, config.skill_spec, or config.skills) is required,
        except for handoff requests that set conversation_id.
      properties:
        prompt:
          type: string
          description: |
            The prompt/instruction for the agent to execute.
            Required unless a skill is specified via the skill field, config.skill_spec, or config.skills.
            Handoff requests may omit prompt when conversation_id is set.
        mode:
          $ref: '#/components/schemas/AgentRunMode'
          description: |
            Optional query mode for the run. Defaults to `normal` when omitted.
            The server does not infer mode from prompt prefixes such as `/plan`,
            so callers should pass this field explicitly to request non-normal behavior.
        skill:
          type: string
          description: |
            Skill specification to use as the base prompt for the agent.
            Supported formats:
              - "repo:skill_name" - Simple name in specific repo
              - "repo:skill_path" - Full path in specific repo
              - "org/repo:skill_name" - Simple name with org and repo
              - "org/repo:skill_path" - Full path with org and repo
            When provided, this takes precedence over config.skill_spec.
        config:
          $ref: '#/components/schemas/AmbientAgentConfig'
        title:
          type: string
          description: Custom title for the run (auto-generated if not provided)
        team:
          type: boolean
          description: |
            Whether to create a team-owned run.
            Defaults to true for users on a single team.
        agent_identity_uid:
          type: string
          description: |
            Optional agent identity UID to use as the execution principal for the run.
            This is only valid for runs that are team owned.
        on_behalf_of:
          type: string
          description: |
            Optional email address or user ID of a Warp user to attribute
            the run to; when set, the resolved user becomes the run's
            creator instead of the caller. Only agent API keys may use this
            field, only when the calling agent has on_behalf_of enabled in
            its configuration (a team admin must turn this on per agent),
            and only for team-owned runs. The target user must be an active
            member of the run's owner team.
        conversation_id:
          type: string
          description: |
            Optional conversation ID to continue an existing conversation.
            If provided, the agent will continue from where the previous run left off.
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentInput'
          description: |
            Optional file attachments to include with the prompt (max 5).
            Attachments are uploaded to cloud storage and made available to the agent.
        parent_run_id:
          type: string
          description: |
            Optional run ID of the parent that spawned this run, used for
            orchestration hierarchies; the parent run must exist and be
            visible to the caller, or the request is rejected with a 400.
            Child runs are also subject to the server's maximum
            orchestration depth, and requests that would exceed it are
            rejected with a 400.
        interactive:
          type: boolean
          description: |
            Whether the run should be interactive.
            If not set, defaults to false.
        metadata:
          $ref: '#/components/schemas/RunMetadata'
    RunMetadata:
      type: object
      additionalProperties:
        type: string
      description: |
        Custom key/value metadata attached to a run at creation time and
        immutable afterward; at most 20 keys, with keys 1-64 bytes matching
        [a-zA-Z0-9._-]+ (case-sensitive) and values 0-256 bytes of UTF-8 with
        no NUL characters. Requests with invalid metadata are rejected. A
        run's effective metadata is merged per key at creation: explicit
        request keys override keys inherited from the parent run, which
        override automatic keys (ticket_id and ticket_source on Linear- and
        Jira-triggered runs).
    RunAgentResponse:
      type: object
      required:
        - run_id
        - task_id
        - state
      properties:
        run_id:
          type: string
          description: Unique identifier for the created run
        task_id:
          type: string
          deprecated: true
          description: Unique identifier for the task (same as run_id). Deprecated - use run_id instead.
        state:
          $ref: '#/components/schemas/RunState'
        at_capacity:
          type: boolean
          description: Whether the system is at capacity when the run was created
    AgentRunMode:
      type: string
      description: |
        Query mode for an agent run.
          - normal: Standard user query (default).
          - plan: Planning Mode. The agent researches and creates a plan, then waits for approval before execution.
          - orchestrate: Orchestration Mode. The agent proposes an orchestration plan and must not start child agents until approved.
      enum:
        - normal
        - plan
        - orchestrate
      default: normal
    ListRunsResponse:
      type: object
      required:
        - runs
        - page_info
        - as_of
        - team_uid
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RunItem'
        page_info:
          $ref: '#/components/schemas/PageInfo'
        as_of:
          type: string
          format: date-time
          description: Time the runs were read (RFC3339). Data can lag live activity by a few minutes.
        team_uid:
          type:
            - string
            - 'null'
          description: |
            UID of the team the request was scoped to: the team selected by the
            `X-Warp-Team-Uid` header, or the API key's team. Null when a user
            request has no team selected and the list spans every team the
            user belongs to.
    RunItem:
      type: object
      required:
        - run_id
        - task_id
        - title
        - state
        - prompt
        - created_at
        - finished_at
        - updated_at
        - root_run_id
      properties:
        run_id:
          type: string
          description: Unique identifier for the run
        task_id:
          type: string
          deprecated: true
          description: Unique identifier for the task (typically matches run_id). Deprecated - use run_id instead.
        title:
          type: string
          description: Human-readable title for the run
        state:
          $ref: '#/components/schemas/RunState'
        execution_location:
          $ref: '#/components/schemas/RunExecutionLocation'
        prompt:
          type: string
          description: The prompt/instruction for the agent
        submitted_prompt:
          type: string
          description: 'The prompt exactly as it was submitted, without any extra context added by Warp. Includes any follow-up messages sent before the run started, separated by blank lines.'
        created_at:
          type: string
          format: date-time
          description: Timestamp when the run was created (RFC3339)
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the run was last updated (RFC3339)
        run_time:
          type: string
          format: duration
          description: 'Total runtime as an ISO 8601 duration (e.g. "PT2M30S"), computed server-side from run executions.'
        started_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp when the agent started working on the run (RFC3339)
        finished_at:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            Timestamp when the run last reached a terminal state (RFC3339). Null
            while the run is still active, and for terminal runs with no
            recorded finish time (runs executed locally, and runs that finished
            before finish times were recorded).
        status_message:
          $ref: '#/components/schemas/RunStatusMessage'
        source:
          $ref: '#/components/schemas/RunSourceType'
        schedule:
          $ref: '#/components/schemas/ScheduleInfo'
        session_id:
          type: string
          description: UUID of the shared session (if available)
        session_link:
          type: string
          format: uri
          description: URL to view the agent session
        trigger_url:
          type: string
          format: uri
          description: 'URL to the run trigger (e.g. Slack thread, Linear issue, schedule)'
        creator:
          $ref: '#/components/schemas/RunCreatorInfo'
        executor:
          $ref: '#/components/schemas/RunCreatorInfo'
        factory_uid:
          type: string
          description: |
            UID of the factory whose agent executed the run. Absent for runs
            not executed by a factory agent.
        request_usage:
          $ref: '#/components/schemas/RequestUsage'
        agent_config:
          $ref: '#/components/schemas/AmbientAgentConfig'
        conversation_id:
          type: string
          description: UUID of the conversation associated with the run
        parent_run_id:
          type: string
          description: UUID of the parent run that spawned this run
        root_run_id:
          type: string
          description: |
            UUID of the top-level run of this run's orchestration tree. Equals
            `run_id` for a top-level run.
        metadata:
          $ref: '#/components/schemas/RunMetadata'
        is_sandbox_running:
          type: boolean
          description: Whether the sandbox environment is currently running
        is_run_type_cancellable:
          type: boolean
          description: |
            Whether the run's type is eligible for cancellation via the API. State-independent:
            false for GitHub Action and local runs; true for all other run types (including
            self-hosted). Clients should still gate the control on the run's current state.
        debug_agent_available:
          type: boolean
          description: |
            Whether a debug agent can currently be started inside this run's retained
            setup-failure session. Only true for a run that failed during environment setup,
            whose retained execution is still reachable, and whose debug window has not
            closed. See `POST /agent/runs/{runId}/followups`.
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactItem'
          description: 'Artifacts created during the run (plans, pull requests, etc.)'
        agent_skill:
          $ref: '#/components/schemas/AgentSkill'
        scope:
          $ref: '#/components/schemas/Scope'
    GetRunTimelineResponse:
      type: object
      description: Response body for listing run timeline events.
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AIRunTimelineEvent'
    AIRunTimelineEvent:
      type: object
      description: A setup or lifecycle event recorded for an agent run.
      required:
        - event_uuid
        - run_id
        - event_type
        - occurred_at
      properties:
        event_uuid:
          type: string
          description: Unique client- or server-generated identifier for this event.
        run_id:
          type: string
          description: Run that owns this event.
        execution_id:
          type: integer
          format: int64
          description: 'Run execution associated with this event, when available.'
        event_type:
          $ref: '#/components/schemas/AIRunTimelineEventType'
        occurred_at:
          type: string
          format: date-time
          description: Timestamp when the event occurred.
        payload:
          type: object
          additionalProperties: true
          description: Optional event-specific JSON payload. Contents vary by event type.
    AIRunTimelineEventType:
      type: string
      description: Type of timeline event recorded for a run.
      enum:
        - oz_run_created
        - oz_run_claimed
        - worker_container_ready
        - shared_session_started
        - agent_started
        - oz_run_done
        - oz_run_blocked
        - oz_run_cancelled
        - oz_run_failed
        - oz_run_errored
        - vm_shutdown
        - run_retry_scheduled
    ConversationResponse:
      type: object
      required:
        - conversation_id
        - steps
      properties:
        conversation_id:
          type: string
          description: Unique identifier for the conversation
        steps:
          type: array
          description: Root steps in the conversation
          items:
            $ref: '#/components/schemas/ConversationStep'
    ConversationStep:
      type: object
      required:
        - id
        - messages
        - steps
      properties:
        id:
          type: string
          description: Unique identifier for the step
        description:
          type: string
          description: Original instruction or delegated work description for the step
        summary:
          type: string
          description: Summary of the work completed for the step
        started_at:
          type: string
          format: date-time
          description: Earliest transcript message timestamp contained in this step or any nested step (RFC3339)
        completed_at:
          type: string
          format: date-time
          description: Latest transcript message timestamp contained in this step or any nested step (RFC3339)
        messages:
          type: array
          description: Ordered normalized messages for this step
          items:
            $ref: '#/components/schemas/ConversationMessage'
        steps:
          type: array
          description: Nested delegated work performed as part of this step
          items:
            $ref: '#/components/schemas/ConversationStep'
    ConversationMessage:
      type: object
      required:
        - role
        - content
      properties:
        message_ids:
          type: array
          description: Underlying transcript message IDs grouped into this normalized message
          items:
            type: string
        request_id:
          type: string
          description: 'Request identifier shared by transcript messages from the same request, when available'
        role:
          $ref: '#/components/schemas/ConversationMessageRole'
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the first transcript message included in this normalized message (RFC3339)
        content:
          type: array
          items:
            $ref: '#/components/schemas/ConversationContentBlock'
    ConversationMessageRole:
      type: string
      description: Role of the normalized message
      enum:
        - user
        - assistant
        - tool
        - system
    ConversationContentBlock:
      oneOf:
        - $ref: '#/components/schemas/TextContentBlock'
        - $ref: '#/components/schemas/ActionContentBlock'
        - $ref: '#/components/schemas/ActionResultContentBlock'
        - $ref: '#/components/schemas/EventContentBlock'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextContentBlock'
          action: '#/components/schemas/ActionContentBlock'
          action_result: '#/components/schemas/ActionResultContentBlock'
          event: '#/components/schemas/EventContentBlock'
    TextContentBlock:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - text
        message_id:
          type: string
          description: 'Underlying transcript message ID that produced this content block, when available'
        text:
          type: string
          description: Plain text content
    ActionCategory:
      type: string
      description: High-level category of an action performed during the conversation
      enum:
        - command
        - files
        - search
        - integration
        - documents
        - computer
        - review
        - skill
    ActionState:
      type: string
      description: State of an action result
      enum:
        - running
        - completed
        - failed
        - denied
    ActionContentBlock:
      type: object
      required:
        - type
        - id
        - category
        - name
        - input
      properties:
        type:
          type: string
          enum:
            - action
        message_id:
          type: string
          description: 'Underlying transcript message ID that produced this content block, when available'
        id:
          type: string
          description: Unique identifier for the action
        category:
          $ref: '#/components/schemas/ActionCategory'
        name:
          type: string
          description: 'Public action name, such as run_command or edit_files'
        input:
          type: object
          additionalProperties: true
          description: Curated public input for this action. This object is owned by the API and is not a raw internal tool payload.
    ActionResultContentBlock:
      type: object
      required:
        - type
        - action_id
        - category
        - name
        - state
        - output
      properties:
        type:
          type: string
          enum:
            - action_result
        message_id:
          type: string
          description: 'Underlying transcript message ID that produced this content block, when available'
        action_id:
          type: string
          description: Identifier of the corresponding action
        category:
          $ref: '#/components/schemas/ActionCategory'
        name:
          type: string
          description: Public action name matching the corresponding action block
        state:
          $ref: '#/components/schemas/ActionState'
        output:
          type: object
          additionalProperties: true
          description: Curated public result for this action. Large or binary internal payloads should be summarized rather than passed through raw.
    EventContentBlock:
      type: object
      required:
        - type
        - name
        - data
      properties:
        type:
          type: string
          enum:
            - event
        message_id:
          type: string
          description: 'Underlying transcript message ID that produced this content block, when available'
        name:
          type: string
          description: Event type for intentionally exposed non-core transcript events
        data:
          type: object
          additionalProperties: true
          description: Minimal structured metadata for the event
    ArtifactItem:
      oneOf:
        - $ref: '#/components/schemas/PlanArtifact'
        - $ref: '#/components/schemas/PullRequestArtifact'
        - $ref: '#/components/schemas/ScreenshotArtifact'
        - $ref: '#/components/schemas/FileArtifact'
        - $ref: '#/components/schemas/ExternalReferenceArtifact'
      discriminator:
        propertyName: artifact_type
        mapping:
          PLAN: '#/components/schemas/PlanArtifact'
          PULL_REQUEST: '#/components/schemas/PullRequestArtifact'
          SCREENSHOT: '#/components/schemas/ScreenshotArtifact'
          FILE: '#/components/schemas/FileArtifact'
          EXTERNAL_REFERENCE: '#/components/schemas/ExternalReferenceArtifact'
    ExternalReferenceArtifact:
      type: object
      required:
        - artifact_type
        - created_at
        - data
      properties:
        artifact_type:
          type: string
          enum:
            - EXTERNAL_REFERENCE
          description: Type of the artifact
        created_at:
          type: string
          format: date-time
          description: Timestamp when the artifact was created (RFC3339)
        data:
          $ref: '#/components/schemas/ExternalReferenceArtifactData'
    PlanArtifact:
      type: object
      required:
        - artifact_type
        - created_at
        - data
      properties:
        artifact_type:
          type: string
          enum:
            - PLAN
          description: Type of the artifact
        created_at:
          type: string
          format: date-time
          description: Timestamp when the artifact was created (RFC3339)
        data:
          $ref: '#/components/schemas/PlanArtifactData'
    PullRequestArtifact:
      type: object
      required:
        - artifact_type
        - created_at
        - data
      properties:
        artifact_type:
          type: string
          enum:
            - PULL_REQUEST
          description: Type of the artifact
        created_at:
          type: string
          format: date-time
          description: Timestamp when the artifact was created (RFC3339)
        data:
          $ref: '#/components/schemas/PullRequestArtifactResponseData'
    ScreenshotArtifact:
      type: object
      required:
        - artifact_type
        - created_at
        - data
      properties:
        artifact_type:
          type: string
          enum:
            - SCREENSHOT
          description: Type of the artifact
        created_at:
          type: string
          format: date-time
          description: Timestamp when the artifact was created (RFC3339)
        data:
          $ref: '#/components/schemas/ScreenshotArtifactData'
    FileArtifact:
      type: object
      required:
        - artifact_type
        - created_at
        - data
      properties:
        artifact_type:
          type: string
          enum:
            - FILE
          description: Type of the artifact
        created_at:
          type: string
          format: date-time
          description: Timestamp when the artifact was created (RFC3339)
        data:
          $ref: '#/components/schemas/FileArtifactData'
    PlanArtifactData:
      type: object
      required:
        - document_uid
      properties:
        artifact_uid:
          type: string
          description: 'Unique identifier for the plan artifact, usable with the artifact retrieval endpoint'
        document_uid:
          type: string
          description: Unique identifier for the plan document
        notebook_uid:
          type: string
          description: Unique identifier for the associated notebook
        url:
          type: string
          format: uri
          description: URL to open the plan in Warp Drive
        title:
          type: string
          description: Title of the plan
    PullRequestArtifactData:
      type: object
      required:
        - url
        - branch
      properties:
        url:
          type: string
          format: uri
          description: URL of the pull request
        branch:
          type: string
          description: Branch name for the pull request
    PullRequestArtifactResponseData:
      allOf:
        - $ref: '#/components/schemas/PullRequestArtifactData'
        - type: object
          required:
            - status
          properties:
            status:
              type: string
              description: |
                Current state of the pull request as last reported by the code
                host's webhooks. `unknown` means Warp has no live provider
                record for this pull request (for example, the repository's
                code host integration is not connected to the run's team).
              enum:
                - open
                - draft
                - merged
                - closed
                - unknown
    ScreenshotArtifactData:
      type: object
      required:
        - artifact_uid
        - mime_type
      properties:
        artifact_uid:
          type: string
          description: Unique identifier for the screenshot artifact
        mime_type:
          type: string
          description: MIME type of the screenshot image
        description:
          type: string
          description: Optional description of the screenshot
    FileArtifactData:
      type: object
      required:
        - artifact_uid
        - filepath
        - filename
        - mime_type
      properties:
        artifact_uid:
          type: string
          description: Unique identifier for the file artifact
        filepath:
          type: string
          description: |
            Conversation-relative filepath for the uploaded file. Omitted on
            an anonymous read of a public file artifact.
        filename:
          type: string
          description: Last path component of filepath
        title:
          type: string
          description: |
            Short, badge-visible label for the artifact. For recording artifacts,
            this is the agent-authored title shown in Warp web and blocklist badges.
            Distinct from description, which is longer and shown in detail views.
        description:
          type: string
          description: Optional description of the file
        mime_type:
          type: string
          description: MIME type of the uploaded file
        size_bytes:
          type: integer
          format: int64
          description: Size of the uploaded file in bytes
        thumbnail:
          $ref: '#/components/schemas/FileArtifactThumbnail'
    FileArtifactThumbnail:
      type: object
      description: The companion thumbnail image of a video recording.
      required:
        - download_url
      properties:
        download_url:
          type: string
          format: uri
          description: Stable URL of the thumbnail image. Requires authentication.
    ScheduleInfo:
      type: object
      description: Information about the schedule that triggered this run (only present for scheduled runs)
      required:
        - schedule_id
        - schedule_name
        - cron_schedule
      properties:
        schedule_id:
          type: string
          description: Unique identifier for the schedule
        schedule_name:
          type: string
          description: Name of the schedule at the time the run was created
        cron_schedule:
          type: string
          description: Cron expression at the time the run was created
    PageInfo:
      type: object
      required:
        - has_next_page
      properties:
        has_next_page:
          type: boolean
          description: Whether there are more results available
        next_cursor:
          type: string
          description: Opaque cursor for fetching the next page
    RunStatusMessage:
      type: object
      description: |
        Status message for a run. For terminal error states, includes structured
        error code and retryability info from the platform error catalog.
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable status message
        error_code:
          $ref: '#/components/schemas/PlatformErrorCode'
        retryable:
          type: boolean
          description: |
            Whether the error is transient and the client may retry by submitting
            a new run. Only present on terminal error states. When false, retrying
            without addressing the underlying cause will not succeed.
        session_debug_until:
          type: string
          format: date-time
          description: |
            When a failed run's shared session stops being held open for debugging.
            Only present while that window is open.

            The window is an idle window owned by the agent process: activity in the
            session pushes this deadline out. The agent republishes it periodically
            rather than on every keystroke, so the value can lag the true deadline by
            up to a throttle interval, and always in the conservative direction.
        debug_agent_active:
          type: boolean
          description: |
            Whether a setup-failure debug turn is actively pinning the idle timer open
            right now. While true, session_debug_until can lag behind the real deadline;
            clients should show an active-debugging state instead of a countdown.
    RequestUsage:
      type: object
      description: Resource usage information for the run
      properties:
        inference_cost:
          type: number
          format: double
          description: Credits consumed by LLM inference for the run
        compute_cost:
          type: number
          format: double
          description: Credits consumed by compute resources for the run
        platform_cost:
          type: number
          format: double
          description: Credits consumed by platform usage for the run
        inference_cost_usd:
          type: number
          format: double
          description: |
            What the run's LLM inference was billed at, in US dollars. Runs that
            predate billed-amount tracking fall back to an estimated cost.
        compute_cost_usd:
          type: number
          format: double
          description: |
            What the run's hosted compute was billed at, in US dollars. Runs that
            predate billed-amount tracking fall back to an estimated cost.
        platform_cost_usd:
          type: number
          format: double
          description: |
            What the run's platform usage was billed at, in US dollars. Runs that
            predate billed-amount tracking fall back to an estimated cost.
        total_tokens:
          type: integer
          format: int64
          description: |
            Total LLM token count (summed across every usage category and model) for the run's
            conversation. Omitted when the data is not available.
        usage_by_category:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ChargedUsageDetail'
          description: |
            Full-granularity token and charged-cost breakdown for the run's
            conversation, keyed by usage category (for example,
            primary_agent or conversation_compaction) and model id. Omitted
            when the data is not available.
        model_token_usage:
          type: array
          items:
            $ref: '#/components/schemas/ModelTokenUsage'
          description: |
            The models that actually served inference for the run, with the
            tokens each consumed. Used to discover what an auto-routing model
            resolves to. If a run is terminated before inference is complete,
            output a zero-token entry for that model. Omits runs that use
            a third-party harness, whose per-model usage is not tracked by Warp.
    ModelTokenUsage:
      type: object
      description: |
        Tokens consumed by a single model over a run.
      required:
        - model_id
        - total_tokens
        - usage_type
      properties:
        model_id:
          type: string
          description: |
            Identifier of the model that served the inference. For `warp` and
            `byok` usage this is a model id drawn from the same set as
            `agent_config.model_id`. For `custom_endpoint` usage this is the
            caller's own configuration key for the endpoint.
        total_tokens:
          type: integer
          format: int64
          description: 'Total tokens this model consumed, across every usage category.'
        usage_type:
          $ref: '#/components/schemas/ModelUsageType'
        tokens_by_category:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: |
            total_tokens split by the kind of work the tokens were spent on,
            keyed by usage category (e.g., primary_agent, tool_summarization, etc).
    ModelUsageType:
      type: string
      description: |
        How a model's inference was accessed:
        - warp: through Warp-provided model access
        - byok: through the caller's own provider API key
        - custom_endpoint: through a caller-configured model endpoint
      enum:
        - warp
        - byok
        - custom_endpoint
    InferenceCostBreakdownInCents:
      type: object
      description: |
        Charged cost of LLM inference in US cents, split by token type.
        Omitted when the data is not available.
      required:
        - input_cost_in_cents
        - input_cache_read_cost_in_cents
        - input_cache_write_cost_in_cents
        - output_cost_in_cents
      properties:
        input_cost_in_cents:
          type: number
          format: double
          description: 'Cost of non-cached input tokens, in US cents.'
        input_cache_read_cost_in_cents:
          type: number
          format: double
          description: 'Cost of cache-read input tokens, in US cents.'
        input_cache_write_cost_in_cents:
          type: number
          format: double
          description: 'Cost of cache-write input tokens, in US cents.'
        output_cost_in_cents:
          type: number
          format: double
          description: 'Cost of output tokens, in US cents.'
    TokenCountBreakdown:
      type: object
      description: A per-token-type token count.
      required:
        - input
        - output
        - input_cache_read
        - input_cache_write
      properties:
        input:
          type: integer
          format: int64
          description: Count of non-cached input tokens.
        output:
          type: integer
          format: int64
          description: Count of output tokens.
        input_cache_read:
          type: integer
          format: int64
          description: Count of cache-read input tokens.
        input_cache_write:
          type: integer
          format: int64
          description: Count of cache-write input tokens.
    InferenceUsageDetail:
      type: object
      description: |
        Full token count and charged-cost detail for inference usage.
        The counts and cost describe the same usage (e.g. token_count.input
        tokens cost cost_in_cents.input_cost_in_cents in total).
      required:
        - token_count
        - cost_in_cents
        - web_search_count
        - web_search_cost_in_cents
      properties:
        token_count:
          $ref: '#/components/schemas/TokenCountBreakdown'
        cost_in_cents:
          $ref: '#/components/schemas/InferenceCostBreakdownInCents'
        web_search_count:
          type: integer
          format: int64
          description: Number of web searches performed by this model.
        web_search_cost_in_cents:
          type: number
          format: double
          description: 'Total cost of those web searches, in US cents.'
        web_fetch_page_count:
          type: integer
          format: int64
          description: |
            Recorded web pages requested by native web-fetch calls
        web_fetch_cost_in_cents:
          type: number
          format: double
          description: |
            Total cost of recorded requested web-fetch pages, in US cents.
        web_fetch_cost_in_credits:
          type: number
          format: double
          description: |
            Cost of recorded requested web-fetch pages, in the run owner's credits.
            Omitted for customer-paid inference, unrecorded costs, or an unavailable credit rate.
    ChargedUsageDetail:
      type: object
      description: |
        Usage charged for a single usage category, broken down by usage type
        (direct API/BYOK/custom endpoint) and, within each, by model ID.
      required:
        - platform_usage_in_cents
        - platform_usage_duration_seconds
      properties:
        direct_api_inference_usage:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InferenceUsageDetail'
          description: 'Inference usage incurred through Warp-provided model access, keyed by model ID.'
        byok_inference_usage:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InferenceUsageDetail'
          description: 'Inference usage charged using a user''s own API key, keyed by model ID.'
        custom_endpoint_inference_usage:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InferenceUsageDetail'
          description: |
            Inference usage charged using a custom endpoint, keyed by the
            custom model's config key.
        platform_usage_in_cents:
          type: number
          format: double
          description: 'Platform usage charged for this category, in US cents.'
        platform_usage_duration_seconds:
          type: number
          format: double
          minimum: 0
          description: |
            Cumulative billable agent runtime for this category, in seconds,
            across the conversation's turns. Zero when no runtime was recorded.
    RunCreatorInfo:
      type: object
      properties:
        type:
          type: string
          enum:
            - user
            - service_account
          description: Type of the creator principal
        uid:
          type: string
          description: Unique identifier of the creator
        display_name:
          type: string
          description: Display name of the creator
        email:
          type: string
          description: Email address of the creator
        photo_url:
          type: string
          format: uri
          description: URL to the creator's photo
    RunState:
      type: string
      enum:
        - QUEUED
        - PENDING
        - CLAIMED
        - INPROGRESS
        - SUCCEEDED
        - FAILED
        - BLOCKED
        - ERROR
        - CANCELLED
      description: |
        Current state of the run:
        - QUEUED: Run is waiting to be picked up
        - PENDING: Run is being prepared
        - CLAIMED: Run has been claimed by a worker
        - INPROGRESS: Run is actively being executed
        - SUCCEEDED: Run completed successfully
        - FAILED: Run failed
        - BLOCKED: Run is blocked (e.g., awaiting user input or approval)
        - ERROR: Run encountered an error
        - CANCELLED: Run was cancelled by user
    RunSourceType:
      type: string
      enum:
        - LINEAR
        - API
        - MCP
        - SLACK
        - TEAMS
        - LOCAL
        - SCHEDULED_AGENT
        - WEB_APP
        - GITHUB_ACTION
        - CLOUD_MODE
        - CLI
        - JIRA
        - SELF_IMPROVEMENT
        - GITHUB_WEBHOOK
        - GITLAB_WEBHOOK
        - AZURE_DEVOPS_WEBHOOK
        - AUTOFIX
        - RUN_SCORER
        - ORCHESTRATION
        - BENCHMARK_TRIAL
        - CREATE_BENCHMARK_TASK
        - CUSTOM_WEBHOOK
      description: |
        Source that created the run:
        - LINEAR: Created from Linear integration
        - API: Created via the Warp API
        - MCP: Created through the Factory MCP server's send_task tool
        - SLACK: Created from Slack integration
        - TEAMS: Created from Microsoft Teams integration
        - LOCAL: Created from local CLI/app
        - SCHEDULED_AGENT: Created by a scheduled agent
        - WEB_APP: Created from the Warp web app
        - GITHUB_ACTION: Created from a GitHub action
        - CLOUD_MODE: Created from a Cloud Mode
        - CLI: Created from the CLI
        - JIRA: Created from Jira integration
        - SELF_IMPROVEMENT: Created by Warp's self-improvement pipeline
        - GITHUB_WEBHOOK: Created from a GitHub webhook event
        - GITLAB_WEBHOOK: Created from a GitLab webhook event
        - AZURE_DEVOPS_WEBHOOK: Created from an Azure DevOps webhook event
        - AUTOFIX: Created by Warp's autofix pipeline
        - RUN_SCORER: Created by Warp's run-scoring judge
        - ORCHESTRATION: Created as a child run by the orchestration layer (parent_run_id set)
        - BENCHMARK_TRIAL: Created as a factory benchmark trial
        - CREATE_BENCHMARK_TASK: Created by a Factory foreman authoring a benchmark task from a completed run
        - CUSTOM_WEBHOOK: Created by a factory automation subscribed to a custom webhook source
    RunExecutionLocation:
      type: string
      enum:
        - LOCAL
        - REMOTE
      description: |
        Where the run executed:
        - LOCAL: Executed in the user's local Warp environment
        - REMOTE: Executed by a remote/cloud worker
    AmbientAgentConfig:
      type: object
      description: Configuration for a cloud agent run
      properties:
        name:
          type: string
          description: |
            Human-readable label for grouping, filtering, and traceability.
            Automatically set to the skill name when running a skill-based agent.
            Set this explicitly to categorize runs by intent (e.g., "nightly-dependency-check")
            so you can filter and track them via the name query parameter on GET /agent/runs.
        model_id:
          type: string
          description: LLM model to use (uses team default if not specified)
        base_prompt:
          type: string
          description: Custom base prompt for the agent
        environment_id:
          type: string
          description: UID of the environment to run the agent in
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SecretRef'
          description: |
            Optional run-specific managed secret allowlist. Omission and an
            empty array both add no generic secrets. Secret references from
            the resolved environment and execution principal are still
            unioned into the run's secret scope.
        runner_id:
          type: string
          description: |
            UID of the runner providing the run's compute (platform, instance
            shape, and setup commands). When omitted on a request, the runner is
            resolved at run creation from the agent's default runner, then the
            environment's default runner, and the resolved UID is recorded on
            the run.
        skill_spec:
          type: string
          description: |
            Skill specification identifying the primary agent skill to use,
            in `{owner}/{repo}:{skill_path}` format (e.g.
            `warpdotdev/warp-server:.claude/skills/deploy/SKILL.md`);
            mutually exclusive with `skills` in create/update requests.
            Responses include the first `skills` entry here for backward
            compatibility; use the list agents endpoint to discover
            available skills.
        skills:
          type: array
          items:
            type: string
          description: |
            Ordered skill specifications to attach to the run.
            Format: "{owner}/{repo}:{skill_path}"
            Example: "warpdotdev/warp-server:.claude/skills/deploy/SKILL.md"
            Mutually exclusive with skill_spec in create/update requests.
        mcp_servers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MCPServerConfig'
          description: Map of MCP server configurations by name
        computer_use_enabled:
          type: boolean
          description: |
            Controls whether computer use is enabled for this agent.
            If not set, defaults to true.
        computer_use_model_id:
          type: string
          description: |
            Model the computer use subagent runs on; if omitted, the subagent
            picks its own model automatically. Only applies to the built-in
            Warp harness — the value is accepted but has no effect under a
            third-party harness or when computer use is disabled. Requires an
            agent CLI version that supports the --computer-use-model flag.
        idle_timeout_minutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 60
          description: |
            Number of minutes to keep the agent environment alive after task completion.
            Set to 0 to shut down immediately after task completion.
            If not set, defaults to 10 minutes.
            Maximum allowed value is min(60, floor(max_instance_runtime_seconds / 60) for your billing tier).
        worker_host:
          type: string
          description: |
            Self-hosted worker ID that should execute this task.
            If not specified or set to "warp", the task runs on Warp-hosted workers.
        harness:
          $ref: '#/components/schemas/Harness'
        harness_auth_secrets:
          $ref: '#/components/schemas/HarnessAuthSecrets'
        session_sharing:
          $ref: '#/components/schemas/SessionSharingConfig'
        memory_stores:
          type: array
          items:
            $ref: '#/components/schemas/MemoryStoreRef'
          description: Memory stores to attach to this run.
        inference_providers:
          allOf:
            - $ref: '#/components/schemas/InferenceProvidersConfig'
          description: |
            Optional inference provider settings for this run. Run-level
            config takes precedence over the agent's stored config and
            the workspace's admin-configured defaults.
        credential_strategy:
          oneOf:
            - type: string
              enum:
                - CREATOR
                - EXECUTOR
            - type: 'null'
          description: |
            Controls which principal's credentials are used when the
            platform mints tokens (e.g. GitHub or GitLab OAuth tokens) on
            behalf of this run.
            - EXECUTOR (default when unset): credentials are sourced from
              the run's execution principal — a GitHub App installation
              token for agent principals, a personal OAuth token for user
              principals.
            - CREATOR: credentials are always sourced from the run creator
              regardless of the execution principal, useful when a service
              account executes the run but Git operations should
              authenticate as the triggering human.
    SessionSharingConfig:
      type: object
      description: |
        Configures sharing behavior for the run's shared session; when set,
        the worker emits `--share public:<level>` and the bundled Warp
        client applies an anyone-with-link ACL to the shared session once it
        has bootstrapped. The same ACL is mirrored onto the backing
        conversation so link viewers can read it without being on the run's
        team, subject to the workspace-level anyone-with-link sharing
        setting.
      properties:
        public_access:
          type: string
          enum:
            - VIEWER
            - EDITOR
          description: |
            Grants anyone-with-link access at the specified level to the
            run's shared session and backing conversation; link viewers
            must still be authenticated Warp users (anonymous reads are not
            supported in this release).
            - VIEWER: link viewers can read the session and conversation.
            - EDITOR: link viewers can also interact with the session.
    Harness:
      type: object
      description: |
        Specifies which execution harness to use for the agent run.
        Default (nil/empty) uses Warp's built-in harness.
        When stored as a named agent's default (create/update agent identity),
        this field replaces the deprecated base_harness/base_model pair: a
        harness other than `oz` here requires the agent's base_model to be
        empty, since the two describe mutually exclusive default models.
      properties:
        type:
          oneOf:
            - type: string
              enum:
                - oz
              description: Warp's built-in harness (default).
            - $ref: '#/components/schemas/ExternalHarness'
          description: |
            The harness type identifier: `oz` for Warp's built-in harness
            (default), or any third-party harness.
        model_id:
          type: string
          description: |
            Model to use with a third-party harness (e.g. "claude-haiku-4-5").
            Only applies when type is a harness other than `oz`; the
            top-level config model_id targets the built-in Warp harness
            instead. When omitted or empty, the harness uses its own default
            model.
            For an individual Warp-managed Factory Claude Code agent, send
            an explicit empty string to use the environment's model. Omitting
            model_id when replacing that agent's harness is invalid.
        reasoning_level:
          type: string
          description: |
            Reasoning effort for harnesses that support it (e.g. Codex).
            Only applies when type is a harness other than `oz`. Ignored by
            harnesses that do not support reasoning levels.
    ExternalHarness:
      type: string
      enum:
        - claude
        - codex
        - gemini
        - pi
      description: |
        A third-party harness; every harness other than Warp's built-in `oz`.
        - claude: Claude Code
        - codex: Codex CLI
        - gemini: Gemini CLI
        - pi: Pi
    HarnessAuthSecrets:
      type: object
      description: |
        Authentication secrets for third-party harnesses.
        Only the secret for the harness specified gets injected into the environment.
      properties:
        claude_auth_secret_name:
          type: string
          description: |
            Name of a managed secret for Claude Code harness authentication.
            The secret must exist within the caller's personal or team scope.
            Only applicable when harness type is "claude".
        codex_auth_secret_name:
          type: string
          description: |
            Name of a managed secret for Codex harness authentication.
            The secret must exist within the caller's personal or team scope.
            Only applicable when harness type is "codex".
        pi_auth_secret_name:
          type: string
          description: |
            Name of a managed secret for Pi harness authentication.
            The secret must exist within the caller's personal or team scope and
            must be a credential for the model provider named by the provider
            prefix of harness.model_id.
            Only applicable when harness type is "pi".
    MCPServerConfig:
      type: object
      description: |
        Configuration for an MCP server. Must have exactly one of: warp_id, command, or url.
      properties:
        warp_id:
          type: string
          description: |
            Reference to a Warp shared MCP server by UUID, or a well-known
            integration MCP id (e.g. "linear") backed by the team's integration
            connection.
        command:
          type: string
          description: Stdio transport - command to run
        args:
          type: array
          items:
            type: string
          description: Stdio transport - command arguments
        url:
          type: string
          format: uri
          description: SSE/HTTP transport - server URL
        env:
          type: object
          additionalProperties:
            type: string
          description: Environment variables for the server
        headers:
          type: object
          additionalProperties:
            type: string
          description: HTTP headers for SSE/HTTP transport
    Error:
      type: object
      description: |
        Error response following RFC 7807 (Problem Details for HTTP APIs),
        using the `application/problem+json` content type. Includes
        backward-compatible extension members; additional ones (e.g.,
        `auth_url`, `provider`) may be present depending on the error code.
      required:
        - type
        - title
        - status
        - error
      properties:
        type:
          type: string
          format: uri
          description: |
            A URI reference that identifies the problem type (RFC 7807).
            Documentation: `https://docs.warp.dev/factories/api-and-sdk/troubleshooting/errors/{error_code}`
            See PlatformErrorCode for the list of possible error codes.
        title:
          type: string
          description: 'A short, human-readable summary of the problem type (RFC 7807)'
        status:
          type: integer
          description: The HTTP status code for this occurrence of the problem (RFC 7807)
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem (RFC 7807)
        instance:
          type: string
          description: The request path that generated this error (RFC 7807)
        error:
          type: string
          description: |
            Human-readable error message combining title and detail.
            Backward-compatible extension member for older clients.
        retryable:
          type: boolean
          description: |
            Whether the request can be retried. When true, the error is transient
            and the request may be retried. When false, retrying without addressing
            the underlying cause will not succeed.
        trace_id:
          type: string
          description: OpenTelemetry trace ID for debugging and support requests
        provider:
          type: string
          description: 'External provider that requires authorization, such as `linear`.'
        auth_url:
          type: string
          format: uri
          description: URL where the caller can reconnect the external provider.
    ArtifactResponse:
      oneOf:
        - $ref: '#/components/schemas/PlanArtifactResponse'
        - $ref: '#/components/schemas/ScreenshotArtifactResponse'
        - $ref: '#/components/schemas/FileArtifactResponse'
      discriminator:
        propertyName: artifact_type
        mapping:
          PLAN: '#/components/schemas/PlanArtifactResponse'
          SCREENSHOT: '#/components/schemas/ScreenshotArtifactResponse'
          FILE: '#/components/schemas/FileArtifactResponse'
    PlanArtifactResponse:
      type: object
      description: Response for retrieving a plan artifact.
      required:
        - artifact_uid
        - artifact_type
        - created_at
        - data
      properties:
        artifact_uid:
          type: string
          description: Unique identifier (UUID) for the artifact
        artifact_type:
          type: string
          enum:
            - PLAN
          description: Type of the artifact
        created_at:
          type: string
          format: date-time
          description: Timestamp when the artifact was created (RFC3339)
        data:
          $ref: '#/components/schemas/PlanArtifactResponseData'
    PlanArtifactResponseData:
      type: object
      description: 'Response data for a plan artifact, including current markdown content.'
      required:
        - document_uid
        - notebook_uid
        - content
        - content_type
      properties:
        document_uid:
          type: string
          description: Unique identifier for the plan document
        notebook_uid:
          type: string
          description: Unique identifier for the associated notebook
        url:
          type: string
          format: uri
          description: URL to open the plan in Warp Drive
        title:
          type: string
          description: Current title of the plan
        content:
          type: string
          description: Current markdown content of the plan
        content_type:
          type: string
          description: MIME type of the returned plan content
    ScreenshotArtifactResponse:
      type: object
      description: Response for retrieving a screenshot artifact.
      required:
        - artifact_uid
        - artifact_type
        - created_at
        - data
      properties:
        artifact_uid:
          type: string
          description: Unique identifier (UUID) for the artifact
        artifact_type:
          type: string
          enum:
            - SCREENSHOT
          description: Type of the artifact
        created_at:
          type: string
          format: date-time
          description: Timestamp when the artifact was created (RFC3339)
        source_links:
          $ref: '#/components/schemas/ArtifactSourceLinksResponse'
        data:
          $ref: '#/components/schemas/ScreenshotArtifactResponseData'
    ArtifactSourceLinksResponse:
      type: object
      description: Links to the originating run and pull requests reported in its tree. Destinations enforce their own access rules.
      properties:
        run_url:
          type: string
          format: uri
          description: 'Factory run page for the originating root run, when bound to a live Factory task.'
        pull_request_urls:
          type: array
          items:
            type: string
            format: uri
          description: Distinct pull requests reported by runs in the same tree.
    ScreenshotArtifactResponseData:
      type: object
      description: 'Response data for a screenshot artifact, including a signed download URL.'
      required:
        - download_url
        - expires_at
        - content_type
      properties:
        download_url:
          type: string
          format: uri
          description: Time-limited signed URL to download the screenshot
        expires_at:
          type: string
          format: date-time
          description: Timestamp when the download URL expires (RFC3339)
        content_type:
          type: string
          description: 'MIME type of the screenshot (e.g., image/png)'
        description:
          type: string
          description: Optional description of the screenshot
    FileArtifactResponse:
      type: object
      description: Response for retrieving a file artifact.
      required:
        - artifact_uid
        - artifact_type
        - created_at
        - data
      properties:
        artifact_uid:
          type: string
          description: Unique identifier (UUID) for the artifact
        artifact_type:
          type: string
          enum:
            - FILE
          description: Type of the artifact
        created_at:
          type: string
          format: date-time
          description: Timestamp when the artifact was created (RFC3339)
        source_links:
          $ref: '#/components/schemas/ArtifactSourceLinksResponse'
        data:
          $ref: '#/components/schemas/FileArtifactResponseData'
    FileArtifactResponseData:
      type: object
      description: 'Response data for a file artifact, including a signed download URL.'
      required:
        - download_url
        - expires_at
        - content_type
        - filename
      properties:
        download_url:
          type: string
          format: uri
          description: Time-limited signed URL to download the file
        expires_at:
          type: string
          format: date-time
          description: Timestamp when the download URL expires (RFC3339)
        content_type:
          type: string
          description: MIME type of the uploaded file
        filepath:
          type: string
          description: |
            Conversation-relative filepath for the uploaded file. Omitted for
            anonymous reads of public artifacts.
        filename:
          type: string
          description: Last path component of filepath
        title:
          type: string
          description: |
            Short, badge-visible label for the artifact. For recording artifacts,
            this is the agent-authored title shown in Warp web and blocklist badges.
            Distinct from description, which is longer and shown in detail views.
        description:
          type: string
          description: Optional description of the file
        size_bytes:
          type: integer
          format: int64
          description: Size of the uploaded file in bytes
    AttachmentInput:
      type: object
      description: A base64-encoded file attachment to include with the prompt
      required:
        - file_name
        - mime_type
        - data
      properties:
        file_name:
          type: string
          description: Name of the attached file
        mime_type:
          type: string
          description: |
            MIME type of the attachment.
            Supported image types: image/jpeg, image/png, image/gif, image/webp
        data:
          type: string
          format: byte
          description: Base64-encoded attachment data
    ScheduledAgentItem:
      type: object
      required:
        - id
        - name
        - cron_schedule
        - enabled
        - prompt
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for the scheduled agent
        name:
          type: string
          description: Human-readable name for the schedule
        cron_schedule:
          type: string
          description: 'Cron expression defining when the agent runs (e.g., "0 9 * * *" for daily at 9am UTC)'
        enabled:
          type: boolean
          description: Whether the schedule is currently active
        prompt:
          type: string
          description: The prompt/instruction for the agent to execute
        last_spawn_error:
          type:
            - string
            - 'null'
          description: 'Error message from the last failed spawn attempt, if any'
        agent_config:
          $ref: '#/components/schemas/AmbientAgentConfig'
        agent_uid:
          type: string
          format: uuid
          description: UID of the agent that this schedule runs as
        metadata:
          allOf:
            - $ref: '#/components/schemas/RunMetadata'
          description: Custom metadata stamped onto every run spawned by this schedule
        environment:
          allOf:
            - $ref: '#/components/schemas/CloudEnvironmentConfig'
          description: Resolved environment configuration (if agent_config references an environment_id)
        created_at:
          type: string
          format: date-time
          description: Timestamp when the schedule was created (RFC3339)
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the schedule was last updated (RFC3339)
        created_by:
          $ref: '#/components/schemas/RunCreatorInfo'
        updated_by:
          $ref: '#/components/schemas/RunCreatorInfo'
        history:
          $ref: '#/components/schemas/ScheduledAgentHistoryItem'
        scope:
          $ref: '#/components/schemas/Scope'
    ScheduledAgentHistoryItem:
      type: object
      description: Scheduler-derived history metadata for a scheduled agent
      properties:
        last_ran:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp of the last successful run (RFC3339)
        next_run:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp of the next scheduled run (RFC3339)
    CreateScheduledAgentRequest:
      type: object
      description: |
        Request body for creating a new scheduled agent.
        Either prompt or agent_config.skill_spec or agent_config.skills is required.
      required:
        - name
        - cron_schedule
      properties:
        name:
          type: string
          description: Human-readable name for the schedule
        cron_schedule:
          type: string
          description: 'Cron expression defining when the agent runs (e.g., "0 9 * * *" for daily at 9am UTC)'
        prompt:
          type: string
          description: |
            The prompt/instruction for the agent to execute.
            Required unless agent_config.skill_spec or agent_config.skills is provided.
        mode:
          $ref: '#/components/schemas/AgentRunMode'
          description: |
            Optional query mode applied to every triggered run. Defaults to
            `normal` when omitted. The server does not infer mode from prompt
            prefixes such as `/plan`.
        enabled:
          type: boolean
          description: Whether the schedule should be active immediately
          default: true
        agent_uid:
          type: string
          format: uuid
          description: |
            Agent UID to use as the execution principal for this schedule.
            Only valid for team-owned schedules.
        agent_config:
          $ref: '#/components/schemas/AmbientAgentConfig'
        team:
          type: boolean
          description: |
            Whether to create a team-owned schedule.
            Defaults to true for users on a single team.
        metadata:
          allOf:
            - $ref: '#/components/schemas/RunMetadata'
          description: |
            Custom metadata stamped onto every run spawned by this schedule as the run's
            explicit metadata layer.
    UpdateScheduledAgentRequest:
      type: object
      description: |
        Request body for updating a scheduled agent.
        Either prompt or agent_config.skill_spec or agent_config.skills is required.
      required:
        - name
        - cron_schedule
        - enabled
      properties:
        name:
          type: string
          description: Human-readable name for the schedule
        cron_schedule:
          type: string
          description: Cron expression defining when the agent runs
        prompt:
          type: string
          description: |
            The prompt/instruction for the agent to execute.
            Required unless agent_config.skill_spec or agent_config.skills is provided.
        mode:
          $ref: '#/components/schemas/AgentRunMode'
          description: |
            Optional query mode applied to every triggered run. Defaults to
            `normal` when omitted. The server does not infer mode from prompt
            prefixes such as `/plan`.
        enabled:
          type: boolean
          description: Whether the schedule should be active
        agent_uid:
          type: string
          format: uuid
          description: |
            Agent UID to use as the execution principal for this schedule.
            Only valid for team-owned schedules.
        agent_config:
          $ref: '#/components/schemas/AmbientAgentConfig'
        metadata:
          allOf:
            - $ref: '#/components/schemas/RunMetadata'
          description: |
            Custom metadata stamped onto every run spawned by this schedule.
            Updates follow full-replacement PUT semantics: omitting this field
            clears the schedule's metadata. Changes apply only to future runs.
    ListScheduledAgentsResponse:
      type: object
      required:
        - schedules
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledAgentItem'
          description: List of scheduled agents
    DeleteScheduledAgentResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Whether the deletion was successful
    CloudEnvironmentConfig:
      type: object
      description: Configuration for a cloud environment used by scheduled agents
      properties:
        name:
          type: string
          description: Human-readable name for the environment
        description:
          type:
            - string
            - 'null'
          description: Optional description of the environment
        docker_image:
          type: string
          description: 'Docker image to use (e.g., "ubuntu:latest" or "registry/repo:tag")'
        github_repos:
          type: array
          items:
            $ref: '#/components/schemas/GitHubRepo'
          description: List of GitHub repositories to clone into the environment
        setup_commands:
          type: array
          items:
            type: string
          description: Shell commands to run during environment setup
        providers:
          $ref: '#/components/schemas/ProvidersConfig'
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SecretRef'
          description: |
            Managed secret references contributed by this environment.
            Omission and an empty array both contribute no secrets. These
            references are unioned with references from the run config and
            execution principal.
        failure_session_retention_minutes:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 60
          description: |
            When set (1–60 minutes), a failed run using this environment
            keeps its session open for this many minutes so it can be
            inspected; null or absent means immediate teardown (disabled by
            default). This is an idle window held open by the agent process:
            activity in the session pushes the deadline out (so an active
            session is not torn down mid-debug), and it ends early if the
            run's sandbox reaches its own deadline first. Applies only to
            future failures of runs using this environment; opting in keeps
            injected environment data (including secrets) alive and incurs
            compute usage for as long as the session is held open.
    ProvidersConfig:
      type: object
      description: Optional cloud provider configurations for automatic auth
      properties:
        gcp:
          $ref: '#/components/schemas/GcpProviderConfig'
        aws:
          $ref: '#/components/schemas/AwsProviderConfig'
    InferenceProvidersConfig:
      type: object
      description: Inference provider settings used for LLM calls.
      properties:
        aws:
          $ref: '#/components/schemas/AwsInferenceProviderConfig'
    GcpProviderConfig:
      type: object
      description: GCP Workload Identity Federation settings
      required:
        - project_number
        - workload_identity_federation_pool_id
        - workload_identity_federation_provider_id
      externalDocs:
        description: Google documentation on Workload Identity Federation
        url: 'https://docs.cloud.google.com/iam/docs/workload-identity-federation'
      properties:
        project_number:
          type: string
          description: GCP project number
        workload_identity_federation_pool_id:
          type: string
          description: Workload Identity Federation pool ID
        workload_identity_federation_provider_id:
          type: string
          description: Workload Identity Federation provider ID
        service_account_email:
          type: string
          description: Optional GCP service account email to impersonate
    AwsProviderConfig:
      type: object
      description: AWS IAM role assumption settings
      externalDocs:
        description: AWS documentation on IAM OIDC federation
        url: 'https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_oidc.html'
      required:
        - role_arn
      properties:
        role_arn:
          type: string
          description: AWS IAM role ARN to assume
    AwsInferenceProviderConfig:
      type: object
      description: |
        Configures AWS Bedrock as the LLM inference provider for this
        agent or run.
      externalDocs:
        description: AWS documentation on IAM OIDC federation
        url: 'https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_oidc.html'
      properties:
        disabled:
          type: boolean
          description: 'If true, opt out of Bedrock at this layer.'
        role_arn:
          type: string
          description: IAM role ARN to assume when calling Bedrock.
        region:
          type: string
          description: AWS region used for STS when assuming the Bedrock inference role.
        role_arn_source:
          allOf:
            - $ref: '#/components/schemas/BedrockSource'
          readOnly: true
          description: |
            Which level supplied `role_arn`. Returned only on a run's
            `agent_config`, set when the run is created; absent on agents, on
            schedules, and on runs created before this field existed. Ignored
            if sent.
    GitHubRepo:
      type: object
      required:
        - owner
        - repo
      properties:
        owner:
          type: string
          description: GitHub repository owner (user or organization)
        repo:
          type: string
          description: GitHub repository name
    ListAgentsResponse:
      type: object
      required:
        - agents
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentListItem'
          description: List of available agents
    ListConnectedSelfHostedWorkersResponse:
      type: object
      required:
        - workers
      properties:
        workers:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedSelfHostedWorker'
          description: Connected self-hosted workers for the authenticated principal's team
    ConnectedSelfHostedWorker:
      type: object
      required:
        - worker_host
        - connection_count
        - connected_at
        - last_seen_at
      properties:
        worker_host:
          type: string
          description: Logical host identifier provided by the self-hosted worker
        connection_count:
          type: integer
          description: Number of active websocket connections currently observed for this worker host
        connected_at:
          type: string
          format: date-time
          description: Earliest connection timestamp across active connections for this worker host
        last_seen_at:
          type: string
          format: date-time
          description: Most recent heartbeat timestamp across active connections for this worker host
    AgentListItem:
      type: object
      required:
        - name
        - variants
      properties:
        name:
          type: string
          description: Human-readable name of the agent
        variants:
          type: array
          items:
            $ref: '#/components/schemas/AgentListVariant'
          description: Available variants of this agent
    AgentListVariant:
      type: object
      required:
        - id
        - description
        - base_prompt
        - source
        - environments
      properties:
        id:
          type: string
          description: |
            Stable identifier for this skill variant.
            Format: "{owner}/{repo}:{skill_path}"
            Example: "warpdotdev/warp-server:.claude/skills/deploy/SKILL.md"
        description:
          type: string
          description: Description of the agent variant
        base_prompt:
          type: string
          description: Base prompt/instructions for the agent
        source:
          $ref: '#/components/schemas/AgentListSource'
        environments:
          type: array
          items:
            $ref: '#/components/schemas/AgentListEnvironment'
          description: Environments where this agent variant is available
        last_run_timestamp:
          type:
            - string
            - 'null'
          format: date-time
          description: Timestamp of the last time this skill was run (RFC3339)
        error:
          type: string
          description: |
            Non-empty when the skill's SKILL.md file exists but is malformed.
            Contains a description of the parse failure. Only present when
            include_malformed_skills=true is passed to the list agents endpoint.
    AgentListSource:
      type: object
      required:
        - owner
        - name
        - skill_path
      properties:
        owner:
          type: string
          description: GitHub repository owner
        name:
          type: string
          description: GitHub repository name
        skill_path:
          type: string
          description: Path to the skill definition file within the repository
        worker_host:
          type: string
          description: |
            Self-hosted worker host that reported this skill.
            Present only for skills discovered from self-hosted workers
            (as opposed to skills from GitHub repos linked to environments).
    AgentListEnvironment:
      type: object
      required:
        - uid
        - name
      properties:
        uid:
          type: string
          description: Unique identifier for the environment
        name:
          type: string
          description: Human-readable name of the environment
    Scope:
      type: object
      description: Ownership scope for a resource (team or personal)
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - User
            - Team
          description: 'Type of ownership ("User" for personal, "Team" for team-owned)'
        uid:
          type: string
          description: UID of the owning user or team
    PlatformErrorCode:
      type: string
      description: |
        Machine-readable error code identifying the problem type.
        Used in the `type` URI of Error responses and in the `error_code`
        field of RunStatusMessage.

        User errors (run transitions to FAILED):
        - `insufficient_credits` — Team has no remaining add-on credits
        - `feature_not_available` — Required feature not enabled for user's plan
        - `external_authentication_required` — User hasn't authorized a required external service
        - `not_authorized` — Principal lacks permission for the requested operation
        - `invalid_request` — Request is malformed or contains invalid parameters
        - `resource_not_found` — Referenced resource does not exist
        - `budget_exceeded` — Spending budget limit has been reached
        - `integration_disabled` — Integration is disabled and must be enabled
        - `integration_not_configured` — Integration setup is incomplete
        - `operation_not_supported` — Requested operation not supported for this resource/state
        - `environment_setup_failed` — Client-side environment setup failed
        - `content_policy_violation` — Prompt or setup commands violated content policy
        - `conflict` — Request conflicts with the current state of the resource

        Warp errors (run transitions to ERROR):
        - `authentication_required` — Request lacks valid authentication credentials
        - `resource_unavailable` — Transient infrastructure issue (retryable)
        - `agent_stream_network_error` — MAA response stream terminally failed because of a transport or EOF error
        - `agent_stream_failure` — MAA server explicitly reported a terminal response stream failure
        - `internal_error` — Unexpected server-side error (retryable)
      enum:
        - insufficient_credits
        - feature_not_available
        - external_authentication_required
        - not_authorized
        - invalid_request
        - resource_not_found
        - budget_exceeded
        - integration_disabled
        - integration_not_configured
        - operation_not_supported
        - environment_setup_failed
        - content_policy_violation
        - conflict
        - authentication_required
        - resource_unavailable
        - agent_stream_network_error
        - agent_stream_failure
        - internal_error
    PresignedDownloadResponse:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: Temporary signed storage URL. Fetch without Warp API headers or credentials.
    RunFollowupRequest:
      type: object
      description: Request body for submitting a follow-up message to an existing run.
      properties:
        message:
          type: string
          description: |
            The follow-up message to send to the run. May be empty when
            `attachments` is non-empty.
        mode:
          $ref: '#/components/schemas/AgentRunMode'
          description: |
            Optional query mode for the follow-up. Defaults to `normal` when
            omitted. The server does not infer mode from prompt prefixes such
            as `/plan`. The mode only takes effect when the follow-up is
            queued ahead of the run starting or starts a new execution; a
            follow-up injected into a live session runs in the session's
            current mode.
        attachments:
          type: array
          maxItems: 25
          items:
            $ref: '#/components/schemas/RunFollowupAttachment'
          description: |
            Files to deliver with the message, at most 25. Each entry must
            name an attachment previously prepared for this run through
            `POST /agent/runs/{runId}/attachments/prepare` and uploaded to
            its upload target; an unknown `attachment_id` is rejected with
            422. Files are only materialized for the agent on the Oz
            harness; other harnesses receive a notice naming the files.
    RunFollowupAttachment:
      type: object
      description: A prepared attachment to deliver with a follow-up message.
      required:
        - attachment_id
      properties:
        attachment_id:
          type: string
          description: |
            The `attachment_id` (a UUID) returned by the attachment prepare
            endpoint for this run.
        file_name:
          type: string
          description: |
            Optional display name shown to the agent in place of the name
            recorded when the attachment was prepared. The stored object is
            unaffected.
    RunFollowupOutcome:
      type: string
      description: |
        How an accepted follow-up was routed.
          - live_session: the message was handed to the running session. This means
            the session-sharing service accepted it, not that the agent has started
            on it; observe the session's event stream for the new request.
          - queued_prompt: the run had not started yet, so the message was appended
            to its initial prompt.
          - handoff_execution: the previous execution had ended, so a new execution
            of the same run was created to continue the conversation.
          - queue_pending: the message is durably queued and will be delivered once
            the run can accept it.
      enum:
        - live_session
        - queued_prompt
        - handoff_execution
        - queue_pending
    RunFollowupResponse:
      type: object
      description: Acknowledgement of an accepted follow-up.
      required:
        - followup_id
        - outcome
      properties:
        followup_id:
          type:
            - string
            - 'null'
          description: |
            Identifier of the durable follow-up record, or null when the
            outcome did not create one (`queued_prompt`).
        outcome:
          $ref: '#/components/schemas/RunFollowupOutcome'
    ConversationFollowupResponse:
      type: object
      description: |
        Acknowledgement of a follow-up accepted through a conversation-keyed
        route: the run-keyed acknowledgement plus the run it was delivered to.
      required:
        - followup_id
        - outcome
        - run_id
      properties:
        followup_id:
          type:
            - string
            - 'null'
          description: |
            Identifier of the durable follow-up record, or null when the
            outcome did not create one (`queued_prompt`).
        outcome:
          $ref: '#/components/schemas/RunFollowupOutcome'
        run_id:
          type: string
          description: The run the conversation resolved to.
    ConversationInterruptResponse:
      type: object
      description: Acknowledgement of an interrupt accepted through a conversation-keyed route.
      required:
        - run_id
      properties:
        run_id:
          type: string
          description: The run whose turn is being interrupted.
    HandoffSnapshotAttachmentInfo:
      type: object
      description: A handoff snapshot attachment exposed for download.
      required:
        - attachment_id
        - filename
        - download_url
      properties:
        attachment_id:
          type: string
          description: Identifier for the snapshot attachment within the run.
        filename:
          type: string
          description: Original filename of the snapshot attachment.
        download_url:
          type: string
          format: uri
          description: Time-limited signed URL to download the snapshot attachment.
        mime_type:
          type: string
          description: 'MIME type of the snapshot attachment, if known.'
    ListHandoffSnapshotAttachmentsResponse:
      type: object
      description: Response body for listing handoff snapshot attachments.
      required:
        - attachments
      properties:
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/HandoffSnapshotAttachmentInfo'
          description: |
            Handoff snapshot attachments exposed by the latest ended execution.
            Empty when no ended execution exists or no files were uploaded.
    ListModelsResponse:
      type: object
      required:
        - default_model_id
        - models
      properties:
        default_model_id:
          type: string
          description: The ID of the default model for agent runs
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelInfo'
          description: List of available models
    ModelInfo:
      type: object
      required:
        - id
        - display_name
        - provider
        - vision_supported
      properties:
        id:
          type: string
          description: Unique identifier for the model (e.g. "claude-4-6-opus-high" or "gpt-5-4-high")
        display_name:
          type: string
          description: Human-readable name of the model
        provider:
          allOf:
            - $ref: '#/components/schemas/LlmProvider'
          description: The LLM provider
        vision_supported:
          type: boolean
          description: Whether the model supports vision/image inputs
        description:
          type: string
          description: Optional extra descriptor for the model
        reasoning_level:
          type: string
          description: 'Reasoning level descriptor, if any (e.g. "low", "medium", "high")'
        disable_reason:
          type: string
          enum:
            - PROVIDER_OUTAGE
            - OUT_OF_REQUESTS
            - ADMIN_DISABLED
            - REQUIRES_UPGRADE
          description: 'If set, the model is currently unavailable for the given reason'
    LlmProvider:
      type: string
      enum:
        - OPENAI
        - ANTHROPIC
        - GOOGLE
        - XAI
        - UNKNOWN
      description: The LLM provider behind a model.
    BedrockSource:
      type: string
      enum:
        - run
        - agent
        - workspace
      description: |
        The configuration level that supplied a Bedrock inference role: `run`,
        the run's own `config.inference_providers`; `agent`, the agent's
        `inference_providers`; `workspace`, the workspace's admin-configured
        Bedrock settings.
    ExternalReferenceArtifactData:
      type: object
      description: Data for a generic external reference artifact.
      required:
