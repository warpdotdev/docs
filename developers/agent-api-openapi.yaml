  '/agent/sessions/{sessionUuid}/redirect':
    get:
      summary: Get session redirect
      description: |
        Check whether a shared session should redirect to a conversation
        transcript, returning a conversation_id if the agent sandbox has
        finished and conversation data is available (or an empty object if
        no redirect is needed). Public and unauthenticated, so anonymous
        viewers can resolve a shared session link before signing in; access
        to the underlying transcript is still gated by conversation
        link-sharing.
