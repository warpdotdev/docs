        prompt:
          type: string
        success_criteria:
          type: string
          description: |
            Plain-text criteria the built-in Correctness scorer grades each trial
            against, as the authoritative requirements. The task prompt provides
            context only.
        source_run_id:
          type:
            - string
            - 'null'
        labels:
          type: object
          additionalProperties:
            type: string
        tags:
          type: array
          items:
            type: string
        starting_repo_refs:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkRepoRef'
    BenchmarkSuiteTaskCreateRequest:
      type: object
      required:
        - title
        - prompt
        - success_criteria
      properties:
        title:
          type: string
        prompt:
          type: string
        success_criteria:
          type: string
          description: |
            Plain-text criteria the built-in Correctness scorer grades each trial
            against, as the authoritative requirements. The task prompt provides
            context only.
        source_run_id:
          type:
            - string
            - 'null'
          description: |
            Optional provenance. The caller must be able to read the run.
        tags:
          type: array
          items:
            type: string
        starting_repo_refs:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkRepoRef'
    BenchmarkSuiteTaskPatchRequest:
      type: object
      properties:
        title:
          type: string
        prompt:
          type: string
        success_criteria:
          type: string
        source_run_id:
          type:
            - string
            - 'null'
        tags:
          type: array
          items:
            type: string
        starting_repo_refs:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkRepoRef'
    BenchmarkConfigurationInput:
      type: object
      properties:
        display_name:
          type: string
          description: Optional name for this configuration.
        harness:
          type: string
        model:
          type: string
        runner_id:
          type:
            - string
            - 'null'
          description: |
            Optional runner UID, constrained to the Factory's existing runner
            roster. Omitted or empty uses the agent's or environment's default.
        harness_auth_secret_name:
          type:
            - string
            - 'null'
