            Optional managed-secret name this configuration's third-party harness
            authenticates with. Empty or omitted is valid for Oz. For a third-party
            harness that requires auth, empty or omitted means from the worker
            environment on a self-hosted host, or a launch violation on Warp-hosted.
        agent_configs:
          type: array
          description: Optional per-named-Agent overrides keyed by stable Agent UID.
          items:
            $ref: '#/components/schemas/BenchmarkAgentConfigInput'
    BenchmarkSuitePatchRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        agent_uid:
          type: string
          description: |
            Must be supplied together with factory_agent_type, or omitted with it,
            to leave the saved selection unchanged.
        factory_agent_type:
          type: string
        tasks:
          type:
            - array
            - 'null'
          description: |
            The array order is not significant: a task's identity comes from its
            uid (when editing an existing task) or title (when creating one),
            never its position. Reads return tasks in creation order.
          items:
            $ref: '#/components/schemas/BenchmarkSuiteTaskInput'
    LaunchBenchmarkRunRequest:
      type: object
      required:
        - repetition_count
      properties:
        configurations:
          type: array
          description: |
            Optional launch-time configurations. When omitted, the suite's
            persistent configurations are used. An explicit empty list, or a
            suite with neither launch-time nor persistent configurations, is
            rejected.
          items:
            $ref: '#/components/schemas/BenchmarkConfigurationInput'
        repetition_count:
          type: integer
          description: |
            Number of repetitions per (task, configuration) pair, frozen onto the
            run. Like configurations and scorer_selection, this is chosen fresh
            at each launch rather than persisted on the suite.
        scorer_selection:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/ScorerUID'
              - type: integer
                minimum: 1
          description: |
            Allowlist of live scorer UUIDs (or temporary positive numeric IDs) for this factory, applied to every trial
            in the run. Empty or absent means all applicable scorers. IDs must
            belong to the suite's factory and team (any status except deleted).
        tasks:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
          examples:
            - - 7d69fb52-71c5-4e27-914e-8764ee9c5246
              - ad8ff7dc-a7d1-4ed6-9f50-650010bb39aa
          description: |
            Optional allowlist of immutable UIDs for current tasks in the addressed
            suite. Omitted runs all current suite tasks. Explicit empty, invalid,
            unknown, stale, cross-suite, and duplicate selections are rejected.
    BenchmarkRunLaunchResponse:
      type: object
      required:
        - uid
        - state
      properties:
        uid:
          type: string
        state:
          $ref: '#/components/schemas/BenchmarkRunState'
    BenchmarkRunList:
      type: object
      required:
        - data
        - page_info
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkRun'
          description: 'complete requested Run rows on this page, newest first.'
        page_info:
          $ref: '#/components/schemas/BenchmarkPageInfo'
          description: continuation for this Run list only.
    BenchmarkTrialList:
      type: object
      required:
        - data
        - page_info
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkTrial'
          description: 'complete requested logical Trial rows on this page, or zero/one targeted match.'
        page_info:
          $ref: '#/components/schemas/BenchmarkPageInfo'
          description: continuation for the Trial list; targeted lookup always has `has_next_page=false`.
    BenchmarkPageInfo:
      type: object
      required:
        - has_next_page
      properties:
        has_next_page:
          type: boolean
          description: true when another complete list page exists.
        next_cursor:
          type: string
          description: 'opaque scoped keyset cursor, present only when `has_next_page=true`, never null.'
    BenchmarkRun:
      type: object
      required:
        - uid
        - factory_uid
        - suite_uid
        - suite_name
        - agent_uid
        - agent_name
        - state
        - created_at
        - updated_at
        - started_at
        - completed_at
        - creator
        - execution
        - scoring
      properties:
        uid:
          type: string
          description: 'existing benchmark Run UID, including legacy non-UUID identities.'
        factory_uid:
          type: string
          description: authorized owning Factory UID.
        factory_version_sha:
          type: string
          description: |
            The commit SHA identifying the factory version at the time the benchmark run was launched.

            Note: This currently does not ensure that the factory configuration stays fixed for the duration of the benchmark run.
        suite_uid:
          type: string
          description: suite UID verified against the frozen Run context.
        suite_name:
          type:
            - string
            - 'null'
          description: retained frozen suite name; unknown legacy name is null.
        agent_uid:
          type:
            - string
            - 'null'
          description: tested root agent's frozen UID when retained.
        agent_name:
          type:
            - string
            - 'null'
          description: 'tested root agent''s frozen name, not today''s catalog name.'
        state:
          $ref: '#/components/schemas/BenchmarkRunState'
          description: captured benchmark Run lifecycle state.
        created_at:
          type: string
          format: date-time
          description: stored Run creation time.
        updated_at:
          type: string
          format: date-time
          description: 'stored Run update time, not a complete source-validity watermark.'
        started_at:
          type:
            - string
            - 'null'
          format: date-time
          description: stored Run start time; null before start or if not retained.
        completed_at:
          type:
            - string
            - 'null'
          format: date-time
          description: stored Run terminal time; null while active or if not retained.
        creator:
          oneOf:
            - $ref: '#/components/schemas/BenchmarkRunCreator'
            - type: 'null'
          description: 'safe retained creator identity, or null when it cannot be resolved.'
        execution:
          $ref: '#/components/schemas/BenchmarkExecutionProgress'
          description: 'logical Trial counts, never attempt/descendant counts.'
        scoring:
          $ref: '#/components/schemas/BenchmarkRunScoring'
          description: 'existing raw ledger and logical-Trial judging progress, without score values.'
        details:
          $ref: '#/components/schemas/BenchmarkRunDetails'
          description: present only for `include=details`; always non-null when requested.
        summary_results:
          $ref: '#/components/schemas/BenchmarkResultsSummary'
          description: 'present only for `include=summary_results`; whole-run, on-request summary without metric arrays.'
    BenchmarkRunCreator:
      type: object
      required:
        - type
        - uid
      properties:
        type:
          type: string
          enum:
            - user
            - agent
          description: resolved creator type; agent includes identities behind API keys.
        uid:
          type: string
          description: 'creator''s public UID, never its database ID.'
        display_name:
          type:
            - string
            - 'null'
          description: 'present only for an authorized creator-display-name include; null if the name is unknown, with no email fallback.'
    BenchmarkExecutionProgress:
      type: object
      required:
        - planned_total
        - total
        - pending
        - running
        - succeeded
        - failed
        - cancelled
        - completed
      properties:
        planned_total:
          type: integer
          description: frozen selected task/configuration/repetition matrix size for this scope.
        total:
          type: integer
          description: observed stored logical Trial row count.
        pending:
          type: integer
          description: 'Trials without a currently executing attempt, including queued/claimed attempts.'
        running:
          type: integer
          description: Trials with a currently executing attempt.
        succeeded:
          type: integer
          description: successfully completed logical Trials.
        failed:
          type: integer
          description: failed logical Trials after existing retry rules.
        cancelled:
          type: integer
          description: cancelled logical Trials.
        completed:
          type: integer
          description: '`succeeded + failed + cancelled`, not merely successful Trials.'
    BenchmarkRunScoring:
      type: object
      required:
        - total
        - awaiting_trial
        - pending
        - judging
        - scored
        - finished_unscored
        - not_scoreable
        - received
        - expected
        - settled
        - trials_being_judged
        - trials_scoring_finished
      properties:
        total:
          type:
            - integer
            - 'null'
          description: 'all applicable ledger pairs; null before materialization, zero only for known zero work.'
        awaiting_trial:
          type: integer
          description: raw pairs still waiting for execution to finish.
        pending:
          type: integer
          description: raw pairs awaiting judge dispatch after becoming eligible.
        judging:
          type: integer
          description: raw pairs with an active judge.
        scored:
          type: integer
          description: 'raw pairs marked scored in the durable ledger, even if bound evidence is now absent.'
        finished_unscored:
          type: integer
          description: raw pairs settled without a score.
        not_scoreable:
          type: integer
          description: raw pairs skipped because execution failed or was cancelled.
        received:
          type: integer
          description: 'exactly raw `scored`, not effective retained-score coverage.'
        expected:
          type:
            - integer
            - 'null'
          description: '`pending + judging + scored + finished_unscored` once materialized; otherwise null.'
        settled:
          type: integer
          description: raw `scored + finished_unscored + not_scoreable`.
        trials_being_judged:
          type: integer
          description: succeeded Trials with at least one pending/judging applicable pair.
        trials_scoring_finished:
          type: integer
          description: succeeded Trials with applicable work all scored/finished-unscored.
    BenchmarkRunDetails:
      type: object
      required:
        - configurations
        - task_uids
        - repetition_count
        - scorer_selection
        - scorers
        - tags
      properties:
        configurations:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkRecordedConfiguration'
          description: 'complete frozen configurations in launch order, including tooltip settings.'
        task_uids:
          type: array
          items:
            type: string
          description: 'complete selected frozen task identities in launch order, including derived legacy identities.'
        repetition_count:
          type: integer
          description: frozen repetitions per task/configuration.
        scorer_selection:
          $ref: '#/components/schemas/BenchmarkScorerSelection'
          description: 'recorded launch selection, not the materialized roster.'
        scorers:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkScorer'
          description: 'safe descriptors for this Run''s resolved scorers, using the existing authorized resolver.'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkTagTasks'
          description: complete unfiltered frozen tag-to-task mapping; derive each tag's task count from its UID-array length.
    BenchmarkRecordedConfiguration:
      type: object
      required:
        - uid
        - display_name
        - harness
        - model
        - runner_id
        - harness_auth_secret_name
        - agent_configs
      properties:
        uid:
          type: string
          description: 'stable Run-local public configuration identity, without exposing its stored integer ID.'
        display_name:
          type: string
          description: frozen user-supplied name; the existing empty string means no supplied name.
        harness:
          type:
            - string
            - 'null'
          description: recorded effective root harness; unknown legacy values remain null.
        model:
          type:
            - string
            - 'null'
          description: recorded effective root model; never filled from live defaults.
        runner_id:
          type:
            - string
            - 'null'
          description: recorded root runner identity; no per-agent runner is introduced.
        harness_auth_secret_name:
          type:
            - string
            - 'null'
          description: 'retained root credential-name reference, including unavailable names.'
        agent_configs:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkRecordedAgentConfiguration'
          description: 'complete retained named-agent settings, including the root when recorded.'
    BenchmarkRecordedAgentConfiguration:
      type: object
      required:
        - agent_uid
        - agent_name
        - harness
        - model
        - harness_auth_secret_name
      properties:
        agent_uid:
          type: string
          description: frozen named Factory agent UID.
        agent_name:
          type:
            - string
            - 'null'
          description: retained frozen named-agent label.
        harness:
          type:
            - string
            - 'null'
          description: named agent's recorded effective harness.
        model:
          type:
            - string
            - 'null'
          description: named agent's recorded effective model.
        harness_auth_secret_name:
          type:
            - string
            - 'null'
          description: retained named-agent credential-name reference.
    BenchmarkScorerSelection:
      type: object
      required:
        - mode
        - scorer_uids
      properties:
        mode:
          type: string
          enum:
            - all_applicable
            - selected
          description: 'preserved launch selection mode, even if selected scorers later disappear.'
        scorer_uids:
          type: array
          items:
            type: string
          description: complete known canonical scorer UUIDs in the selected allowlist; empty for all-applicable.
    BenchmarkScorer:
      type: object
      required:
        - scorer_uid
        - name
        - kind
        - output_type
        - output_labels
      properties:
        scorer_uid:
          type: string
          description: canonical scorer UUID supplied by the integrated identity adapter.
        name:
          type: string
          description: 'existing resolved scorer name, not a promised launch-frozen name.'
        kind:
          $ref: '#/components/schemas/ScorerKind'
          description: existing resolved scorer kind.
        output_type:
          type: string
          enum:
            - classification
          description: current benchmark results support classification only.
        output_labels:
          type: array
          items:
            type: string
          description: existing resolved classification label values in configuration order.
    BenchmarkTagTasks:
      type: object
      required:
        - tag
        - task_uids
      properties:
        tag:
          type: string
          description: 'exact frozen tag value, ordered lexically.'
        task_uids:
          type: array
          items:
            type: string
          description: 'complete distinct selected frozen task UIDs carrying this tag, in the containing `details.task_uids` order.'
    BenchmarkTrial:
      type: object
      required:
        - uid
        - run_uid
        - task_uid
        - task_title
        - task_tags
        - configuration_uid
        - repetition_index
        - state
        - terminal_reason
        - current_agent_run_id
        - attempt_count
        - scoring
      properties:
        uid:
          type: string
          description: stable logical Trial identity for task/configuration/repetition.
        run_uid:
          type: string
          description: containing benchmark Run UID.
        task_uid:
          type: string
          description: 'frozen task UID, or stable Run-local public identity for a legacy task.'
        task_title:
          type:
            - string
            - 'null'
          description: frozen task title; unknown legacy title remains null.
        task_tags:
          type: array
          items:
            type: string
          description: 'complete frozen task tags, not live tags.'
        configuration_uid:
          type: string
          description: containing Run's stable public configuration identity.
        repetition_index:
          type: integer
          description: zero-based repetition coordinate; UI labels can add one.
        state:
          $ref: '#/components/schemas/BenchmarkTrialState'
          description: captured logical Trial state after queued/claimed normalization.
        terminal_reason:
          oneOf:
            - type: string
              enum:
                - timeout
                - failure
            - type: 'null'
          description: existing failed-Trial distinction; cancellation is already in `state`.
        current_agent_run_id:
          type:
            - string
            - 'null'
          description: current execution attempt ID; null before dispatch.
        attempt_count:
          type: integer
          description: 'stored dispatch count; zero before dispatch, legacy dispatched fallback one.'
        scoring:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkTrialScoringStatus'
          description: 'complete resolved classification-scorer rows with existing ledger status when present, without values/verdicts or scorer projection.'
        matched_attempt_number:
          type: integer
          description: one-based retained/current execution match on targeted lookup only; omitted elsewhere.
        results:
          $ref: '#/components/schemas/BenchmarkTrialResults'
          description: present only for `include=results`; non-null individual evidence/metrics.
        details:
          $ref: '#/components/schemas/BenchmarkTrialDetails'
          description: present only for `include=details`; non-null complete retained history/derived times.
    BenchmarkTrialScoringStatus:
      type: object
      required:
        - scorer_uid
        - state
      properties:
        scorer_uid:
          type: string
          description: resolved canonical scorer UUID.
        state:
          oneOf:
            - $ref: '#/components/schemas/BenchmarkTrialScoringState'
            - type: 'null'
          description: existing effective ledger status after binding/cutoff checks; null when no ledger row exists.
    BenchmarkTrialResults:
      type: object
      required:
        - scoring
        - metrics
        - spend
      properties:
        scoring:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkTrialScoringResult'
          description: 'complete resolved scorer rows with existing evidence/status, including pending/unscored or absent-work rows.'
        metrics:
          $ref: '#/components/schemas/BenchmarkTrialMetrics'
          description: final retained live-tree run counts and retry-inclusive execution costs and durations.
        spend:
          $ref: '#/components/schemas/BenchmarkSpend'
          description: retained execution/judging/combined totals under existing arithmetic.
        agent_metrics:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkTrialAgentMetric'
          description: available named-agent counts and retry-inclusive costs; count-only rows have null cost_usd. Omitted when no named-agent evidence is available.
    BenchmarkTrialScoringResult:
      type: object
      required:
        - scorer_uid
        - state
        - name
        - kind
        - score
        - label
        - outcome
        - latest_judge_run_id
      properties:
        scorer_uid:
          type: string
          description: resolved canonical scorer UUID.
        state:
          oneOf:
            - $ref: '#/components/schemas/BenchmarkTrialScoringState'
            - type: 'null'
          description: existing effective ledger status after binding/cutoff checks; null when no ledger row exists.
        name:
          type: string
          description: existing authorized resolver name for this scorer.
        kind:
          $ref: '#/components/schemas/ScorerKind'
          description: existing authorized resolver kind.
        score:
          type:
            - number
            - 'null'
          format: double
          description: exact retained bound classification value at/before cutoff; zero is a real score.
        label:
          type:
            - string
            - 'null'
          description: label from that same bound score; null when no score evidence survives.
        outcome:
          oneOf:
            - type: string
              enum:
                - pass
                - fail
            - type: 'null'
          description: existing SQL-derived current-threshold verdict; null when no verdict is supplied.
        latest_judge_run_id:
          type:
            - string
            - 'null'
          description: latest retained judge execution ID by dispatch order; no full judge history is implied.
    BenchmarkTrialMetrics:
      type: object
      description: Metrics for a benchmark trial. A run is a persisted platform agent task instance; an execution is one session of that run with a recorded agent start. Resuming a run can add an execution without adding a run. Run/execution counts cover the final trial attempt's root and recursively spawned agents. Scorer runs and all their descendants are excluded.
      required:
        - agent_runs
        - agent_executions
        - compute_credits
        - platform_credits
        - inference_credits
        - total_credits
        - wall_time_s
        - compute_cost_usd
        - platform_cost_usd
        - inference_cost_usd
        - cost_usd
      properties:
        agent_runs:
          type:
            - integer
            - 'null'
          description: 'Distinct persisted platform agent task instances in the final retained live trial tree, excluding scorer runs and their descendants. Attempted runs count even if they never start or later fail. Superseded trial attempts are excluded. Null when the live tree is unavailable; deleted history is not reconstructed.'
        agent_executions:
          type:
            - integer
            - 'null'
          description: 'Distinct execution IDs with recorded agent starts in the same final retained live tree as agent_runs, including resumed sessions and starts that later fail. Dispatch or boot retries without an agent start do not count. Null when execution evidence is ambiguous or missing, independently of agent_runs; measured zero is present.'
        compute_credits:
          type: string
          description: summed retained execution-attempt compute credits.
        platform_credits:
          type: string
          description: summed retained execution-attempt platform credits.
        inference_credits:
          type: string
          description: summed retained execution-attempt inference credits.
        total_credits:
          type: string
          description: sum of those three credit components.
        wall_time_s:
          type: number
          format: double
          description: 'summed retained attempt working durations, excluding teardown; not the span between Trial.details timestamps.'
        compute_cost_usd:
          type: number
          format: double
          description: existing compute billed/fallback dollars over retained attempts.
        platform_cost_usd:
          type: number
          format: double
          description: existing platform billed/fallback dollars over retained attempts.
        inference_cost_usd:
          type: number
          format: double
          description: 'existing inference dollars, including applicable third-party provider estimates.'
        cost_usd:
          type: number
          format: double
          description: 'sum of the three dollar components, not guaranteed exact billed cost.'
        provider_cost_estimate:
          $ref: '#/components/schemas/BenchmarkProviderCostEstimate'
          description: 'existing provider estimate/attribution, omitted when unavailable; never an invented zero estimate.'
        output_tokens:
          type: integer
          description: 'sum of reported retained output-token counts; omitted when unreported, but reported zero remains present.'
        tool_calls:
          type: integer
          description: 'sum of reported retained tool-call counts; omitted when unreported, but reported zero remains present.'
    BenchmarkSpend:
      type: object
      required:
        - execution
        - judging
        - combined
      properties:
        execution:
          $ref: '#/components/schemas/BenchmarkSpendTotal'
          description: retry-inclusive retained execution totals under existing attribution.
        judging:
          $ref: '#/components/schemas/BenchmarkSpendTotal'
          description: 'totals for distinct durably linked retained judge runs, including repeated rescores.'
        combined:
          $ref: '#/components/schemas/BenchmarkSpendTotal'
          description: execution plus judging totals.
    BenchmarkSpendTotal:
      type: object
      required:
        - cost_usd
        - total_credits
      properties:
        cost_usd:
          type: number
          format: double
          description: existing mixed billed/fallback/provider-estimate dollar total.
        total_credits:
          type: string
          description: existing Warp credit total for this spend group.
    BenchmarkTrialAgentMetric:
      type: object
      description: 'Named-agent breakdown of trial metrics, with the platform run/execution definitions and scorer-branch exclusions of BenchmarkTrialMetrics.'
      required:
        - agent_runs
        - agent_executions
        - agent_uid
        - agent_name
        - cost_usd
      properties:
        agent_runs:
          type:
            - integer
            - 'null'
          description: 'Distinct persisted platform agent task instances attributed to this agent in the final retained live trial tree, excluding scorer runs and their descendants. Attempts count even if they never start or later fail. Superseded attempts are excluded. Confirmed absence is zero; null means the live tree is unavailable.'
        agent_executions:
          type:
            - integer
            - 'null'
          description: 'Distinct execution IDs with recorded agent starts attributed to this agent in the same final retained live tree as agent_runs, including resumed sessions and starts that later fail. Dispatch or boot retries without an agent start do not count. Null means this agent''s execution evidence is ambiguous or missing, independently of agent_runs; confirmed absence is zero.'
        agent_uid:
          type: string
          description: existing named-agent identity; the empty string retains the Unknown-agent fallback.
        agent_name:
          type: string
          description: 'existing resolved label, including `"Unknown agent"` when identity is unavailable.'
        cost_usd:
          type:
            - number
            - 'null'
          format: double
          description: 'Exclusive named-agent cost summed across retained retries and spawned agents, excluding scorer runs and their descendants; null when only count evidence is available.'
        sandbox_time_s:
          type: number
          format: double
          description: 'existing summed claim-to-completion seconds, omitted when any contributing duration is unknown; measured zero is present.'
        cost_breakdown:
          $ref: '#/components/schemas/BenchmarkAgentCostBreakdown'
          description: 'Retained exclusive costs and public-model attribution, omitted when the existing loader gate or availability suppresses it.'
    BenchmarkAgentCostBreakdown:
      type: object
      required:
        - compute_cost_usd
        - platform_cost_usd
        - inference_cost_usd
      properties:
        compute_cost_usd:
          type: number
          format: double
        platform_cost_usd:
          type: number
          format: double
        inference_cost_usd:
          type: number
          format: double
        categories:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BenchmarkCategoryCost'
    BenchmarkCategoryCost:
      type: object
      required:
        - cost_usd
      properties:
        cost_usd:
          type: number
          format: double
        model_costs_usd:
          type: object
          additionalProperties:
            type: number
            format: double
    BenchmarkProviderCostEstimate:
      type: object
      required:
        - cost_usd
        - incomplete
      properties:
        cost_usd:
          type: string
          description: 'public-rate estimated provider total, not a Warp-billed amount.'
        incomplete:
          type: boolean
          description: existing signal that estimate inputs/pricing are incomplete.
        attributions:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkProviderCostAttribution'
          description: complete retained safe model attributions; omitted when the existing array is empty/unavailable.
    BenchmarkProviderCostAttribution:
      type: object
      required:
        - model
        - cost_usd
        - incomplete
      properties:
        model:
          type: string
          description: provider model identity used for this estimate.
        cost_usd:
          type: string
          description: estimate subtotal for this model.
        incomplete:
          type: boolean
          description: existing model-estimate incomplete signal.
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkProviderTokenCost'
          description: 'complete retained priced token buckets, omitted when empty/unavailable.'
        adjustments:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkProviderCostAdjustment'
          description: 'complete retained price multipliers, omitted when empty/unavailable.'
    BenchmarkProviderTokenCost:
      type: object
      required:
        - kind
        - tokens
        - rate_usd_per_million
        - cost_usd
      properties:
        kind:
          type: string
          description: existing token bucket kind; preserve source values without a new enum.
        tokens:
          type: integer
          description: retained nonnegative token count in this bucket.
        rate_usd_per_million:
          type: string
          description: provider USD rate per million tokens for this bucket.
        cost_usd:
          type: string
          description: estimated USD subtotal for this token bucket.
    BenchmarkProviderCostAdjustment:
      type: object
      required:
        - kind
        - multiplier
      properties:
        kind:
          type: string
          description: 'existing adjustment kind, not credential metadata.'
        multiplier:
          type: string
          description: dimensionless multiplier applied after token subtotals.
    BenchmarkTrialDetails:
      type: object
      required:
        - started_at
        - completed_at
        - attempts
        - judge_runs
      properties:
        started_at:
          type:
            - string
            - 'null'
          format: date-time
          description: earliest retained execution claim across the Trial's attempts.
        completed_at:
          type:
            - string
            - 'null'
          format: date-time
          description: current attempt's retained terminal time only when the logical Trial is terminal.
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkExecutionAttempt'
          description: 'every retained execution attempt, ordered by one-based attempt number.'
        judge_runs:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkRetainedJudgeRun'
          description: 'every retained durable judge dispatch across scorers/rescores, ordered by dispatch time and internal row tie-breaker.'
    BenchmarkExecutionAttempt:
      type: object
      required:
        - attempt_number
        - agent_run_id
        - state
      properties:
        attempt_number:
          type: integer
          description: 'one-based position in the original attempt chain, not an array index after retention loss.'
        agent_run_id:
          type: string
          description: retained execution attempt ID.
        state:
          $ref: '#/components/schemas/BenchmarkExecutionState'
          description: 'underlying retained execution state, without logical Trial-state normalization.'
    BenchmarkRetainedJudgeRun:
      type: object
      required:
        - scorer_uid
        - name
        - kind
        - agent_run_id
      properties:
        scorer_uid:
          type: string
          description: resolved canonical identity of the scorer that dispatched this judge.
        name:
          type: string
          description: existing resolved scorer label.
        kind:
          $ref: '#/components/schemas/ScorerKind'
          description: existing resolved scorer kind.
        agent_run_id:
          type: string
          description: judge execution ID retained in the durable dispatch row.
    BenchmarkResultsSummary:
      type: object
      required:
        - factory_uid
        - suite_uid
        - run_uid
        - state
        - as_of
        - provisional
        - incomplete_reason
        - coverage
        - compute_credits
        - platform_credits
        - spend
        - elapsed_s
        - task_count
        - scorer_count
        - narrative
      properties:
        factory_uid:
          type: string
          description: authorized owning Factory UID.
        suite_uid:
          type: string
          description: verified frozen suite UID.
        run_uid:
          type: string
          description: containing benchmark Run UID.
        state:
          $ref: '#/components/schemas/BenchmarkRunState'
          description: Run lifecycle captured with the calculated sections.
        as_of:
          type: string
          format: date-time
          description: calculation time for the agreed on-request summary; not a source snapshot or provider-final time.
        provisional:
          type: boolean
          description: true for pending/running/scoring Runs whose values can still change.
        incomplete_reason:
          type:
            - string
            - 'null'
          description: existing safe failed/cancelled partial-results explanation; null in other states.
        coverage:
          $ref: '#/components/schemas/BenchmarkResultsCoverage'
          description: 'count-only execution/scoring evidence coverage, separate from raw progress.'
        compute_credits:
          type: string
          description: existing selected execution compute-credit total from RunMetrics.
        platform_credits:
          type: string
          description: existing selected execution platform-credit total from RunMetrics.
        spend:
          oneOf:
            - $ref: '#/components/schemas/BenchmarkSpend'
            - type: 'null'
          description: selected-dataset retry/judge totals; null before any selected Trial dispatch.
        elapsed_s:
          type:
            - number
            - 'null'
          format: double
          description: 'Run span from start through completion/calculation time, including scoring; null before start or if start is unknown.'
        task_count:
          type: integer
          description: 'distinct selected frozen tasks, independent of display projections and Trial pages.'
        scorer_count:
          type:
            - integer
            - 'null'
          description: 'count of resolved scorer descriptors, as in current history statistics; null before any selected Trial dispatch.'
        narrative:
          $ref: '#/components/schemas/BenchmarkNarrative'
          description: independent stored-narrative availability and eligible text.
    BenchmarkResultsCoverage:
      type: object
      required:
        - execution
        - scoring
      properties:
        execution:
          $ref: '#/components/schemas/BenchmarkExecutionCoverage'
          description: planned versus observed logical Trial rows.
        scoring:
          $ref: '#/components/schemas/BenchmarkScoringCoverage'
          description: effective retained bound scores versus expected scoring work.
    BenchmarkExecutionCoverage:
      type: object
      required:
        - planned_trial_count
        - materialized_trial_count
      properties:
        planned_trial_count:
          type: integer
          description: 'selected frozen matrix size, equal to `execution.planned_total`.'
        materialized_trial_count:
          type: integer
          description: 'observed selected logical Trial rows, equal to `execution.total`.'
    BenchmarkScoringCoverage:
      type: object
      required:
        - effective_scored_pair_count
        - expected_pair_count
      properties:
        effective_scored_pair_count:
          type: integer
          description: pairs whose exact bound score resolves under retention/access and at/before cutoff.
        expected_pair_count:
          type:
            - integer
            - 'null'
          description: materialized `pending + judging + scored + finished_unscored`; excludes awaiting-trial/not-scoreable and is null before membership is known.
    BenchmarkNarrative:
      type: object
      required:
        - availability
        - text
      properties:
        availability:
          type: string
          enum:
            - pending
            - available
            - unavailable
          description: 'current stored generation/lifecycle gate, not metric completeness.'
        text:
          type:
            - string
            - 'null'
          description: nonempty retained narrative only when available; null otherwise.
    BenchmarkResults:
      type: object
      required:
        - factory_uid
        - suite_uid
        - run_uid
        - state
        - as_of
        - provisional
        - incomplete_reason
        - coverage
        - compute_credits
        - platform_credits
        - spend
        - elapsed_s
        - task_count
        - scorer_count
        - narrative
        - execution
        - scoring
      properties:
        factory_uid:
          type: string
          description: authorized owning Factory UID.
        suite_uid:
          type: string
          description: verified frozen suite UID.
        run_uid:
          type: string
          description: containing benchmark Run UID.
        state:
          $ref: '#/components/schemas/BenchmarkRunState'
          description: Run lifecycle captured with the calculated sections.
        as_of:
          type: string
          format: date-time
          description: calculation time for the agreed on-request summary; not a source snapshot or provider-final time.
        provisional:
          type: boolean
          description: true for pending/running/scoring Runs whose values can still change.
        incomplete_reason:
          type:
            - string
            - 'null'
          description: existing safe failed/cancelled partial-results explanation; null in other states.
        coverage:
          $ref: '#/components/schemas/BenchmarkResultsCoverage'
          description: 'count-only execution/scoring evidence coverage, separate from raw progress.'
        compute_credits:
          type: string
          description: existing selected execution compute-credit total from RunMetrics.
        platform_credits:
          type: string
          description: existing selected execution platform-credit total from RunMetrics.
        spend:
          oneOf:
            - $ref: '#/components/schemas/BenchmarkSpend'
            - type: 'null'
          description: selected-dataset retry/judge totals; null before any selected Trial dispatch.
        elapsed_s:
          type:
            - number
            - 'null'
          format: double
          description: 'Run span from start through completion/calculation time, including scoring; null before start or if start is unknown.'
        task_count:
          type: integer
          description: 'distinct selected frozen tasks, independent of display projections and Trial pages.'
        scorer_count:
          type:
            - integer
            - 'null'
          description: 'count of resolved scorer descriptors, as in current history statistics; null before any selected Trial dispatch.'
        narrative:
          $ref: '#/components/schemas/BenchmarkNarrative'
          description: independent stored-narrative availability and eligible text.
        execution:
          $ref: '#/components/schemas/BenchmarkExecutionProgress'
          description: selected-dataset logical Trial counts and frozen plan size.
        scoring:
          $ref: '#/components/schemas/BenchmarkRunScoring'
          description: selected-dataset raw ledger/judging counts; display projection does not narrow them.
        configuration_metrics:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkConfigurationAggregate'
          description: present only for its include; complete selected configuration totals/averages/Overall rows.
        scorer_configuration_metrics:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkScorerConfigurationAggregate'
          description: present only for its include; complete scorer/configuration evidence and comparison rows.
        task_scorer_configuration_metrics:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkTaskScorerConfigurationAggregate'
          description: present only for its include; complete task/configuration/scorer cells across repetitions.
        agent_metrics:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkAgentMetricAggregate'
          description: present only for its include; complete existing available per-configuration named-agent rows.
    BenchmarkConfigurationAggregate:
      type: object
      required:
        - configuration_uid
        - execution
        - metrics
        - scoring
        - retried_trial_count
        - retry_count
        - overall_mean
      properties:
        configuration_uid:
          type: string
          description: stable Run-local public configuration identity; labels/settings remain in Run.details.
        execution:
          $ref: '#/components/schemas/BenchmarkExecutionProgress'
          description: logical Trial execution counts for this configuration in the selected dataset.
        metrics:
          $ref: '#/components/schemas/BenchmarkConfigurationMetrics'
          description: existing retry totals and final-successful-attempt averages.
        scoring:
          $ref: '#/components/schemas/BenchmarkOutcomeCounts'
          description: existing pass/fail counts and rate over retained applicable scores.
        retried_trial_count:
          type: integer
          description: logical Trials with more than one execution attempt.
        retry_count:
          type: integer
          description: 'sum of each logical Trial''s `max(attempt_count-1,0)`.'
        overall_mean:
          type:
            - number
            - 'null'
          format: double
          description: 'unweighted mean of available comparable scorer means, null when none exists.'
    BenchmarkConfigurationMetrics:
      type: object
      description: Configuration totals and averages. Run/execution averages use the platform definitions and scorer-branch exclusions of BenchmarkTrialMetrics.
      required:
        - avg_agent_runs
        - avg_agent_executions
        - compute_credits
        - platform_credits
        - inference_credits
        - total_credits
        - cost_usd
        - avg_total_credits_per_trial
        - avg_total_credits_per_task
        - avg_wall_time_s
        - avg_cost_usd_per_trial
      properties:
        avg_agent_runs:
          type:
            - number
            - 'null'
          format: double
          description: 'Mean observed final retained live-tree run counts over succeeded trials with available run evidence, including active descendants. Superseded attempts and failed or cancelled trials are excluded.'
        avg_agent_executions:
          type:
            - number
            - 'null'
          format: double
          description: 'Mean recorded final-tree starts and resumes over succeeded trials with available execution evidence, including trials with active descendants or queued resumes. Null when no measurements qualify; unknown starts are not zero.'
        compute_credits:
          type: string
          description: retry-inclusive execution compute-credit total.
        platform_credits:
          type: string
          description: retry-inclusive execution platform-credit total.
        inference_credits:
          type: string
          description: retry-inclusive execution inference-credit total.
        total_credits:
          type: string
          description: sum of the three execution credit components.
        cost_usd:
          type: number
          format: double
          description: retry-inclusive execution dollar total under existing mixed-cost arithmetic.
        avg_total_credits_per_trial:
          type: string
          description: 'credits averaged over final successful attempts, with existing decimal rounding.'
        avg_total_credits_per_task:
          type: string
          description: 'final-successful-attempt credits divided by distinct succeeded tasks, with existing rounding.'
        avg_wall_time_s:
          type: number
          format: double
          description: 'final successful attempt working-duration average, not retry-chain duration average.'
        avg_cost_usd_per_trial:
          type: number
          format: double
          description: 'final successful attempt cost average, not retry-chain cost average.'
        avg_output_tokens:
          type: number
          format: double
          description: average of available retained per-Trial reported token values; omitted if none reports the field.
        avg_tool_calls:
          type: number
          format: double
          description: average of available retained per-Trial reported tool values; omitted if none reports the field.
    BenchmarkScorerConfigurationAggregate:
      type: object
      required:
        - scorer_uid
        - configuration_uid
        - scored
        - pending
        - failed
        - unscored
        - no_result
        - outcomes
        - labels
        - mean
        - expected_task_count
        - scored_task_count
        - comparable
      properties:
        scorer_uid:
          type: string
          description: resolved canonical scorer identity.
        configuration_uid:
          type: string
          description: configuration coordinate for this aggregate.
        scored:
          type: integer
          description: existing retained bound-score count for this scorer/configuration.
        pending:
          type: integer
          description: existing awaiting-trial/pending/judging pair count.
        failed:
          type: integer
          description: existing not-scoreable execution-failure count.
        unscored:
          type: integer
          description: existing finished-unscored or unresolved/post-cutoff scored pair count.
        no_result:
          type:
            - string
            - 'null'
          description: existing safe no-scored-trials explanation.
        outcomes:
          $ref: '#/components/schemas/BenchmarkOutcomeCounts'
          description: existing pass/fail counts and rate for retained bound scores.
        labels:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkLabelCount'
          description: 'complete retained classification-label distribution, including known unseen labels at zero.'
        mean:
          type:
            - number
            - 'null'
          format: double
          description: unweighted counted task-cell mean for this scorer/configuration; null when no cell contributes.
        expected_task_count:
          type: integer
          description: 'existing `applies_to_tasks` selected-dataset ledger task count across configurations, before comparison neutralization.'
        scored_task_count:
          type: integer
          description: 'distinct selected tasks with a bound score here, capped at expected_task_count, as in the chart coverage warning.'
        comparable:
          type: boolean
          description: true if some configuration has a scored succeeded Trial for this scorer in the selected dataset.
    BenchmarkOutcomeCounts:
      type: object
      required:
        - pass
        - fail
        - pass_rate
      properties:
        pass:
          type: integer
          description: retained bound scores whose current-threshold outcome is pass.
        fail:
          type: integer
          description: retained bound scores whose current-threshold outcome is fail.
        pass_rate:
          type:
            - number
            - 'null'
          format: double
          description: '`pass/(pass+fail)`, null when that denominator is zero; not a scoring-coverage rate.'
    BenchmarkLabelCount:
      type: object
      required:
        - label
        - count
      properties:
        label:
          type: string
          description: retained classification label value.
        count:
          type: integer
          description: 'bound scores with this label in the aggregate, including real zero counts for known labels.'
    BenchmarkTaskScorerConfigurationAggregate:
      type: object
      required:
        - task_uid
        - task_title
        - configuration_uid
        - scorer_uid
        - expected_repetition_count
        - scored_repetition_count
        - mean
        - task_overall_mean
      properties:
        task_uid:
          type: string
          description: frozen/derived legacy task coordinate.
        task_title:
          type:
            - string
            - 'null'
          description: retained frozen title for row display.
        configuration_uid:
          type: string
          description: configuration coordinate.
        scorer_uid:
          type: string
          description: resolved canonical scorer coordinate.
        expected_repetition_count:
          type: integer
          description: 'logical Trial repetitions in this cell under existing comparison arithmetic, including execution failures.'
        scored_repetition_count:
          type: integer
          description: succeeded repetitions with permitted retained bound numeric scores.
        mean:
          type:
            - number
            - 'null'
          format: double
          description: 'average of those scored repetitions; null when none contributes, never fabricated zero.'
        task_overall_mean:
          type:
            - number
            - 'null'
          format: double
          description: 'mean of available comparable scorer means for this task/configuration, before scorer display projection.'
    BenchmarkAgentMetricAggregate:
      type: object
      description: Per-configuration named-agent totals and averages. Run/execution averages use the platform definitions and scorer-branch exclusions of BenchmarkTrialMetrics.
      required:
        - avg_agent_runs
        - avg_agent_executions
        - agent_uid
        - agent_name
        - cost_usd
        - configuration_uid
      properties:
        avg_agent_runs:
          type:
            - number
            - 'null'
          format: double
          description: 'Mean observed final retained live-tree run counts attributed to this agent over succeeded trials with available run evidence, including active descendants. Confirmed absence contributes zero; superseded attempts and failed or cancelled trials are excluded.'
        avg_agent_executions:
          type:
            - number
            - 'null'
          format: double
          description: 'Mean recorded final-tree starts and resumes attributed to this agent over succeeded trials with available execution evidence for this agent, including trials with active descendants or queued resumes. Confirmed absence contributes zero; unknown starts are not zero. Null when no measurements qualify.'
        agent_uid:
          type: string
          description: existing named-agent identity; the empty string retains the Unknown-agent fallback.
        agent_name:
          type: string
          description: 'existing resolved label, including `"Unknown agent"` when identity is unavailable.'
        cost_usd:
          type:
            - number
            - 'null'
          format: double
          description: 'Exclusive named-agent cost summed across retained retries and spawned agents, excluding scorer runs and their descendants; null when only count evidence is available.'
        sandbox_time_s:
          type: number
          format: double
          description: 'existing summed claim-to-completion seconds, omitted when any contributing duration is unknown; measured zero is present.'
        configuration_uid:
          type: string
          description: containing configuration for the existing summed named-agent breakdown.
        cost_breakdown:
          $ref: '#/components/schemas/BenchmarkAgentCostBreakdown'
          description: 'Retained exclusive costs and public-model attribution, omitted when the existing loader gate or availability suppresses it.'
    BenchmarkExecutionState:
      type: string
      enum:
        - QUEUED
        - PENDING
        - CLAIMED
        - INPROGRESS
        - SUCCEEDED
        - FAILED
        - ERROR
        - BLOCKED
        - CANCELLED
    BenchmarkTrialScoringState:
      type: string
      enum:
        - awaiting_trial
        - pending
        - judging
        - scored
        - finished_unscored
        - not_scoreable
    BenchmarkViolation:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable violation code
        message:
          type: string
          description: Human-readable explanation
    BenchmarkLaunchViolationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            violations:
              type: array
              items:
                $ref: '#/components/schemas/BenchmarkViolation'
    ListBenchmarkSuitesResponse:
      type: object
      required:
        - data
        - page_info
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BenchmarkSuite'
        page_info:
          $ref: '#/components/schemas/BenchmarkPageInfo'
