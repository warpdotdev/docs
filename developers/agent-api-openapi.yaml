  '/agent/runs/{runId}/cancel':
    post:
      summary: Cancel a run
      description: |
        Cancel an agent run that is currently queued or in progress; once
        cancelled, the run transitions to a cancelled state. Not all runs can
        be cancelled: a run already in a terminal state, in PENDING, or of an
        unsupported type (e.g. local, GitHub Action) is rejected
        instead — see the error responses below for each case.
      operationId: cancelRun
      tags:
        - agent
      security:
        - bearerAuth: []
      parameters:
        - name: runId
          in: path
          description: The unique identifier of the run to cancel
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Run cancelled successfully
          content:
            application/json:
              schema:
                type: string
                description: The ID of the cancelled run
        '400':
          description: |
            Missing run ID, or the run is already in a terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No permission to cancel run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            Run is in PENDING state and cannot be cancelled yet.
            Retry after a moment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            Run cannot be cancelled because the operation is not supported
            for this run type (e.g. local, or GitHub Action runs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/agent/runs/{runId}/followups':
    post:
      summary: Submit a follow-up message for a run
      description: |
        Send a follow-up message to an existing run. The server transparently
        routes the message based on the current state of the run (still
        queued, actively running, or ended) and will resume the agent in a new
        sandbox if necessary. A 200 response means the follow-up
        was accepted; updated run state can be observed via
        `GET /agent/runs/{runId}`.

        A run that failed during environment setup keeps its retained session
        reachable for a bounded debug window. A follow-up sent to an eligible
        run in that window is delivered into the retained session to start or
        continue a debug agent, without reopening the run: it stays in its
        failed state, with its original failure message and error code
        unchanged.
      operationId: submitRunFollowup
      tags:
        - agent
      security:
        - bearerAuth: []
      parameters:
        - name: runId
          in: path
          description: The unique identifier of the run
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunFollowupRequest'
      responses:
        '200':
          description: Follow-up accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunFollowupResponse'
        '400':
          description: |
            Invalid request (e.g. no active sandbox without conversation ID,
            malformed payload). Empty messages are accepted when continuing a
            run from saved conversation context or when attachments are
            present; otherwise they are rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No permission to submit follow-ups for this run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            An `attachment_id` is not recorded on this run (`reason:
            unknown_attachment`), or more than 25 attachments were named
            (`reason: too_many_attachments`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/agent/runs/{runId}/interrupt':
    post:
      summary: Interrupt the turn currently running on a run
      description: |
        Cancel the request the agent is currently working on without ending
        the run or tearing down its sandbox. The run stays in progress and
        accepts follow-ups afterwards. Only live runs on the Warp harness
        can be interrupted; use `POST /agent/runs/{runId}/cancel` to end a
        run outright. A 202 means the platform accepted the cancel; the agent
        applies it asynchronously.
      operationId: interruptRun
      tags:
        - agent
      security:
        - bearerAuth: []
      parameters:
        - name: runId
          in: path
          description: The unique identifier of the run
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Interrupt accepted
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Missing run ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No permission to steer this run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The run cannot be interrupted right now. `reason` is one of
            `no_live_session` (no reachable session, or the session has not
            registered a conversation yet), `session_ended`, or
            `unsupported_harness` (a non-Oz harness has no turn-level cancel).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/agent/runs/{runId}/handoff/attachments':
