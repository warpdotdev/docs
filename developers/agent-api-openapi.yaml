          description: Signed download URL when redirect=false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedDownloadResponse'
        '307':
          description: Redirect to the signed storage URL (default)
        '400':
          description: Conversation format does not support block snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: No permission to view the conversation
          content:
            application/json:
