            spawnable_descendant_agent_uids:
              type: array
              items:
                type: string
              description: |
                Stable UID-sorted list of live, non-system Factory agents
                transitively reachable from this suite's selected root under
                the server's effective delegation policy.
    BenchmarkSuiteCreateRequest:
      type: object
      required:
        - uid
        - name
        - agent_uid
        - factory_agent_type
      properties:
        uid:
          type: string
        name:
          type: string
        description:
          type: string
        agent_uid:
          type: string
        factory_agent_type:
          type: string
        tasks:
          type: array
          description: |
            The array order is not significant: a task's identity comes from its
            uid (when editing an existing task) or title (when creating one),
            never its position. Reads return tasks in creation order.
          items:
            $ref: '#/components/schemas/BenchmarkSuiteTaskInput'
    BenchmarkSuiteTaskInput:
