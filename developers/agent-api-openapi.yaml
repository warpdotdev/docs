      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkSuiteTask'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: 'Suite not found, or source_run_id is not a run the caller can read'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Another task in this suite already has this title with different content, or the Factory is file-managed and cannot be written through'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/{factory_uid}/benchmarks/{suite_uid}/tasks/{task_uid}':
