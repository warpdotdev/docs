  '/agent/conversations/{conversation_id}/screenshots/{screenshot_uid}/download':
    get:
      summary: Download a stored computer-use screenshot
      description: |
        Download a computer-use screenshot that was offloaded
        from the conversation's task history into object storage. The
        response is a redirect to a short-lived signed URL, so clients must
        follow redirects to receive the image. Requires view access to the
        conversation named in the path; a fork's history may reference
        screenshots stored under its source conversation's ID.
      operationId: downloadConversationScreenshot
      tags:
