  '/factory/{factory_uid}/benchmarks/{suite_uid}/tasks':
    post:
      summary: Create a benchmark suite task
      description: |
        This adds a single hand-authored task to a suite, without needing
        to resend the whole task list. A title, prompt, and success
        criteria are required, and if a `source_run_id` is included, the
        caller must have permission to read that run. Adding the exact
        same task twice simply returns the existing one (so retrying is
        safe), while reusing a title with different content is rejected
        as a conflict — and on a `code.storage`-managed Factory, the task
        is saved as a file and returned from that file.
      operationId: createBenchmarkSuiteTask
      tags:
        - factory
        - benchmark
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BenchmarkFactoryPath'
        - $ref: '#/components/parameters/BenchmarkSuitePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
