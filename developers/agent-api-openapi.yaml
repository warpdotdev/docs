      tags:
        - factory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScorerRequest'
      responses:
        '201':
          description: Scorer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScorerResponse'
        '400':
          description: Invalid scorer definition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller cannot edit the factory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Factory not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List agent scorers
      description: |
        List the scorers owned by the caller's team, including scope agents
        and aggregate scoring stats. Pass factory_uid to narrow the result to a
        single factory.
      operationId: listScorers
      tags:
        - agent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamUidHeaderParam'
        - name: include_managed
          in: query
          description: |
            When true, include platform-owned managed scorers (for example the
            benchmark correctness scorer) alongside user scorers. Defaults to
            false so general scorer management only lists user-defined scorers.
          required: false
          schema:
            type: boolean
            default: false
        - name: start_date
          in: query
          description: |
            RFC3339 UTC timestamp, inclusive; must be provided together with
            end_date and be strictly before it, or both omitted to use the
            unscoped window scorer detail pages use. Together with end_date,
            scopes pass_rate_summary (pass_count, fail_count, pass_rate, and
            recent_outcomes) to live scores in [start_date, end_date) instead
            of the flat recent_outcomes_limit-only window. result_count and
            last_scored_at are never affected by this parameter.
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Scorers for the caller's team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListScorersResponse'
        '400':
          description: |
            Invalid recent_outcomes_limit (not an integer in 1-100), or an
            invalid start_date/end_date pair: one given without the other,
            an unparseable RFC3339 timestamp, or start_date not strictly
            before end_date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only human users can list scorers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/scorers/{scorer_id}/results':
    get:
      summary: List recent results for an scorer
      description: |
        List the scorer's most recent scoring attempts, newest first. A
        failed attempt carries no classification. Pagination is a keyset
        cursor over attempted_at with the attempt id as a stable tiebreak.
      operationId: listScorerResults
      tags:
        - agent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamUidHeaderParam'
        - name: scorer_id
          in: path
          description: The scorer identifier
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          description: 'Maximum number of results to return (1-100, default 50)'
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: Opaque cursor returned by a previous list response.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Recent results for the scorer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListScorerResultsResponse'
        '400':
          description: 'Invalid scorer ID, limit, or cursor'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: Scorer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/scorers/{scorer_id}/results/reasons':
    get:
      summary: Read judge reasons for a page of scorer results
      description: |
        Read the judge's reasoning for the given runs in one request, so a page
        of results can show reasons alongside classifications. Reasons are
        stored outside the database and read per run with bounded concurrency;
        a run whose reason is missing or unreadable is reported individually so
        one unavailable reason never fails the request.
      operationId: listScorerResultReasons
      tags:
        - agent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamUidHeaderParam'
        - name: scorer_id
          in: path
          description: The scorer identifier
          required: true
          schema:
            type: integer
        - name: run_id
          in: query
          description: |
            Runs to read reasons for. Repeat the parameter once per run; at
            most 100 distinct runs (the results page maximum) per request.
          required: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: 'One entry per requested run, in request order'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListScorerResultReasonsResponse'
        '400':
          description: 'Invalid scorer ID, missing run_id, or too many runs'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: Scorer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/scorers/{scorer_id}/metrics/pass-rate':
    get:
      summary: Get a scorer's pass-rate metric over a date range
      description: |
        Returns a period-aligned pass-rate series plus a full-range aggregate
        for the scorer's dashboard chart, computed directly from every live
        score in [start_date, end_date) rather than the capped,
        unfiltered recent-attempts list /results returns. The headline
        pass_rate and the series describe the same window and denominator, so
        they cannot disagree. Binning follows the same day/week/month rules
        and 365-period cap as GET /factory/{uid}/metrics.
      operationId: getScorerPassRateSeries
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamUidHeaderParam'
        - name: scorer_id
          in: path
          description: The scorer identifier
          required: true
          schema:
            type: integer
        - name: start_date
          in: query
          description: 'RFC3339 UTC range start, inclusive. Defaults to 30 days before end_date.'
          required: false
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          description: 'RFC3339 UTC range end, exclusive. Defaults to now.'
          required: false
          schema:
            type: string
            format: date-time
        - name: group_by_period
          in: query
          description: Binning granularity for the series. Defaults to day.
          required: false
          schema:
            $ref: '#/components/schemas/FactoryMetricsGroupByPeriod'
      responses:
        '200':
          description: The scorer's pass-rate series and range aggregate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScorerPassRateSeriesResponse'
        '400':
          description: 'Invalid scorer ID, date range, or group_by_period'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Scorer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/scorers/{scorer_id}/self-improvement-config':
    get:
      summary: Get a scorer's self-improvement config
      description: |
        Retrieve the self-improvement configuration for a scorer: whether self-improvement is
        enabled for it.
      operationId: getScorerSelfImprovementConfig
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamUidHeaderParam'
        - name: scorer_id
          in: path
          description: The scorer identifier
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The scorer's self-improvement config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfImprovementConfigResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: Scorer not found or self-improvement not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Enable self-improvement for a scorer
      description: |
        Turn self-improvement on for a scorer, marking its config active. Self-improvement acts
        on runs the scorer itself already scores as failing (scored label's
        score below the scorer's threshold); this endpoint carries no
        classification data of its own.
      operationId: updateScorerSelfImprovementConfig
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamUidHeaderParam'
        - name: scorer_id
          in: path
          description: The scorer identifier
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The updated self-improvement config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelfImprovementConfigResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: Scorer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Disable self-improvement for a scorer
      description: Turn self-improvement off for a scorer by removing its config.
      operationId: deleteScorerSelfImprovementConfig
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamUidHeaderParam'
        - name: scorer_id
          in: path
          description: The scorer identifier
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Self-improvement config deleted
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: Scorer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /factory/run-scoring/dispatches:
    post:
      summary: Manually dispatch scoring for one or more runs
      description: |
        Immediately dispatch judge runs for the named (run, scorer) pairs,
        bypassing the two-hour idle cool-down, automatic sampling, and the
        scorer-created-after-run gate, since the caller selected the exact
        run — even a 0% sampling rate still accepts a manual dispatch. The
        full target set is validated before dispatch begins, and each pair's
        outcome (dispatched, already in flight, or failed) is reported
        independently.
      operationId: dispatchManualScoring
      tags:
        - factory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualScoringDispatchRequest'
      responses:
        '202':
          description: |
            The request was validated; judge evaluation continues
            asynchronously. Individual pairs may still report a
            failed_to_dispatch outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualScoringDispatchResponse'
        '400':
          description: |
            Malformed request, non-named-agent run, judge
            run, wrong factory, wrong agent scope, or more than 100 pairs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: 'A named run or scorer does not exist, or the caller lacks access'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error; no judge run was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/runs/{run_id}/scores':
    get:
      summary: Read a run's current scores
      description: |
        List the current live attempt for each evaluation that has attempted
        the given run, most recent attempt first. Excludes a deleted
        evaluation's data. Requires
        only view access to the run, since reading scores is part of viewing
        the run.
      operationId: listRunScores
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - name: run_id
          in: path
          description: The run identifier
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The run's current scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRunScoresResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: 'Run not found, or the caller cannot view it'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/agent/runs/{runId}/scores':
    post:
      summary: Report evaluation scores for a run
      description: |
        Report one or more evaluation verdicts for a run, called by the judge
        run dispatched to score it and authenticated with that judge run's
        API key. Each verdict is processed independently — the response
        reports per-verdict acceptance, and a rejected verdict does not block
        the others — so reporting a subset of the run's evaluations is valid.
      operationId: reportRunScores
      tags:
        - agent
      security:
        - bearerAuth: []
      parameters:
        - name: runId
          in: path
          description: The run being scored
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportRunScoresRequest'
      responses:
        '200':
          description: Every reported verdict was accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportRunScoresResponse'
        '206':
          description: The request was well-formed but at least one verdict was rejected; inspect each result's status and error before deciding whether to resubmit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportRunScoresResponse'
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/agent/identities/{uid}':
    get:
      summary: Retrieve an agent
      description: |
        Retrieve a single agent by its unique identifier.
        The response includes an `available` flag indicating whether the agent
        is within the team's plan limit and may be used for runs.
      operationId: getAgent
      tags:
        - agent
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          description: The unique identifier of the agent
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update an agent
      description: |
        Update an existing agent.
      operationId: updateAgent
      tags:
        - agent
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          description: The unique identifier of the agent
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Agent updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '400':
          description: Missing or invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'Only human users can manage agents, or plan limit exceeded'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete an agent
      description: |
        Delete an agent. All API keys associated with the
        agent are deleted atomically.
      operationId: deleteAgent
      tags:
        - agent
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          description: The unique identifier of the agent
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Agent deleted successfully
        '400':
          description: Cannot delete the default agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Only human users can manage agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Authentication via a Warp API key.
  parameters:
    TeamUidHeaderParam:
      name: X-Warp-Team-Uid
      in: header
      required: false
      description: |
        UID of the team to use as the request's active team. Ignored for
        service-account callers, which always act as their bound team.
      schema:
        type: string
  responses:
    FactoryAccessDenied:
      description: Factory access is not enabled for the authenticated principal
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Factory:
      type: object
      description: Public representation of a factory.
      required:
        - uid
        - team_uid
        - name
        - description
        - alias
        - avatar_url
        - code_forge
        - repositories
        - default_environment
        - default_model
        - scoring
        - credential_strategy
        - integrations
        - agent_defaults
        - created_at
        - updated_at
      properties:
        uid:
          type: string
          description: Public UID of the factory.
        team_uid:
          type: string
          description: Public UID of the team that owns the factory.
        name:
          type: string
          description: Display name of the factory.
        description:
          type: string
          nullable: true
          description: Optional description of the factory.
        alias:
          type: string
          nullable: true
          description: |
            Optional display handle for the factory, unique across the team's
            Warp workspace when set.
        avatar_url:
          type: string
          nullable: true
          description: |
            Short-lived signed URL for displaying the factory's avatar. The URL
            may change between reads.
        code_forge:
          $ref: '#/components/schemas/FactoryCodeForge'
        repositories:
          type: array
          items:
            $ref: '#/components/schemas/FactoryRepository'
          description: 'Repositories scoped to the factory, independent of its default environment.'
        default_environment:
          type: string
          nullable: true
          description: |
            Public UID of the factory's default environment. File-managed
            factories may omit this default.
        default_model:
          type: string
          nullable: true
          description: |
            The default model ID for the factory's runs. File-managed factories
            may omit this default. Live-managed create and PATCH requests still
            capture a concrete validated model ID.
        scoring:
          $ref: '#/components/schemas/FactoryScoringConfig'
        credential_strategy:
          allOf:
            - $ref: '#/components/schemas/FactoryCredentialStrategy'
          description: |
            Default credential strategy for runs executed by the factory's
            named agents. Always a concrete value; factories default to
            EXECUTOR unless explicitly set to CREATOR.
        integrations:
          type: array
          items:
            $ref: '#/components/schemas/FactoryIntegration'
          nullable: true
          description: |
            Integration providers attached to the factory, independent of the
            automation triggers configured for it. null means the factory has
            not declared anything yet; an empty array means no providers are
            attached.
        agent_defaults:
          $ref: '#/components/schemas/FactoryAgentDefaults'
        creator:
          allOf:
            - $ref: '#/components/schemas/FactoryCreator'
          description: |
            The user who created the factory. Absent when there is no
            resolvable creator: the factory predates creator tracking, it was
            created by a service account, or the creating user's account no
            longer exists.
        created_at:
          type: string
          format: date-time
          description: Time the factory was created.
        updated_at:
          type: string
          format: date-time
          description: Time the factory was last updated.
    FactoryCreator:
      type: object
      description: 'The user who created a factory, when resolvable.'
      required:
        - uid
      properties:
        uid:
          type: string
          description: Firebase UID of the user who created the factory.
        email:
          type: string
          nullable: true
          description: 'Creator''s email, when available.'
    FactoryAgentDefaults:
      type: object
      description: |
        Default execution settings inherited by the factory's named agents
        when they declare no override of their own.
      required:
        - default_runner_uid
        - secrets
        - mcp_servers
        - worker_host
      properties:
        harness:
          allOf:
            - $ref: '#/components/schemas/Harness'
          description: |
            Default harness for the factory's named agents. Absent when the
            factory defaults to Warp's built-in harness. model_id and
            reasoning_level carry the harness-scoped default model, which is
            also reported in the factory's default_model.
        harness_auth_secrets:
          allOf:
            - $ref: '#/components/schemas/HarnessAuthSecrets'
          description: |
            Per-harness authentication secrets inherited by the factory's
            named agents. Only the secret for the default harness is ever
            populated. A third-party default harness with no secret here
            takes its credentials from the worker environment.
        default_runner_uid:
          type: string
          description: |
            Default runner UID for the factory's named agents. Empty when
            unset, in which case the environment's default runner applies.
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SecretRef'
          description: Secrets attached to the factory's named agents by default.
        mcp_servers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MCPServerConfig'
          description: |
            MCP server configurations attached to the factory's named agents
            by default. Only warp_id (managed MCP) entries are representable
            for a Warp-managed factory.
        worker_host:
          type: string
          description: |
            Default worker host for the factory's named agents. Empty when
            unset, in which case the workspace default applies.
    FactoryScoringConfig:
      type: object
      required:
        - default_model
      properties:
        default_model:
          type: string
          nullable: true
          description: |
            Optional factory override for the model used by managed scorers and
            scorer-creation prefills. null or absent resolves to the platform
            judge default. User-created scorers still require an explicit
            model_id on create.
    FactoryIntegration:
      type: object
      description: |
        An integration provider attached to a factory.
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/FactoryIntegrationProvider'
        slack:
          allOf:
            - $ref: '#/components/schemas/FactorySlackIntegrationSettings'
          nullable: true
          description: |
            Persisted Slack settings. Present only when type is slack and the
            factory has declared at least one Slack setting. Omitted fields
            keep their default-off behavior.
    FactorySlackIntegrationSettings:
      type: object
      description: |
        Persisted Slack settings on a factory integration. Omitted fields keep
        their default-off behavior.
      properties:
        auto_respond_to_thread_replies:
          type: boolean
          nullable: true
          description: |
            When true, eligible plain channel thread replies still reach the
            reply-intent classifier. When false or omitted, those replies are
            ignored unless they @-mention the Factory. Direct messages are
            unchanged.
    FactoryIntegrationProvider:
      type: string
      description: |
        Integration provider that can be attached to a factory. github is not
        accepted here; repository access comes from the factory's code forge.
      enum:
        - jira
        - linear
        - slack
    FactoryCodeForge:
      type: string
      description: |
        Primary source-control provider for the factory. GITHUB and GITLAB
        identify the compatibility primary when repositories span one or more
        forges. NONE declares a repo-less factory with no native repositories;
        its environment relies on setup_commands to clone from any host.
      enum:
        - GITHUB
        - GITLAB
        - NONE
    FactoryRepositoryCodeForge:
      type: string
      description: The concrete source-control provider hosting a repository.
      enum:
        - GITHUB
        - GITLAB
    FactoryCredentialStrategy:
      type: string
      description: |
        Default credential strategy for runs executed by the factory's named
        agents.
        - EXECUTOR (default): runs authenticate with the named agent's own
          credentials (e.g. a GitHub App installation token for the
          factory's team).
        - CREATOR: runs authenticate with the credentials of the principal
          that created the run.
      enum:
        - CREATOR
        - EXECUTOR
    FactoryRepository:
      type: object
      description: A repository scoped to a factory.
      required:
        - owner
        - repo
      properties:
        owner:
          type: string
          description: Repository owner (or full namespace for GitLab).
        repo:
          type: string
          description: Repository name.
        code_forge:
          allOf:
            - $ref: '#/components/schemas/FactoryRepositoryCodeForge'
          description: |
            The concrete forge hosting this repository. Omitted means the
            factory's primary code_forge.
    FactoryMetricsGroupByPeriod:
      type: string
      description: |
        Binning granularity for factory metrics series. Weeks start on
        Sunday (UTC), consistent with existing Warp analytics.
      enum:
        - day
        - week
        - month
    ListFactoriesResponse:
      type: object
      description: Response body for listing factories.
      required:
        - factories
        - page_info
      properties:
        factories:
          type: array
          items:
            $ref: '#/components/schemas/Factory'
        page_info:
          $ref: '#/components/schemas/PageInfo'
    FactoryRunRequest:
      type: object
      description: Request body for dispatching a run to a factory.
      required:
        - prompt
      properties:
        prompt:
          type: string
          description: |
            The prompt sent to the factory's foreman, not wrapped in any
            factory intake envelope. Required and non-empty.
        title:
          type: string
          description: |
            Human-readable title for the dispatched run and its factory task.
            Omit to derive one automatically from the prompt.
        ticket_ref:
          type: string
          description: |
            Originating ticket reference in <source>:<id> form (for
            example, linear:REMOTE-123); omit to mint an adhoc reference.
            Stamped onto the run as ticket_id/ticket_source metadata.
        ticket_url:
          type: string
          description: |
            Optional URL of the ticket named by ticket_ref. Stamped onto
            the run as ticket_url metadata when given.
    FactoryRunResponse:
      type: object
      description: Response body for a dispatched factory run.
      required:
        - run_id
        - state
        - factory_uid
        - foreman_agent
        - ticket_ref
      properties:
        run_id:
          type: string
          description: Unique identifier for the dispatched run.
        run_url:
          type: string
          description: |
            URL to view the dispatched run in the Factory app. Empty when
            the Factory app origin is not configured.
        state:
          $ref: '#/components/schemas/RunState'
        factory_uid:
          type: string
          description: Public UID of the factory the run was dispatched to.
        foreman_agent:
          type: string
          description: Name of the factory's foreman agent that received the run.
        ticket_ref:
          type: string
          description: |
            The canonical <source>:<id> ticket reference the run was
            stamped with, either the caller-supplied ticket_ref or a
            minted adhoc reference.
    RunAgentRequest:
      type: object
      description: |
        Request body for creating a new agent run.
        Either prompt or skill (via skill field, config.skill_spec, or config.skills) is required,
        except for handoff requests that set conversation_id.
      properties:
        prompt:
          type: string
          description: |
            The prompt/instruction for the agent to execute.
            Required unless a skill is specified via the skill field, config.skill_spec, or config.skills.
            Handoff requests may omit prompt when conversation_id is set.
        mode:
          $ref: '#/components/schemas/AgentRunMode'
          description: |
            Optional query mode for the run. Defaults to `normal` when omitted.
            The server does not infer mode from prompt prefixes such as `/plan`,
            so callers should pass this field explicitly to request non-normal behavior.
        skill:
          type: string
          description: |
            Skill specification to use as the base prompt for the agent.
            Supported formats:
              - "repo:skill_name" - Simple name in specific repo
              - "repo:skill_path" - Full path in specific repo
              - "org/repo:skill_name" - Simple name with org and repo
              - "org/repo:skill_path" - Full path with org and repo
            When provided, this takes precedence over config.skill_spec.
        config:
          $ref: '#/components/schemas/AmbientAgentConfig'
        title:
          type: string
          description: Custom title for the run (auto-generated if not provided)
        team:
          type: boolean
          description: |
            Whether to create a team-owned run.
            Defaults to true for users on a single team.
        agent_identity_uid:
          type: string
          description: |
            Optional agent identity UID to use as the execution principal for the run.
            This is only valid for runs that are team owned.
        on_behalf_of:
          type: string
          description: |
            Optional email address or user ID of a Warp user to attribute
            the run to; when set, the resolved user becomes the run's
            creator instead of the caller. Only agent API keys may use this
            field, only when the calling agent has on_behalf_of enabled in
            its configuration (a team admin must turn this on per agent),
            and only for team-owned runs. The target user must be an active
            member of the run's owner team.
        conversation_id:
          type: string
          description: |
            Optional conversation ID to continue an existing conversation.
            If provided, the agent will continue from where the previous run left off.
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentInput'
          description: |
            Optional file attachments to include with the prompt (max 5).
            Attachments are uploaded to cloud storage and made available to the agent.
        parent_run_id:
          type: string
          description: |
            Optional run ID of the parent that spawned this run, used for
            orchestration hierarchies; the parent run must exist and be
            visible to the caller, or the request is rejected with a 400.
            Child runs are also subject to the server's maximum
            orchestration depth, and requests that would exceed it are
            rejected with a 400.
        interactive:
          type: boolean
          description: |
            Whether the run should be interactive.
            If not set, defaults to false.
        metadata:
          $ref: '#/components/schemas/RunMetadata'
    RunMetadata:
      type: object
      additionalProperties:
        type: string
      description: |
        Custom key/value metadata attached to a run at creation time and
        immutable afterward; at most 20 keys, with keys 1-64 bytes matching
        [a-zA-Z0-9._-]+ (case-sensitive) and values 0-256 bytes of UTF-8 with
        no NUL characters. Requests with invalid metadata are rejected. A
        run's effective metadata is merged per key at creation: explicit
        request keys override keys inherited from the parent run, which
        override automatic keys (ticket_id and ticket_source on Linear- and
        Jira-triggered runs).
    RunAgentResponse:
      type: object
      required:
        - run_id
        - task_id
        - state
      properties:
        run_id:
          type: string
          description: Unique identifier for the created run
        task_id:
          type: string
          deprecated: true
          description: Unique identifier for the task (same as run_id). Deprecated - use run_id instead.
        state:
          $ref: '#/components/schemas/RunState'
        at_capacity:
          type: boolean
          description: Whether the system is at capacity when the run was created
    AgentRunMode:
      type: string
      description: |
        Query mode for an agent run.
          - normal: Standard user query (default).
          - plan: Planning Mode. The agent researches and creates a plan, then waits for approval before execution.
          - orchestrate: Orchestration Mode. The agent proposes an orchestration plan and must not start child agents until approved.
      enum:
        - normal
        - plan
        - orchestrate
      default: normal
    ListRunsResponse:
      type: object
      required:
        - runs
        - page_info
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/RunItem'
        page_info:
          $ref: '#/components/schemas/PageInfo'
    RunItem:
      type: object
      required:
        - run_id
        - task_id
        - title
        - state
        - prompt
        - created_at
        - updated_at
      properties:
        run_id:
          type: string
          description: Unique identifier for the run
        task_id:
          type: string
          deprecated: true
          description: Unique identifier for the task (typically matches run_id). Deprecated - use run_id instead.
        title:
          type: string
          description: Human-readable title for the run
        state:
          $ref: '#/components/schemas/RunState'
        execution_location:
          $ref: '#/components/schemas/RunExecutionLocation'
        prompt:
          type: string
          description: The prompt/instruction for the agent
        created_at:
          type: string
          format: date-time
          description: Timestamp when the run was created (RFC3339)
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the run was last updated (RFC3339)
        run_time:
          type: string
          format: duration
          description: 'Total runtime as an ISO 8601 duration (e.g. "PT2M30S"), computed server-side from run executions.'
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the agent started working on the run (RFC3339)
        status_message:
          $ref: '#/components/schemas/RunStatusMessage'
        source:
          $ref: '#/components/schemas/RunSourceType'
        schedule:
          $ref: '#/components/schemas/ScheduleInfo'
        session_id:
          type: string
          description: UUID of the shared session (if available)
        session_link:
          type: string
          format: uri
          description: URL to view the agent session
        trigger_url:
          type: string
          format: uri
          description: 'URL to the run trigger (e.g. Slack thread, Linear issue, schedule)'
        creator:
          $ref: '#/components/schemas/RunCreatorInfo'
        executor:
          $ref: '#/components/schemas/RunCreatorInfo'
        request_usage:
          $ref: '#/components/schemas/RequestUsage'
        agent_config:
          $ref: '#/components/schemas/AmbientAgentConfig'
        conversation_id:
          type: string
          description: UUID of the conversation associated with the run
        parent_run_id:
          type: string
          description: UUID of the parent run that spawned this run
        metadata:
          $ref: '#/components/schemas/RunMetadata'
        is_sandbox_running:
          type: boolean
          description: Whether the sandbox environment is currently running
        is_run_type_cancellable:
          type: boolean
          description: |
            Whether the run's type is eligible for cancellation via the API. State-independent:
            false for GitHub Action and local runs; true for all other run types (including
            self-hosted). Clients should still gate the control on the run's current state.
        debug_agent_available:
          type: boolean
          description: |
            Whether a debug agent can currently be started inside this run's retained
            setup-failure session. Only true for a run that failed during environment setup,
            whose retained execution is still reachable, and whose debug window has not
            closed. See `POST /agent/runs/{runId}/followups`.
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactItem'
          description: 'Artifacts created during the run (plans, pull requests, etc.)'
        agent_skill:
          $ref: '#/components/schemas/AgentSkill'
        scope:
          $ref: '#/components/schemas/Scope'
    GetRunTimelineResponse:
      type: object
      description: Response body for listing run timeline events.
      required:
        - events
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AIRunTimelineEvent'
    AIRunTimelineEvent:
      type: object
      description: A setup or lifecycle event recorded for an agent run.
      required:
        - event_uuid
        - run_id
        - event_type
        - occurred_at
      properties:
        event_uuid:
          type: string
          description: Unique client- or server-generated identifier for this event.
        run_id:
          type: string
          description: Run that owns this event.
        execution_id:
          type: integer
          format: int64
          description: 'Run execution associated with this event, when available.'
        event_type:
          $ref: '#/components/schemas/AIRunTimelineEventType'
        occurred_at:
          type: string
          format: date-time
          description: Timestamp when the event occurred.
        payload:
          type: object
          additionalProperties: true
          description: Optional event-specific JSON payload. Contents vary by event type.
    AIRunTimelineEventType:
      type: string
      description: Type of timeline event recorded for a run.
      enum:
        - oz_run_created
        - oz_run_claimed
        - worker_container_ready
        - shared_session_started
        - agent_started
        - oz_run_done
        - oz_run_blocked
        - oz_run_cancelled
        - oz_run_failed
        - oz_run_errored
        - vm_shutdown
    ConversationResponse:
      type: object
      required:
        - conversation_id
        - steps
      properties:
        conversation_id:
          type: string
          description: Unique identifier for the conversation
        steps:
          type: array
          description: Root steps in the conversation
          items:
            $ref: '#/components/schemas/ConversationStep'
    ConversationStep:
      type: object
      required:
        - id
        - messages
        - steps
      properties:
        id:
          type: string
          description: Unique identifier for the step
        description:
          type: string
          description: Original instruction or delegated work description for the step
        summary:
          type: string
          description: Summary of the work completed for the step
        started_at:
          type: string
          format: date-time
          description: Earliest transcript message timestamp contained in this step or any nested step (RFC3339)
        completed_at:
          type: string
          format: date-time
          description: Latest transcript message timestamp contained in this step or any nested step (RFC3339)
        messages:
          type: array
          description: Ordered normalized messages for this step
          items:
            $ref: '#/components/schemas/ConversationMessage'
        steps:
          type: array
          description: Nested delegated work performed as part of this step
          items:
            $ref: '#/components/schemas/ConversationStep'
    ConversationMessage:
      type: object
      required:
        - role
        - content
      properties:
        message_ids:
          type: array
          description: Underlying transcript message IDs grouped into this normalized message
          items:
            type: string
        request_id:
          type: string
          description: 'Request identifier shared by transcript messages from the same request, when available'
        role:
          $ref: '#/components/schemas/ConversationMessageRole'
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the first transcript message included in this normalized message (RFC3339)
        content:
          type: array
          items:
            $ref: '#/components/schemas/ConversationContentBlock'
    ConversationMessageRole:
      type: string
      description: Role of the normalized message
      enum:
        - user
        - assistant
        - tool
        - system
    ConversationContentBlock:
      oneOf:
        - $ref: '#/components/schemas/TextContentBlock'
        - $ref: '#/components/schemas/ActionContentBlock'
        - $ref: '#/components/schemas/ActionResultContentBlock'
        - $ref: '#/components/schemas/EventContentBlock'
      discriminator:
        propertyName: type
        mapping:
          text: '#/components/schemas/TextContentBlock'
          action: '#/components/schemas/ActionContentBlock'
          action_result: '#/components/schemas/ActionResultContentBlock'
          event: '#/components/schemas/EventContentBlock'
    TextContentBlock:
      type: object
      required:
        - type
        - text
      properties:
        type:
          type: string
          enum:
            - text
        message_id:
          type: string
          description: 'Underlying transcript message ID that produced this content block, when available'
        text:
          type: string
          description: Plain text content
    ActionCategory:
      type: string
      description: High-level category of an action performed during the conversation
      enum:
        - command
        - files
        - search
        - integration
        - documents
        - computer
        - review
        - skill
    ActionState:
      type: string
      description: State of an action result
      enum:
        - running
        - completed
        - failed
        - denied
    ActionContentBlock:
      type: object
      required:
        - type
        - id
        - category
        - name
        - input
      properties:
        type:
          type: string
          enum:
            - action
        message_id:
          type: string
          description: 'Underlying transcript message ID that produced this content block, when available'
        id:
          type: string
          description: Unique identifier for the action
        category:
          $ref: '#/components/schemas/ActionCategory'
        name:
          type: string
          description: 'Public action name, such as run_command or edit_files'
        input:
          type: object
          additionalProperties: true
          description: Curated public input for this action. This object is owned by the API and is not a raw internal tool payload.
    ActionResultContentBlock:
      type: object
      required:
        - type
        - action_id
        - category
        - name
        - state
        - output
      properties:
        type:
          type: string
          enum:
            - action_result
        message_id:
          type: string
          description: 'Underlying transcript message ID that produced this content block, when available'
        action_id:
          type: string
          description: Identifier of the corresponding action
        category:
          $ref: '#/components/schemas/ActionCategory'
        name:
          type: string
          description: Public action name matching the corresponding action block
        state:
          $ref: '#/components/schemas/ActionState'
        output:
          type: object
          additionalProperties: true
          description: Curated public result for this action. Large or binary internal payloads should be summarized rather than passed through raw.
    EventContentBlock:
      type: object
      required:
        - type
        - name
        - data
      properties:
        type:
          type: string
          enum:
            - event
        message_id:
          type: string
          description: 'Underlying transcript message ID that produced this content block, when available'
        name:
          type: string
          description: Event type for intentionally exposed non-core transcript events
        data:
          type: object
          additionalProperties: true
          description: Minimal structured metadata for the event
    ArtifactItem:
      oneOf:
        - $ref: '#/components/schemas/PlanArtifact'
        - $ref: '#/components/schemas/PullRequestArtifact'
        - $ref: '#/components/schemas/ScreenshotArtifact'
        - $ref: '#/components/schemas/FileArtifact'
        - $ref: '#/components/schemas/ExternalReferenceArtifact'
      discriminator:
        propertyName: artifact_type
        mapping:
          PLAN: '#/components/schemas/PlanArtifact'
          PULL_REQUEST: '#/components/schemas/PullRequestArtifact'
          SCREENSHOT: '#/components/schemas/ScreenshotArtifact'
          FILE: '#/components/schemas/FileArtifact'
          EXTERNAL_REFERENCE: '#/components/schemas/ExternalReferenceArtifact'
    ExternalReferenceArtifact:
      type: object
      required:
        - artifact_type
        - created_at
        - data
      properties:
        artifact_type:
          type: string
          enum:
            - EXTERNAL_REFERENCE
          description: Type of the artifact
        created_at:
          type: string
          format: date-time
          description: Timestamp when the artifact was created (RFC3339)
        data:
          $ref: '#/components/schemas/ExternalReferenceArtifactData'
    PlanArtifact:
      type: object
      required:
        - artifact_type
        - created_at
        - data
      properties:
        artifact_type:
          type: string
          enum:
            - PLAN
          description: Type of the artifact
        created_at:
          type: string
          format: date-time
          description: Timestamp when the artifact was created (RFC3339)
        data:
          $ref: '#/components/schemas/PlanArtifactData'
    PullRequestArtifact:
      type: object
      required:
        - artifact_type
        - created_at
        - data
      properties:
        artifact_type:
          type: string
          enum:
            - PULL_REQUEST
          description: Type of the artifact
        created_at:
          type: string
          format: date-time
          description: Timestamp when the artifact was created (RFC3339)
        data:
          $ref: '#/components/schemas/PullRequestArtifactData'
    ScreenshotArtifact:
      type: object
      required:
        - artifact_type
        - created_at
        - data
      properties:
        artifact_type:
          type: string
          enum:
            - SCREENSHOT
          description: Type of the artifact
        created_at:
          type: string
          format: date-time
          description: Timestamp when the artifact was created (RFC3339)
        data:
          $ref: '#/components/schemas/ScreenshotArtifactData'
    FileArtifact:
      type: object
      required:
        - artifact_type
        - created_at
        - data
      properties:
        artifact_type:
          type: string
          enum:
            - FILE
          description: Type of the artifact
        created_at:
          type: string
          format: date-time
          description: Timestamp when the artifact was created (RFC3339)
        data:
          $ref: '#/components/schemas/FileArtifactData'
    PlanArtifactData:
      type: object
      required:
        - document_uid
      properties:
        artifact_uid:
          type: string
          description: 'Unique identifier for the plan artifact, usable with the artifact retrieval endpoint'
        document_uid:
          type: string
          description: Unique identifier for the plan document
        notebook_uid:
          type: string
          description: Unique identifier for the associated notebook
        url:
          type: string
          format: uri
          description: URL to open the plan in Warp Drive
        title:
          type: string
          description: Title of the plan
    PullRequestArtifactData:
      type: object
      required:
        - url
        - branch
      properties:
        url:
          type: string
          format: uri
          description: URL of the pull request
        branch:
          type: string
          description: Branch name for the pull request
    ScreenshotArtifactData:
      type: object
      required:
        - artifact_uid
        - mime_type
      properties:
        artifact_uid:
          type: string
          description: Unique identifier for the screenshot artifact
        mime_type:
          type: string
          description: MIME type of the screenshot image
        description:
          type: string
          description: Optional description of the screenshot
    FileArtifactData:
      type: object
      required:
        - artifact_uid
        - filepath
        - filename
        - mime_type
      properties:
        artifact_uid:
          type: string
          description: Unique identifier for the file artifact
        filepath:
          type: string
          description: |
            Conversation-relative filepath for the uploaded file. Omitted on
            an anonymous read of a public file artifact.
        filename:
          type: string
          description: Last path component of filepath
        title:
          type: string
          description: |
            Short, badge-visible label for the artifact. For recording artifacts,
            this is the agent-authored title shown in Warp web and blocklist badges.
            Distinct from description, which is longer and shown in detail views.
        description:
          type: string
          description: Optional description of the file
        mime_type:
          type: string
          description: MIME type of the uploaded file
        size_bytes:
          type: integer
          format: int64
          description: Size of the uploaded file in bytes
    ScheduleInfo:
      type: object
      description: Information about the schedule that triggered this run (only present for scheduled runs)
      required:
        - schedule_id
        - schedule_name
        - cron_schedule
      properties:
        schedule_id:
          type: string
          description: Unique identifier for the schedule
        schedule_name:
          type: string
          description: Name of the schedule at the time the run was created
        cron_schedule:
          type: string
          description: Cron expression at the time the run was created
    PageInfo:
      type: object
      required:
        - has_next_page
      properties:
        has_next_page:
          type: boolean
          description: Whether there are more results available
        next_cursor:
          type: string
          description: Opaque cursor for fetching the next page
    RunStatusMessage:
      type: object
      description: |
        Status message for a run. For terminal error states, includes structured
        error code and retryability info from the platform error catalog.
      required:
        - message
      properties:
        message:
          type: string
          description: Human-readable status message
        error_code:
          $ref: '#/components/schemas/PlatformErrorCode'
        retryable:
          type: boolean
          description: |
            Whether the error is transient and the client may retry by submitting
            a new run. Only present on terminal error states. When false, retrying
            without addressing the underlying cause will not succeed.
        session_debug_until:
          type: string
          format: date-time
          description: |
            When a failed run's shared session stops being held open for debugging.
            Only present while that window is open.

            The window is an idle window owned by the agent process: activity in the
            session pushes this deadline out. The agent republishes it periodically
            rather than on every keystroke, so the value can lag the true deadline by
            up to a throttle interval, and always in the conservative direction.
        debug_agent_active:
          type: boolean
          description: |
            Whether a setup-failure debug turn is actively pinning the idle timer open
            right now. While true, session_debug_until can lag behind the real deadline;
            clients should show an active-debugging state instead of a countdown.
    RequestUsage:
      type: object
      description: Resource usage information for the run
      properties:
        inference_cost:
          type: number
          format: double
          description: Credits consumed by LLM inference for the run
        compute_cost:
          type: number
          format: double
          description: Credits consumed by compute resources for the run
        platform_cost:
          type: number
          format: double
          description: Credits consumed by platform usage for the run
        inference_cost_usd:
          type: number
          format: double
          description: |
            inference_cost in US dollars, converted at the owning team's
            current credit price. An approximate cost, not a billed amount.
        compute_cost_usd:
          type: number
          format: double
          description: |
            compute_cost in US dollars, converted at the owning team's
            current credit price. An approximate cost, not a billed amount.
        platform_cost_usd:
          type: number
          format: double
          description: |
            platform_cost in US dollars, converted at the owning team's
            current credit price. An approximate cost, not a billed amount.
        total_tokens:
          type: integer
          format: int64
          description: |
            Total LLM token count (summed across every usage category and model) for the run's
            conversation. Omitted when the data is not available.
        inference_cost_breakdown_usd:
          $ref: '#/components/schemas/InferenceCostBreakdownUsd'
        usage_by_category:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ChargedUsageDetail'
          description: |
            Full-granularity token and dollar-cost breakdown for the run's
            conversation, keyed by usage category (for example,
            primary_agent or conversation_compaction) and model id; differs
            from total_tokens/inference_cost_breakdown_usd, which combine
            usage across all categories and models. Omitted when the data
            is not available.
    InferenceCostBreakdownUsd:
      type: object
      description: |
        Charged dollar cost of LLM inference, split by token type.
        Omitted when the data is not available.
      required:
        - input_cost_usd
        - input_cache_read_cost_usd
        - input_cache_write_cost_usd
        - output_cost_usd
      properties:
        input_cost_usd:
          type: number
          format: double
          description: 'Cost of non-cached input tokens, in US dollars.'
        input_cache_read_cost_usd:
          type: number
          format: double
          description: 'Cost of cache-read input tokens, in US dollars.'
        input_cache_write_cost_usd:
          type: number
          format: double
          description: 'Cost of cache-write input tokens, in US dollars.'
        output_cost_usd:
          type: number
          format: double
          description: 'Cost of output tokens, in US dollars.'
    TokenCountBreakdown:
      type: object
      description: A per-token-type token count.
      required:
        - input
        - output
        - input_cache_read
        - input_cache_write
      properties:
        input:
          type: integer
          format: int64
          description: Count of non-cached input tokens.
        output:
          type: integer
          format: int64
          description: Count of output tokens.
        input_cache_read:
          type: integer
          format: int64
          description: Count of cache-read input tokens.
        input_cache_write:
          type: integer
          format: int64
          description: Count of cache-write input tokens.
    InferenceUsageDetail:
      type: object
      description: |
        Full token count and dollar-cost detail inference usage.
        The counts and cost describe the same usage (e.g. token_count.input
        tokens cost cost_usd.input_cost_usd in total).
      required:
        - token_count
        - cost_usd
        - web_search_count
        - web_search_cost_usd
      properties:
        token_count:
          $ref: '#/components/schemas/TokenCountBreakdown'
        cost_usd:
          $ref: '#/components/schemas/InferenceCostBreakdownUsd'
        web_search_count:
          type: integer
          format: int64
          description: Number of web searches performed by this model.
        web_search_cost_usd:
          type: number
          format: double
          description: 'Total cost of those web searches, in US dollars.'
    ChargedUsageDetail:
      type: object
      description: |
        Usage charged for a single usage category, broken down by usage type
        (direct API/BYOK/custom endpoint) and, within each, by model ID.
      required:
        - platform_usage_usd
      properties:
        direct_api_inference_usage:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InferenceUsageDetail'
          description: 'Inference usage incurred through Warp-provided model access, keyed by model ID.'
        byok_inference_usage:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InferenceUsageDetail'
          description: 'Inference usage charged using a user''s own API key, keyed by model ID.'
        custom_endpoint_inference_usage:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/InferenceUsageDetail'
          description: |
            Inference usage charged using a custom endpoint, keyed by the
            custom model's config key.
        platform_usage_usd:
          type: number
          format: double
          description: 'Platform usage charged for this category, in US dollars.'
    RunCreatorInfo:
      type: object
      properties:
        type:
          type: string
          enum:
            - user
            - service_account
          description: Type of the creator principal
        uid:
          type: string
          description: Unique identifier of the creator
        display_name:
          type: string
          description: Display name of the creator
        email:
          type: string
          description: Email address of the creator
        photo_url:
          type: string
          format: uri
          description: URL to the creator's photo
    RunState:
      type: string
      enum:
        - QUEUED
        - PENDING
        - CLAIMED
        - INPROGRESS
        - SUCCEEDED
        - FAILED
        - BLOCKED
        - ERROR
        - CANCELLED
      description: |
        Current state of the run:
        - QUEUED: Run is waiting to be picked up
        - PENDING: Run is being prepared
        - CLAIMED: Run has been claimed by a worker
        - INPROGRESS: Run is actively being executed
        - SUCCEEDED: Run completed successfully
        - FAILED: Run failed
        - BLOCKED: Run is blocked (e.g., awaiting user input or approval)
        - ERROR: Run encountered an error
        - CANCELLED: Run was cancelled by user
    RunSourceType:
      type: string
      enum:
        - LINEAR
        - API
        - SLACK
        - LOCAL
        - SCHEDULED_AGENT
        - WEB_APP
        - GITHUB_ACTION
        - CLOUD_MODE
        - CLI
        - JIRA
        - SELF_IMPROVEMENT
        - GITHUB_WEBHOOK
        - GITLAB_WEBHOOK
        - AUTOFIX
        - RUN_SCORER
        - ORCHESTRATION
        - BENCHMARK_TRIAL
        - CREATE_BENCHMARK_TASK
        - CUSTOM_WEBHOOK
      description: |
        Source that created the run:
        - LINEAR: Created from Linear integration
        - API: Created via the Warp API
        - SLACK: Created from Slack integration
        - LOCAL: Created from local CLI/app
        - SCHEDULED_AGENT: Created by a scheduled agent
        - WEB_APP: Created from the Warp web app
        - GITHUB_ACTION: Created from a GitHub action
        - CLOUD_MODE: Created from a Cloud Mode
        - CLI: Created from the CLI
        - JIRA: Created from Jira integration
        - SELF_IMPROVEMENT: Created by Warp's self-improvement pipeline
        - GITHUB_WEBHOOK: Created from a GitHub webhook event
        - GITLAB_WEBHOOK: Created from a GitLab webhook event
        - AUTOFIX: Created by Warp's autofix pipeline
        - RUN_SCORER: Created by Warp's run-scoring judge
        - ORCHESTRATION: Created as a child run by the orchestration layer (parent_run_id set)
        - BENCHMARK_TRIAL: Created as a factory benchmark trial
        - CREATE_BENCHMARK_TASK: Created by a Factory foreman authoring a benchmark task from a completed run
        - CUSTOM_WEBHOOK: Created by a factory automation subscribed to a custom webhook source
    RunExecutionLocation:
      type: string
      enum:
        - LOCAL
        - REMOTE
      description: |
        Where the run executed:
        - LOCAL: Executed in the user's local Warp environment
        - REMOTE: Executed by a remote/cloud worker
    AmbientAgentConfig:
      type: object
      description: Configuration for a cloud agent run
      properties:
        name:
          type: string
          description: |
            Human-readable label for grouping, filtering, and traceability.
            Automatically set to the skill name when running a skill-based agent.
            Set this explicitly to categorize runs by intent (e.g., "nightly-dependency-check")
            so you can filter and track them via the name query parameter on GET /agent/runs.
        model_id:
          type: string
          description: LLM model to use (uses team default if not specified)
        base_prompt:
          type: string
          description: Custom base prompt for the agent
        environment_id:
          type: string
          description: UID of the environment to run the agent in
        runner_id:
          type: string
          description: |
            UID of the runner providing the run's compute (platform, instance
            shape, and setup commands). When omitted on a request, the runner is
            resolved at run creation from the agent's default runner, then the
            environment's default runner, and the resolved UID is recorded on
            the run.
        skill_spec:
          type: string
          description: |
            Skill specification identifying the primary agent skill to use,
            in `{owner}/{repo}:{skill_path}` format (e.g.
            `warpdotdev/warp-server:.claude/skills/deploy/SKILL.md`);
            mutually exclusive with `skills` in create/update requests.
            Responses include the first `skills` entry here for backward
            compatibility; use the list agents endpoint to discover
            available skills.
        skills:
          type: array
          items:
            type: string
          description: |
            Ordered skill specifications to attach to the run.
            Format: "{owner}/{repo}:{skill_path}"
            Example: "warpdotdev/warp-server:.claude/skills/deploy/SKILL.md"
            Mutually exclusive with skill_spec in create/update requests.
        mcp_servers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MCPServerConfig'
          description: Map of MCP server configurations by name
        computer_use_enabled:
          type: boolean
          description: |
            Controls whether computer use is enabled for this agent.
            If not set, defaults to true.
        computer_use_model_id:
          type: string
          description: |
            Model the computer use subagent runs on; if omitted, the subagent
            picks its own model automatically. Only applies to the built-in
            Warp harness — the value is accepted but has no effect under a
            third-party harness or when computer use is disabled. Requires an
            agent CLI version that supports the --computer-use-model flag.
        idle_timeout_minutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 60
          description: |
            Number of minutes to keep the agent environment alive after task completion.
            If not set, defaults to 10 minutes.
            Maximum allowed value is min(60, floor(max_instance_runtime_seconds / 60) for your billing tier).
        worker_host:
          type: string
          description: |
            Self-hosted worker ID that should execute this task.
            If not specified or set to "warp", the task runs on Warp-hosted workers.
        harness:
          $ref: '#/components/schemas/Harness'
        harness_auth_secrets:
          $ref: '#/components/schemas/HarnessAuthSecrets'
        session_sharing:
          $ref: '#/components/schemas/SessionSharingConfig'
        memory_stores:
          type: array
          items:
            $ref: '#/components/schemas/MemoryStoreRef'
          description: Memory stores to attach to this run.
        inference_providers:
          allOf:
            - $ref: '#/components/schemas/InferenceProvidersConfig'
          description: |
            Optional inference provider settings for this run. Run-level
            config takes precedence over the agent's stored config and
            the workspace's admin-configured defaults.
        credential_strategy:
          type: string
          nullable: true
          enum:
            - CREATOR
            - EXECUTOR
          description: |
            Controls which principal's credentials are used when the
            platform mints tokens (e.g. GitHub or GitLab OAuth tokens) on
            behalf of this run.
            - EXECUTOR (default when unset): credentials are sourced from
              the run's execution principal — a GitHub App installation
              token for agent principals, a personal OAuth token for user
              principals.
            - CREATOR: credentials are always sourced from the run creator
              regardless of the execution principal, useful when a service
              account executes the run but Git operations should
              authenticate as the triggering human.
    SessionSharingConfig:
      type: object
      description: |
        Configures sharing behavior for the run's shared session; when set,
        the worker emits `--share public:<level>` and the bundled Warp
        client applies an anyone-with-link ACL to the shared session once it
        has bootstrapped. The same ACL is mirrored onto the backing
        conversation so link viewers can read it without being on the run's
        team, subject to the workspace-level anyone-with-link sharing
        setting.
      properties:
        public_access:
          type: string
          enum:
            - VIEWER
            - EDITOR
          description: |
            Grants anyone-with-link access at the specified level to the
            run's shared session and backing conversation; link viewers
            must still be authenticated Warp users (anonymous reads are not
            supported in this release).
            - VIEWER: link viewers can read the session and conversation.
            - EDITOR: link viewers can also interact with the session.
    Harness:
      type: object
      description: |
        Specifies which execution harness to use for the agent run.
        Default (nil/empty) uses Warp's built-in harness.
        When stored as a named agent's default (create/update agent identity),
        this field replaces the deprecated base_harness/base_model pair: a
        harness other than `oz` here requires the agent's base_model to be
        empty, since the two describe mutually exclusive default models.
      properties:
        type:
          type: string
          enum:
            - oz
            - claude
            - gemini
            - codex
          description: |
            The harness type identifier.
            - oz: Warp's built-in harness (default)
            - claude: Claude Code harness
            - gemini: Gemini CLI harness
            - codex: Codex CLI harness
        model_id:
          type: string
          description: |
            Model to use with a third-party harness (e.g. "claude-haiku-4-5").
            Only applies when type is a harness other than `oz`; the
            top-level config model_id targets the built-in Warp harness
            instead. When omitted or empty, the harness uses its own default
            model.
        reasoning_level:
          type: string
          description: |
            Reasoning effort for harnesses that support it (e.g. Codex).
            Only applies when type is a harness other than `oz`. Ignored by
            harnesses that do not support reasoning levels.
    HarnessAuthSecrets:
      type: object
      description: |
        Authentication secrets for third-party harnesses.
        Only the secret for the harness specified gets injected into the environment.
      properties:
        claude_auth_secret_name:
          type: string
          description: |
            Name of a managed secret for Claude Code harness authentication.
            The secret must exist within the caller's personal or team scope.
            Only applicable when harness type is "claude".
        codex_auth_secret_name:
          type: string
          description: |
            Name of a managed secret for Codex harness authentication.
            The secret must exist within the caller's personal or team scope.
            Only applicable when harness type is "codex".
    MCPServerConfig:
      type: object
      description: |
        Configuration for an MCP server. Must have exactly one of: warp_id, command, or url.
      properties:
        warp_id:
          type: string
          description: |
            Reference to a Warp shared MCP server by UUID, or a well-known
            integration MCP id (e.g. "linear") backed by the team's integration
            connection.
        command:
          type: string
          description: Stdio transport - command to run
        args:
          type: array
          items:
            type: string
          description: Stdio transport - command arguments
        url:
          type: string
          format: uri
          description: SSE/HTTP transport - server URL
        env:
          type: object
          additionalProperties:
            type: string
          description: Environment variables for the server
        headers:
          type: object
          additionalProperties:
            type: string
          description: HTTP headers for SSE/HTTP transport
    Error:
      type: object
      description: |
        Error response following RFC 7807 (Problem Details for HTTP APIs),
        using the `application/problem+json` content type. Includes
        backward-compatible extension members; additional ones (e.g.,
        `auth_url`, `provider`) may be present depending on the error code.
      required:
        - type
        - title
        - status
        - error
      properties:
        type:
          type: string
          format: uri
          description: |
            A URI reference that identifies the problem type (RFC 7807).
            Format: `https://docs.warp.dev/reference/api-and-sdk/troubleshooting/errors/{error_code}`
            See PlatformErrorCode for the list of possible error codes.
        title:
          type: string
          description: 'A short, human-readable summary of the problem type (RFC 7807)'
        status:
          type: integer
          description: The HTTP status code for this occurrence of the problem (RFC 7807)
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem (RFC 7807)
        instance:
          type: string
          description: The request path that generated this error (RFC 7807)
        error:
          type: string
          description: |
            Human-readable error message combining title and detail.
            Backward-compatible extension member for older clients.
        retryable:
          type: boolean
          description: |
            Whether the request can be retried. When true, the error is transient
            and the request may be retried. When false, retrying without addressing
            the underlying cause will not succeed.
        trace_id:
          type: string
          description: OpenTelemetry trace ID for debugging and support requests
        provider:
          type: string
          description: 'External provider that requires authorization, such as `linear`.'
        auth_url:
          type: string
          format: uri
          description: URL where the caller can reconnect the external provider.
    ArtifactResponse:
      oneOf:
        - $ref: '#/components/schemas/PlanArtifactResponse'
        - $ref: '#/components/schemas/ScreenshotArtifactResponse'
        - $ref: '#/components/schemas/FileArtifactResponse'
      discriminator:
        propertyName: artifact_type
        mapping:
          PLAN: '#/components/schemas/PlanArtifactResponse'
          SCREENSHOT: '#/components/schemas/ScreenshotArtifactResponse'
          FILE: '#/components/schemas/FileArtifactResponse'
    PlanArtifactResponse:
      type: object
      description: Response for retrieving a plan artifact.
      required:
        - artifact_uid
        - artifact_type
        - created_at
        - data
      properties:
        artifact_uid:
          type: string
          description: Unique identifier (UUID) for the artifact
        artifact_type:
          type: string
          enum:
            - PLAN
          description: Type of the artifact
        created_at:
          type: string
          format: date-time
          description: Timestamp when the artifact was created (RFC3339)
        data:
          $ref: '#/components/schemas/PlanArtifactResponseData'
    PlanArtifactResponseData:
      type: object
      description: 'Response data for a plan artifact, including current markdown content.'
      required:
        - document_uid
        - notebook_uid
        - content
        - content_type
      properties:
        document_uid:
          type: string
          description: Unique identifier for the plan document
        notebook_uid:
          type: string
          description: Unique identifier for the associated notebook
        url:
          type: string
          format: uri
          description: URL to open the plan in Warp Drive
        title:
          type: string
          description: Current title of the plan
        content:
          type: string
          description: Current markdown content of the plan
        content_type:
          type: string
          description: MIME type of the returned plan content
    ScreenshotArtifactResponse:
      type: object
      description: Response for retrieving a screenshot artifact.
      required:
        - artifact_uid
        - artifact_type
        - created_at
        - data
      properties:
        artifact_uid:
          type: string
          description: Unique identifier (UUID) for the artifact
        artifact_type:
          type: string
          enum:
            - SCREENSHOT
          description: Type of the artifact
        created_at:
          type: string
          format: date-time
          description: Timestamp when the artifact was created (RFC3339)
        data:
          $ref: '#/components/schemas/ScreenshotArtifactResponseData'
    ScreenshotArtifactResponseData:
      type: object
      description: 'Response data for a screenshot artifact, including a signed download URL.'
      required:
        - download_url
        - expires_at
        - content_type
      properties:
        download_url:
          type: string
          format: uri
          description: Time-limited signed URL to download the screenshot
        expires_at:
          type: string
          format: date-time
          description: Timestamp when the download URL expires (RFC3339)
        content_type:
          type: string
          description: 'MIME type of the screenshot (e.g., image/png)'
        description:
          type: string
          description: Optional description of the screenshot
    FileArtifactResponse:
      type: object
      description: Response for retrieving a file artifact.
      required:
        - artifact_uid
        - artifact_type
        - created_at
        - data
      properties:
        artifact_uid:
          type: string
          description: Unique identifier (UUID) for the artifact
        artifact_type:
          type: string
          enum:
            - FILE
          description: Type of the artifact
        created_at:
          type: string
          format: date-time
          description: Timestamp when the artifact was created (RFC3339)
        data:
          $ref: '#/components/schemas/FileArtifactResponseData'
    FileArtifactResponseData:
      type: object
      description: 'Response data for a file artifact, including a signed download URL.'
      required:
        - download_url
        - expires_at
        - content_type
        - filename
      properties:
        download_url:
          type: string
          format: uri
          description: Time-limited signed URL to download the file
        expires_at:
          type: string
          format: date-time
          description: Timestamp when the download URL expires (RFC3339)
        content_type:
          type: string
          description: MIME type of the uploaded file
        filepath:
          type: string
          description: |
            Conversation-relative filepath for the uploaded file. Omitted for
            anonymous reads of public artifacts.
        filename:
          type: string
          description: Last path component of filepath
        title:
          type: string
          description: |
            Short, badge-visible label for the artifact. For recording artifacts,
            this is the agent-authored title shown in Warp web and blocklist badges.
            Distinct from description, which is longer and shown in detail views.
        description:
          type: string
          description: Optional description of the file
        size_bytes:
          type: integer
          format: int64
          description: Size of the uploaded file in bytes
    AttachmentInput:
      type: object
      description: A base64-encoded file attachment to include with the prompt
      required:
        - file_name
        - mime_type
        - data
      properties:
        file_name:
          type: string
          description: Name of the attached file
        mime_type:
          type: string
          description: |
            MIME type of the attachment.
            Supported image types: image/jpeg, image/png, image/gif, image/webp
        data:
          type: string
          format: byte
          description: Base64-encoded attachment data
    ScheduledAgentItem:
      type: object
      required:
        - id
        - name
        - cron_schedule
        - enabled
        - prompt
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier for the scheduled agent
        name:
          type: string
          description: Human-readable name for the schedule
        cron_schedule:
          type: string
          description: 'Cron expression defining when the agent runs (e.g., "0 9 * * *" for daily at 9am UTC)'
        enabled:
          type: boolean
          description: Whether the schedule is currently active
        prompt:
          type: string
          description: The prompt/instruction for the agent to execute
        last_spawn_error:
          type: string
          nullable: true
          description: 'Error message from the last failed spawn attempt, if any'
        agent_config:
          $ref: '#/components/schemas/AmbientAgentConfig'
        agent_uid:
          type: string
          format: uuid
          description: UID of the agent that this schedule runs as
        metadata:
          allOf:
            - $ref: '#/components/schemas/RunMetadata'
          description: Custom metadata stamped onto every run spawned by this schedule
        environment:
          allOf:
            - $ref: '#/components/schemas/CloudEnvironmentConfig'
          description: Resolved environment configuration (if agent_config references an environment_id)
        created_at:
          type: string
          format: date-time
          description: Timestamp when the schedule was created (RFC3339)
        updated_at:
          type: string
          format: date-time
          description: Timestamp when the schedule was last updated (RFC3339)
        created_by:
          $ref: '#/components/schemas/RunCreatorInfo'
        updated_by:
          $ref: '#/components/schemas/RunCreatorInfo'
        history:
          $ref: '#/components/schemas/ScheduledAgentHistoryItem'
        scope:
          $ref: '#/components/schemas/Scope'
    ScheduledAgentHistoryItem:
      type: object
      description: Scheduler-derived history metadata for a scheduled agent
      properties:
        last_ran:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last successful run (RFC3339)
        next_run:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the next scheduled run (RFC3339)
    CreateScheduledAgentRequest:
      type: object
      description: |
        Request body for creating a new scheduled agent.
        Either prompt or agent_config.skill_spec or agent_config.skills is required.
      required:
        - name
        - cron_schedule
      properties:
        name:
          type: string
          description: Human-readable name for the schedule
        cron_schedule:
          type: string
          description: 'Cron expression defining when the agent runs (e.g., "0 9 * * *" for daily at 9am UTC)'
        prompt:
          type: string
          description: |
            The prompt/instruction for the agent to execute.
            Required unless agent_config.skill_spec or agent_config.skills is provided.
        mode:
          $ref: '#/components/schemas/AgentRunMode'
          description: |
            Optional query mode applied to every triggered run. Defaults to
            `normal` when omitted. The server does not infer mode from prompt
            prefixes such as `/plan`.
        enabled:
          type: boolean
          description: Whether the schedule should be active immediately
          default: true
        agent_uid:
          type: string
          format: uuid
          description: |
            Agent UID to use as the execution principal for this schedule.
            Only valid for team-owned schedules.
        agent_config:
          $ref: '#/components/schemas/AmbientAgentConfig'
        team:
          type: boolean
          description: |
            Whether to create a team-owned schedule.
            Defaults to true for users on a single team.
        metadata:
          allOf:
            - $ref: '#/components/schemas/RunMetadata'
          description: |
            Custom metadata stamped onto every run spawned by this schedule as the run's
            explicit metadata layer.
    UpdateScheduledAgentRequest:
      type: object
      description: |
        Request body for updating a scheduled agent.
        Either prompt or agent_config.skill_spec or agent_config.skills is required.
      required:
        - name
        - cron_schedule
        - enabled
      properties:
        name:
          type: string
          description: Human-readable name for the schedule
        cron_schedule:
          type: string
          description: Cron expression defining when the agent runs
        prompt:
          type: string
          description: |
            The prompt/instruction for the agent to execute.
            Required unless agent_config.skill_spec or agent_config.skills is provided.
        mode:
          $ref: '#/components/schemas/AgentRunMode'
          description: |
            Optional query mode applied to every triggered run. Defaults to
            `normal` when omitted. The server does not infer mode from prompt
            prefixes such as `/plan`.
        enabled:
          type: boolean
          description: Whether the schedule should be active
        agent_uid:
          type: string
          format: uuid
          description: |
            Agent UID to use as the execution principal for this schedule.
            Only valid for team-owned schedules.
        agent_config:
          $ref: '#/components/schemas/AmbientAgentConfig'
        metadata:
          allOf:
            - $ref: '#/components/schemas/RunMetadata'
          description: |
            Custom metadata stamped onto every run spawned by this schedule.
            Updates follow full-replacement PUT semantics: omitting this field
            clears the schedule's metadata. Changes apply only to future runs.
    ListScheduledAgentsResponse:
      type: object
      required:
        - schedules
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledAgentItem'
          description: List of scheduled agents
    DeleteScheduledAgentResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: Whether the deletion was successful
    CloudEnvironmentConfig:
      type: object
      description: Configuration for a cloud environment used by scheduled agents
      properties:
        name:
          type: string
          description: Human-readable name for the environment
        description:
          type: string
          nullable: true
          description: Optional description of the environment
        docker_image:
          type: string
          description: 'Docker image to use (e.g., "ubuntu:latest" or "registry/repo:tag")'
        github_repos:
          type: array
          items:
            $ref: '#/components/schemas/GitHubRepo'
          description: List of GitHub repositories to clone into the environment
        setup_commands:
          type: array
          items:
            type: string
          description: Shell commands to run during environment setup
        providers:
          $ref: '#/components/schemas/ProvidersConfig'
        failure_session_retention_minutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 60
          description: |
            When set (1–60 minutes), a failed run using this environment
            keeps its session open for this many minutes so it can be
            inspected; null or absent means immediate teardown (disabled by
            default). This is an idle window held open by the agent process:
            activity in the session pushes the deadline out (so an active
            session is not torn down mid-debug), and it ends early if the
            run's sandbox reaches its own deadline first. Applies only to
            future failures of runs using this environment; opting in keeps
            injected environment data (including secrets) alive and incurs
            compute usage for as long as the session is held open.
    ProvidersConfig:
      type: object
      description: Optional cloud provider configurations for automatic auth
      properties:
        gcp:
          $ref: '#/components/schemas/GcpProviderConfig'
        aws:
          $ref: '#/components/schemas/AwsProviderConfig'
    InferenceProvidersConfig:
      type: object
      description: Inference provider settings used for LLM calls.
      properties:
        aws:
          $ref: '#/components/schemas/AwsInferenceProviderConfig'
    GcpProviderConfig:
      type: object
      description: GCP Workload Identity Federation settings
      required:
        - project_number
        - workload_identity_federation_pool_id
        - workload_identity_federation_provider_id
      externalDocs:
        description: Google documentation on Workload Identity Federation
        url: 'https://docs.cloud.google.com/iam/docs/workload-identity-federation'
      properties:
        project_number:
          type: string
          description: GCP project number
        workload_identity_federation_pool_id:
          type: string
          description: Workload Identity Federation pool ID
        workload_identity_federation_provider_id:
          type: string
          description: Workload Identity Federation provider ID
        service_account_email:
          type: string
          description: Optional GCP service account email to impersonate
    AwsProviderConfig:
      type: object
      description: AWS IAM role assumption settings
      externalDocs:
        description: AWS documentation on IAM OIDC federation
        url: 'https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_oidc.html'
      required:
        - role_arn
      properties:
        role_arn:
          type: string
          description: AWS IAM role ARN to assume
    AwsInferenceProviderConfig:
      type: object
      description: |
        Configures AWS Bedrock as the LLM inference provider for this
        agent or run.
      externalDocs:
        description: AWS documentation on IAM OIDC federation
        url: 'https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_oidc.html'
      properties:
        disabled:
          type: boolean
          description: 'If true, opt out of Bedrock at this layer.'
        role_arn:
          type: string
          description: IAM role ARN to assume when calling Bedrock.
        region:
          type: string
          description: AWS region used for STS when assuming the Bedrock inference role.
    GitHubRepo:
      type: object
      required:
        - owner
        - repo
      properties:
        owner:
          type: string
          description: GitHub repository owner (user or organization)
        repo:
          type: string
          description: GitHub repository name
    ListAgentsResponse:
      type: object
      required:
        - agents
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentListItem'
          description: List of available agents
    ListConnectedSelfHostedWorkersResponse:
      type: object
      required:
        - workers
      properties:
        workers:
          type: array
          items:
            $ref: '#/components/schemas/ConnectedSelfHostedWorker'
          description: Connected self-hosted workers for the authenticated principal's team
    ConnectedSelfHostedWorker:
      type: object
      required:
        - worker_host
        - connection_count
        - connected_at
        - last_seen_at
      properties:
        worker_host:
          type: string
          description: Logical host identifier provided by the self-hosted worker
        connection_count:
          type: integer
          description: Number of active websocket connections currently observed for this worker host
        connected_at:
          type: string
          format: date-time
          description: Earliest connection timestamp across active connections for this worker host
        last_seen_at:
          type: string
          format: date-time
          description: Most recent heartbeat timestamp across active connections for this worker host
    AgentListItem:
      type: object
      required:
        - name
        - variants
      properties:
        name:
          type: string
          description: Human-readable name of the agent
        variants:
          type: array
          items:
            $ref: '#/components/schemas/AgentListVariant'
          description: Available variants of this agent
    AgentListVariant:
      type: object
      required:
        - id
        - description
        - base_prompt
        - source
        - environments
      properties:
        id:
          type: string
          description: |
            Stable identifier for this skill variant.
            Format: "{owner}/{repo}:{skill_path}"
            Example: "warpdotdev/warp-server:.claude/skills/deploy/SKILL.md"
        description:
          type: string
          description: Description of the agent variant
        base_prompt:
          type: string
          description: Base prompt/instructions for the agent
        source:
          $ref: '#/components/schemas/AgentListSource'
        environments:
          type: array
          items:
            $ref: '#/components/schemas/AgentListEnvironment'
          description: Environments where this agent variant is available
        last_run_timestamp:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the last time this skill was run (RFC3339)
        error:
          type: string
          description: |
            Non-empty when the skill's SKILL.md file exists but is malformed.
            Contains a description of the parse failure. Only present when
            include_malformed_skills=true is passed to the list agents endpoint.
    AgentListSource:
      type: object
      required:
        - owner
        - name
        - skill_path
      properties:
        owner:
          type: string
          description: GitHub repository owner
        name:
          type: string
          description: GitHub repository name
        skill_path:
          type: string
          description: Path to the skill definition file within the repository
        worker_host:
          type: string
          description: |
            Self-hosted worker host that reported this skill.
            Present only for skills discovered from self-hosted workers
            (as opposed to skills from GitHub repos linked to environments).
    AgentListEnvironment:
      type: object
      required:
        - uid
        - name
      properties:
        uid:
          type: string
          description: Unique identifier for the environment
        name:
          type: string
          description: Human-readable name of the environment
    Scope:
      type: object
      description: Ownership scope for a resource (team or personal)
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - User
            - Team
          description: 'Type of ownership ("User" for personal, "Team" for team-owned)'
        uid:
          type: string
          description: UID of the owning user or team
    PlatformErrorCode:
      type: string
      description: |
        Machine-readable error code identifying the problem type.
        Used in the `type` URI of Error responses and in the `error_code`
        field of RunStatusMessage.

        User errors (run transitions to FAILED):
        - `insufficient_credits` — Team has no remaining add-on credits
        - `feature_not_available` — Required feature not enabled for user's plan
        - `external_authentication_required` — User hasn't authorized a required external service
        - `not_authorized` — Principal lacks permission for the requested operation
        - `invalid_request` — Request is malformed or contains invalid parameters
        - `resource_not_found` — Referenced resource does not exist
        - `budget_exceeded` — Spending budget limit has been reached
        - `integration_disabled` — Integration is disabled and must be enabled
        - `integration_not_configured` — Integration setup is incomplete
        - `operation_not_supported` — Requested operation not supported for this resource/state
        - `environment_setup_failed` — Client-side environment setup failed
        - `content_policy_violation` — Prompt or setup commands violated content policy
        - `conflict` — Request conflicts with the current state of the resource

        Warp errors (run transitions to ERROR):
        - `authentication_required` — Request lacks valid authentication credentials
        - `resource_unavailable` — Transient infrastructure issue (retryable)
        - `internal_error` — Unexpected server-side error (retryable)
      enum:
        - insufficient_credits
        - feature_not_available
        - external_authentication_required
        - not_authorized
        - invalid_request
        - resource_not_found
        - budget_exceeded
        - integration_disabled
        - integration_not_configured
        - operation_not_supported
        - environment_setup_failed
        - content_policy_violation
        - conflict
        - authentication_required
        - resource_unavailable
        - internal_error
    RunFollowupRequest:
      type: object
      description: Request body for submitting a follow-up message to an existing run.
      properties:
        message:
          type: string
          description: The follow-up message to send to the run.
        mode:
          $ref: '#/components/schemas/AgentRunMode'
          description: |
            Optional query mode for the follow-up. Defaults to `normal` when
            omitted. The server does not infer mode from prompt prefixes such
            as `/plan`.
    ListModelsResponse:
      type: object
      required:
        - default_model_id
        - models
      properties:
        default_model_id:
          type: string
          description: The ID of the default model for agent runs
        models:
          type: array
          items:
            $ref: '#/components/schemas/ModelInfo'
          description: List of available models
    ModelInfo:
      type: object
      required:
        - id
        - display_name
        - provider
        - vision_supported
      properties:
        id:
          type: string
          description: Unique identifier for the model (e.g. "claude-4-6-opus-high" or "gpt-5-4-high")
        display_name:
          type: string
          description: Human-readable name of the model
        provider:
          type: string
          enum:
            - OPENAI
            - ANTHROPIC
            - GOOGLE
            - UNKNOWN
          description: The LLM provider
        vision_supported:
          type: boolean
          description: Whether the model supports vision/image inputs
        description:
          type: string
          description: Optional extra descriptor for the model
        reasoning_level:
          type: string
          description: 'Reasoning level descriptor, if any (e.g. "low", "medium", "high")'
        disable_reason:
          type: string
          enum:
            - PROVIDER_OUTAGE
            - OUT_OF_REQUESTS
            - ADMIN_DISABLED
            - REQUIRES_UPGRADE
          description: 'If set, the model is currently unavailable for the given reason'
    ExternalReferenceArtifactData:
      type: object
      description: Data for a generic external reference artifact.
      required:
        - reference_type
        - url
      properties:
        reference_type:
          type: string
          maxLength: 256
          description: |
            Free-form category identifier for this reference (e.g. "linear_issue",
            "spec_link", "jira_ticket"). Used for filtering and display.
        url:
          type: string
          maxLength: 2048
          description: |
            Canonical URL for the reference. Used as the key for reverse lookups
            ("which run produced this URL?").
        title:
          type: string
          description: Optional human-readable label for the reference.
        metadata:
          type: object
          additionalProperties: true
          description: Optional category-specific extra fields.
    RunByExternalReferenceResponse:
      type: object
      description: Response for a run reverse-lookup by external reference URL.
      required:
        - run_id
      properties:
        run_id:
          type: string
          description: The ID of the run that produced the external reference.
    AgentSkill:
      type: object
      description: |
        Information about the agent skill used for the run.
        Either full_path or bundled_skill_id will be set, but not both.
      properties:
        name:
          type: string
          description: Human-readable name of the skill
        description:
          type: string
          description: Description of the skill
        full_path:
          type: string
          description: Path to the SKILL.md file (for file-based skills)
        bundled_skill_id:
          type: string
          description: Unique identifier for bundled skills
    ListEnvironmentsResponse:
      type: object
      required:
        - environments
      properties:
        environments:
          type: array
          items:
            $ref: '#/components/schemas/CloudEnvironment'
          description: List of accessible cloud environments
    CloudEnvironment:
      type: object
      description: A cloud environment for running agents
      required:
        - uid
        - config
        - last_updated
        - setup_failed
      properties:
        uid:
          type: string
          description: Unique identifier for the environment
        config:
          $ref: '#/components/schemas/CloudEnvironmentConfig'
        last_updated:
          type: string
          format: date-time
          description: Timestamp when the environment was last updated (RFC3339)
        last_task_run_timestamp:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the most recent task run in this environment (RFC3339)
        last_task_created:
          $ref: '#/components/schemas/EnvironmentLastTask'
        setup_failed:
          type: boolean
          description: True when the most recent task failed during setup before it started running
        scope:
          $ref: '#/components/schemas/Scope'
        creator:
          $ref: '#/components/schemas/RunCreatorInfo'
        last_editor:
          $ref: '#/components/schemas/RunCreatorInfo'
    SecretRef:
      type: object
      description: |
        Reference to a managed secret by name.
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the managed secret.
    MemoryStoreRef:
      type: object
      description: Reference to a memory store to attach to an agent.
      required:
        - uid
        - access
        - instructions
      properties:
        uid:
          type: string
          description: UID of the memory store.
        access:
          type: string
          enum:
            - read_write
            - read_only
          description: Access level for the store.
        instructions:
          type: string
          description: Instructions for how the agent should use this memory store. Must not be empty.
    MemoryStoreAttachmentResponse:
      type: object
      description: Memory store attached to an agent.
      required:
        - uid
        - access
        - instructions
        - owner_type
        - owner_uid
      properties:
        uid:
          type: string
          description: UID of the memory store.
        access:
          type: string
          enum:
            - read_write
            - read_only
          description: Access level for the store.
        instructions:
          type: string
          description: Instructions for how the agent should use this memory store.
        owner_type:
          type: string
          description: Public owner type.
          enum:
            - user
            - service_account
            - team
        owner_uid:
          type: string
          description: 'Public UID of the user, service account, or team that owns the memory store.'
        description:
          type: string
          description: Optional description for the memory store.
    AgentAutoMemoryCreateConfig:
      type: object
      description: Auto-memory settings for creating an agent.
      properties:
        enabled:
          type: boolean
          description: |
            Whether to create and attach a default service-account-owned memory store for this agent.
            Defaults to true when omitted.
    AgentMemoryCreateConfig:
      type: object
      description: Memory settings for creating an agent.
      properties:
        auto_memory:
          allOf:
            - $ref: '#/components/schemas/AgentAutoMemoryCreateConfig'
          description: Agent-owned memory settings. Defaults to enabled when omitted.
        attached_stores:
          type: array
          items:
            $ref: '#/components/schemas/MemoryStoreRef'
          description: |
            Existing team memory stores to attach to the agent.
            Duplicate UIDs within a single request are rejected.
    AgentMemoryUpdateConfig:
      type: object
      description: Memory settings for updating an agent.
      properties:
        attached_stores:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/MemoryStoreRef'
          description: |
            Replacement list of attached team memory stores. Omit to leave unchanged,
            pass an empty array to clear, or pass a non-empty array to replace.
    AgentAutoMemoryResponse:
      type: object
      description: Auto-memory state for an agent.
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: Whether this agent has an agent-owned memory store.
        store:
          $ref: '#/components/schemas/MemoryStoreAttachmentResponse'
    AgentMemoryResponse:
      type: object
      description: Memory settings for an agent.
      required:
        - auto_memory
        - attached_stores
      properties:
        auto_memory:
          $ref: '#/components/schemas/AgentAutoMemoryResponse'
        attached_stores:
          type: array
          items:
            $ref: '#/components/schemas/MemoryStoreRef'
          description: Team memory stores attached to the agent.
    AgentCredentialStrategy:
      type: string
      description: |
        Default credential strategy for runs executed by a named agent; an
        agent may leave this unset (see AgentResponse.credential_strategy
        for the full resolution order).
        - EXECUTOR: runs authenticate with the named agent's own credentials
          (e.g. a GitHub App installation token for the agent's team).
        - CREATOR: runs authenticate with the credentials of the principal
          that created the run.
      enum:
        - CREATOR
        - EXECUTOR
    ScorerClassification:
      type: object
      required:
        - value
        - score
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 1048576
          description: Classification value returned by the scorer
        description:
          type: string
          nullable: true
          maxLength: 1048576
          description: |
            Optional free-text meaning of this classification, surfaced to the
            judge alongside the value. Omit or leave blank for a score-only
            label.
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: |
            Score this classification carries, from 0 to 1. A run passes when
            its scored label's score is greater than or equal to the scorer's
            threshold. A score of exactly 0 is valid, so this is not enforced
            with a "required" binding (which would reject the zero value);
            handlers validate its range explicitly instead.
    CreateScorerRequest:
      type: object
      description: |
        Scorer definition. Text fields are trimmed of surrounding whitespace
        before validation; required text fields must not be blank after trimming,
        and no text field may exceed 1 MiB (1048576 bytes).
      required:
        - factory_uid
        - name
        - scoring_prompt
        - allowed_classifications
        - threshold
        - scope_mode
        - model_id
      properties:
        factory_uid:
          type: string
          minLength: 1
          description: UID of the factory that owns the scorer
        name:
          type: string
          minLength: 1
          maxLength: 1048576
          description: Display name for the scorer
        description:
          type: string
          nullable: true
          maxLength: 1048576
          description: Optional description of the scorer
        scoring_prompt:
          type: string
          minLength: 1
          maxLength: 1048576
          description: Instructions used to score matching runs
        allowed_classifications:
          type: array
          minItems: 1
          maxItems: 20
          description: Values the scorer may return; classification values must be unique
          items:
            $ref: '#/components/schemas/ScorerClassification'
        threshold:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: |
            Score a run's classified label must meet or exceed to pass, from 0
            to 1.
        scope_mode:
          type: string
          enum:
            - all_agents
            - selected_agents
          description: Whether the scorer applies to every factory agent or only agent_uids
        agent_uids:
          type: array
          description: Required and non-empty for selected_agents; must be empty for all_agents
          items:
            type: string
        sampling_rate:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 100
          description: |
            Percentage of the scorer's eligible runs to score, from 0 to
            100; omit to score every eligible run, and 0 stops automatic
            scoring (manual dispatch still works). A value with more than
            two decimal places is rounded to two rather than rejected, and
            the rounded value is what is stored. Sampling applies to
            periodic scoring only, and runs are chosen deterministically per
            (scorer, run), so lowering the rate reduces how many runs are
            scored rather than how often.
        model_id:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            LLM model dispatched judge runs use to evaluate this scorer's
            rubric.
        self_improvement_enabled:
          type: boolean
          description: |
            Optionally enable self-improvement for the newly created scorer
            in the same transactional request, instead of a separate call to
            PUT /factory/scorers/{scorer_id}/self-improvement-config
            afterward; defaults to false. The response does not echo this
            back — a successful (2xx) response means the requested state was
            applied, confirmable at any time with GET .../self-improvement-config.
            Setting this to true requires a human user principal, matching
            the restriction on the PUT endpoint; a service-account principal
            gets the same error as calling that endpoint directly.
    UpdateScorerRequest:
      type: object
      description: |
        Partial scorer definition update. Every field is optional, but at least
        one must be present. Text fields are trimmed of surrounding whitespace
        before validation; a provided required text field must not be blank after
        trimming, and no text field may exceed 1 MiB (1048576 bytes).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1048576
          description: New display name for the scorer
        description:
          type: string
          maxLength: 1048576
          description: New description; an empty string clears it
        scoring_prompt:
          type: string
          minLength: 1
          maxLength: 1048576
          description: New instructions used to score matching runs
        allowed_classifications:
          type: array
          minItems: 1
          maxItems: 20
          description: |
            Replacement set of values the scorer may return; classification
            values must be unique. Removing a classification the scorer's
            self-improvement config still targets is rejected.
          items:
            $ref: '#/components/schemas/ScorerClassification'
        threshold:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: |
            New score a run's classified label must meet or exceed to pass,
            from 0 to 1.
        sampling_rate:
          type: number
          format: double
          minimum: 0
          maximum: 100
          description: |
            New percentage of eligible runs this scorer should score, rounded
            to two decimal places. 0 stops automatic scoring; manual dispatch
            still works.
        scope_mode:
          type: string
          enum:
            - all_agents
            - selected_agents
          description: |
            New scope mode. Defaults to the scorer's current mode when only
            agent_uids is supplied.
        agent_uids:
          type: array
          description: |
            Complete replacement membership for the scorer's scope. Required and
            non-empty when the resulting scope_mode is selected_agents; must be
            empty for all_agents.
          items:
            type: string
        model_id:
          type: string
          minLength: 1
          maxLength: 255
          description: |
            New LLM model dispatched judge runs use to evaluate this scorer's
            rubric. Must not be blank when provided.
    ScorerKind:
      type: string
      description: |
        Whether the scorer is user-defined or a platform-owned managed scorer.
        Read-only on responses; create input does not accept scorer_kind.
      enum:
        - user
        - benchmark_task_correctness
    ScorerResponse:
      type: object
      required:
        - id
        - factory_uid
        - name
        - description
        - scoring_prompt
        - allowed_classifications
        - threshold
        - scorer_kind
        - version
        - scope_mode
        - agent_uids
        - sampling_rate
        - model_id
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          description: Scorer identifier
        factory_uid:
          type: string
          description: UID of the factory that owns the scorer
        name:
          type: string
          description: Display name for the scorer
        description:
          type: string
          description: Description of the scorer
        scoring_prompt:
          type: string
          description: Instructions used to score matching runs
        allowed_classifications:
          type: array
          items:
            $ref: '#/components/schemas/ScorerClassification'
        threshold:
          type: number
          format: double
          description: 'Score a run''s classified label must meet or exceed to pass, from 0 to 1'
        scorer_kind:
          $ref: '#/components/schemas/ScorerKind'
        version:
          type: integer
          description: Scorer definition version
        scope_mode:
          type: string
          enum:
            - all_agents
            - selected_agents
          description: Whether the scorer applies to every factory agent or selected agent_uids
        agent_uids:
          type: array
          description: Agents attached to a selected_agents scorer; empty for all_agents
          items:
            type: string
        sampling_rate:
          type: number
          format: double
          description: |
            Percentage of the scorer's eligible runs that periodic scoring scores,
            to two decimal places. 0 stops automatic scoring.
        model_id:
          type: string
          description: |
            LLM model dispatched judge runs use to evaluate this scorer's
            rubric.
        created_at:
          type: string
          format: date-time
          description: When the scorer was created
        updated_at:
          type: string
          format: date-time
          description: When the scorer was updated
    ScorerScopeAgent:
      type: object
      required:
        - uid
        - name
      properties:
        uid:
          type: string
          description: Unique identifier of the agent
        name:
          type: string
          description: Display name of the agent
    ScorerListItem:
      type: object
      required:
        - id
        - factory_uid
        - name
        - description
        - scoring_prompt
        - allowed_classifications
        - threshold
        - scope_mode
        - agents
        - scorer_kind
        - version
        - sampling_rate
        - created_at
        - updated_at
        - result_count
        - model_id
        - pass_rate_summary
        - self_improvement_enabled
      properties:
        id:
          type: integer
          description: Scorer identifier
        factory_uid:
          type: string
          description: Public UID of the factory that owns the scorer
        name:
          type: string
          description: Display name for the scorer
        description:
          type: string
          description: Description of the scorer
        scoring_prompt:
          type: string
          description: Instructions used to score the agent's runs
        allowed_classifications:
          type: array
          items:
            $ref: '#/components/schemas/ScorerClassification'
        threshold:
          type: number
          format: double
          description: 'Score a run''s classified label must meet or exceed to pass, from 0 to 1'
        scope_mode:
          type: string
          description: all_agents (every agent in the scorer's factory) or selected_agents
        agents:
          type: array
          items:
            $ref: '#/components/schemas/ScorerScopeAgent'
          description: Named agents in scope; empty when the scorer covers all factory agents
        scorer_kind:
          $ref: '#/components/schemas/ScorerKind'
        version:
          type: integer
          description: Scorer definition version
        sampling_rate:
          type: number
          format: double
          description: |
            Percentage of the scorer's eligible runs that periodic scoring scores,
            to two decimal places. 0 stops automatic scoring.
        created_at:
          type: string
          format: date-time
          description: When the scorer was created
        updated_at:
          type: string
          format: date-time
          description: When the scorer was last updated
        result_count:
          type: integer
          description: Number of live scores recorded for the scorer
        last_scored_at:
          type: string
          format: date-time
          nullable: true
          description: When the scorer last recorded a score
        model_id:
          type: string
          description: |
            LLM model dispatched judge runs use to evaluate this scorer's
            rubric.
        pass_rate_summary:
          $ref: '#/components/schemas/ScorerPassRateSummary'
        self_improvement_enabled:
          type: boolean
          description: Whether self-improvement is enabled for this scorer
    ListScorersResponse:
      type: object
      required:
        - scorers
      properties:
        scorers:
          type: array
          items:
            $ref: '#/components/schemas/ScorerListItem'
    ScorerOutcome:
      type: string
      enum:
        - pass
        - fail
      description: |
        Pass/fail verdict of a recorded score, derived at read time against
        the evaluation's current threshold rather than frozen at scoring
        time — editing the threshold retroactively changes the outcome of
        already-scored runs. Today this is "pass" or "fail"; clients should
        tolerate additional values so future non-scoreable verdicts (for
        example, excluded from scoring) do not break them. Do not use
        result_count as a pass-rate denominator: only pass and fail count.
    ScorerPassRateSummary:
      type: object
      required:
        - pass_count
        - fail_count
        - recent_outcomes
      properties:
        pass_count:
          type: integer
          description: |
            Number of live scores whose derived outcome is pass, within the
            same recent_outcomes_limit window as recent_outcomes (not the
            scorer's all-time history).
        fail_count:
          type: integer
          description: |
            Number of live scores whose derived outcome is fail, within the
            same recent_outcomes_limit window as recent_outcomes (not the
            scorer's all-time history).
        pass_rate:
          type: number
          format: double
          nullable: true
          description: |
            pass_count / (pass_count + fail_count), over the same recent
            window as pass_count and fail_count. Null when there are no
            scoreable (pass or fail) scores in that window. Clients must not
            use result_count as the denominator.
        recent_outcomes:
          type: array
          items:
            $ref: '#/components/schemas/ScorerOutcome'
          description: |
            The scorer's most recent live scores' outcomes, oldest first,
            for a compact history strip; length is bounded by
            recent_outcomes_limit, and failed attempts (no live score) are
            not included. pass_count and fail_count are computed over this
            exact same windowed set, so the headline rate and the strip
            always describe the same scores.
    ScorerResultStatus:
      type: string
      description: |
        Outcome of a scoring attempt: "scored", "failed", or "in_flight" (no
        live score yet and a judge is currently running). A failed or
        in_flight attempt has no classification. A scored attempt whose
        is_in_flight is also true has a live classification while a
        replacement judge runs.
    ScorerResult:
      type: object
      required:
        - run_id
        - status
        - attempted_at
        - is_in_flight
      properties:
        run_id:
          type: string
          description: The scored agent run
        conversation_id:
          type: string
          nullable: true
          description: Conversation whose transcript was judged
        conversation_title:
          type: string
          nullable: true
          description: Title of the judged conversation
        status:
          $ref: '#/components/schemas/ScorerResultStatus'
        classification:
          type: string
          nullable: true
          description: The chosen classification; absent when the attempt failed
        attempted_at:
          type: string
          format: date-time
          description: When the scorer last attempted this run
        scored_at:
          type: string
          format: date-time
          nullable: true
          description: When the live score was recorded; absent for failed attempts
        scoring_run_id:
          type: string
          nullable: true
          description: The Warp run that performed the judging; absent when scoring was never dispatched for this attempt
        scoring_run_usage:
          allOf:
            - $ref: '#/components/schemas/RequestUsage'
          description: |
            Cost of the scoring run (the Warp judge run), independent of the
            scored run's own cost. Absent when there is no scoring run yet, or
            its usage is not yet available (e.g. the judge is still in flight).
        scoring_run_time:
          type: string
          nullable: true
          description: |
            Total runtime of the scoring run as an ISO 8601 duration. Absent
            when there is no scoring run or its execution duration is not yet
            available.
        score:
          type: number
          format: double
          nullable: true
          description: |
            Numeric score of the classified label, resolved from the attempt's
            config snapshot at scoring time. Absent when the attempt failed.
        outcome:
          allOf:
            - $ref: '#/components/schemas/ScorerOutcome'
          nullable: true
          description: |
            Pass/fail verdict for this score, derived at read time against the
            evaluation's current threshold. Absent when the attempt failed.
        is_in_flight:
          type: boolean
          description: |
            True when a non-terminal judge run currently holds this pair.
            Independent of status/classification: a previous live
            classification stays visible while a replacement judge runs.
    ListScorerResultsResponse:
      type: object
      required:
        - results
        - page_info
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ScorerResult'
        page_info:
          $ref: '#/components/schemas/PageInfo'
    ScorerPassRateSeriesResponse:
      type: object
      description: |
        A scorer's pass-rate series over one date range, period-aligned to
        period_list, plus a full-range aggregate computed over the exact
        same set of live scores as the series.
      required:
        - group_by_period
        - period_list
        - pass_count
        - fail_count
        - pass_rate
        - pass_count_series
        - fail_count_series
        - pass_rate_series
      properties:
        group_by_period:
          $ref: '#/components/schemas/FactoryMetricsGroupByPeriod'
        period_list:
          type: array
          description: |
            Period labels every series aligns to (dates like 2026-07-01;
            weeks labeled by their Sunday start date).
          items:
            type: string
        pass_count:
          type: integer
          format: int64
          description: 'Live scores whose derived outcome is pass, over the whole range.'
        fail_count:
          type: integer
          format: int64
          description: 'Live scores whose derived outcome is fail, over the whole range.'
        pass_rate:
          type: number
          format: double
          nullable: true
          description: |
            pass_count / (pass_count + fail_count) over the whole range; null
            when the range has no pass/fail scores. The dashboard headline
            should use this field, not a per-period value, so it always
            describes the same window as the chart.
        pass_count_series:
          type: array
          description: 'One entry per period_list entry, zero-filled.'
          items:
            type: integer
            format: int64
        fail_count_series:
          type: array
          description: 'One entry per period_list entry, zero-filled.'
          items:
            type: integer
            format: int64
        pass_rate_series:
          type: array
          description: |
            One entry per period_list entry; pass_count_series[i] /
            (pass_count_series[i] + fail_count_series[i]). Null for a period
            with no pass/fail scores, so the chart renders a gap there
            instead of a false 0%.
          items:
            type: number
            format: double
            nullable: true
    ManualScoringTarget:
      type: object
      required:
        - run_id
        - scorer_ids
      properties:
        run_id:
          type: string
          description: The run to score
        scorer_ids:
          type: array
          minItems: 1
          items:
            type: integer
          description: Scorer IDs to invoke against run_id
    ManualScoringDispatchRequest:
      type: object
      required:
        - targets
      properties:
        targets:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ManualScoringTarget'
          description: |
            One or more (run, scorer) targets, expressed as one entry per run
            with its scorer IDs. Duplicate (run_id, scorer_id) pairs across
            entries are collapsed. At most 100 unique pairs total.
    ManualScoringDispatchStatus:
      type: string
      enum:
        - dispatched
        - already_in_flight
        - failed_no_transcript
        - failed_to_dispatch
      description: |
        Outcome of one dispatched (run, scorer) pair: "dispatched" (stamped
        with a new or shared judge run), "already_in_flight" (an existing live
        judge already holds the pair; it is not queued, cancelled, or
        replaced), "failed_no_transcript" (no scoreable transcript existed, so
        a failed attempt was stamped instead), or "failed_to_dispatch" (an
        operational error occurred after validation passed; retryable).
    ManualScoringDispatchResult:
      type: object
      required:
        - run_id
        - scorer_id
        - status
      properties:
        run_id:
          type: string
          description: The scored agent run
        scorer_id:
          type: integer
          description: The invoked scorer
        status:
          $ref: '#/components/schemas/ManualScoringDispatchStatus'
        scoring_run_id:
          type: string
          nullable: true
          description: |
            The judge run covering this pair; present for dispatched and
            already_in_flight, absent otherwise. Multiple pairs for the same
            run can share one scoring_run_id.
        error:
          type: string
          nullable: true
          description: Safe error detail; present only for failed_to_dispatch
    ManualScoringDispatchResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ManualScoringDispatchResult'
          description: 'One entry per requested pair, in no particular order'
    RunScoreAttemptStatus:
      type: string
      enum:
        - in_flight
        - scored
        - failed
      description: |
        Classification of a run's current attempt against one evaluation.
        "scored" takes precedence over in-flight: a live score reads as
        scored even while a replacement judge runs, and is_in_flight reports
        that overlap independently.
    RunScoreTriggerSource:
      type: string
      enum:
        - automatic
        - manual
      description: Whether the current attempt was requested by the periodic job or a manual dispatch request
    RunScoreItem:
      type: object
      required:
        - scorer_id
        - scorer_name
        - attempt_status
        - is_in_flight
        - trigger_source
        - attempted_at
      properties:
        scorer_id:
          type: integer
          description: The evaluation that attempted this run
        scorer_name:
          type: string
          description: Display name of the evaluation
        attempt_status:
          $ref: '#/components/schemas/RunScoreAttemptStatus'
        is_in_flight:
          type: boolean
          description: True when a non-terminal judge run currently holds this pair
        trigger_source:
          $ref: '#/components/schemas/RunScoreTriggerSource'
        classification:
          type: string
          nullable: true
          description: The live classification; absent when there is no live score
        attempted_at:
          type: string
          format: date-time
          description: When the evaluation last attempted this run
        scored_at:
          type: string
          format: date-time
          nullable: true
          description: When the live score was recorded; absent when there is no live score
        scoring_run_id:
          type: string
          nullable: true
          description: The Warp run that performed the judging; absent when scoring was never dispatched for this attempt
    GetRunScoresResponse:
      type: object
      required:
        - run_id
        - scores
      properties:
        run_id:
          type: string
          description: The run these scores belong to
        scores:
          type: array
          items:
            $ref: '#/components/schemas/RunScoreItem'
          description: 'One entry per evaluation that has attempted the run, most recent attempt first'
    ScorerResultReason:
      type: object
      required:
        - run_id
        - status
      properties:
        run_id:
          type: string
          description: The run this reason belongs to
        status:
          type: string
          enum:
            - available
            - absent
            - unavailable
          description: |
            Availability of the run's judge reason: "available" when the reason
            was read, "absent" when the judge recorded none, and "unavailable"
            when a recorded reason could not be read back.
        reason:
          type: string
          nullable: true
          description: |
            The judge's reasoning, truncated beyond 8KB when it was recorded;
            absent unless status is "available".
    ListScorerResultReasonsResponse:
      type: object
      required:
        - reasons
      properties:
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/ScorerResultReason'
    SelfImprovementConfigResponse:
      type: object
      required:
        - scorer_id
        - status
        - created_at
        - updated_at
      properties:
        scorer_id:
          type: integer
          description: Identifier of the scorer this self-improvement config belongs to
        status:
          type: string
          enum:
            - active
            - paused
          description: Self-improvement config lifecycle status (active means self-improvement is enabled)
        created_at:
          type: string
          format: date-time
          description: When the self-improvement config was created
        updated_at:
          type: string
          format: date-time
          description: When the self-improvement config was last updated
    ReportedRunScore:
      type: object
      required:
        - scorer_id
      properties:
        scorer_id:
          type: integer
          description: The evaluation this verdict belongs to
        classification:
          type: string
          description: |
            The chosen classification. Must exactly match one of the allowed
            label values captured when the evaluation was dispatched. Ignored
            when `failed` is true.
        reason:
          type: string
          description: |
            Optional judge reasoning. Stored outside the database and truncated
            beyond 8KB; a storage failure does not reject the verdict.
        failed:
          type: boolean
          description: |
            True when the judge could not evaluate this evaluation. Failed
            verdicts are accepted but record no score.
    ReportRunScoresRequest:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReportedRunScore'
    ReportedRunScoreOutcome:
      type: object
      required:
        - scorer_id
        - status
      properties:
        scorer_id:
          type: integer
          description: The evaluation this outcome belongs to
        status:
          type: string
          description: 'Whether the verdict was recorded: "accepted" or "rejected"'
        error:
          type: string
          description: Why the verdict was rejected; absent when accepted
    ReportRunScoresResponse:
      type: object
      required:
        - results
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ReportedRunScoreOutcome'
    CreateAgentRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: A name for the agent
        description:
          type: string
          nullable: true
          description: Optional description of the agent
        prompt:
          type: string
          nullable: true
          description: |
            Optional base prompt for this agent
        environment_id:
          type: string
          nullable: true
          description: |
            Optional default cloud environment ID for runs executed by this agent.
            The environment must be owned by the same team as the agent.
        default_runner_uid:
          type: string
          nullable: true
          description: |
            Optional default runner UID for runs executed by this agent. When set,
            it overrides the selected environment's default runner for runs that
            do not specify their own `runner_id`. The editor must have View
            permission on the referenced runner.
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SecretRef'
          description: |
            Optional list of secrets associated with the agent.
            Duplicate names within a single request are rejected.
            Each entry is unioned into the run-time secret scope when the agent executes.
        skills:
          type: array
          items:
            type: string
          description: |
            Optional list of skill specs to associate with the agent.
            Format: "{owner}/{repo}:{skill_path}" (e.g., "warpdotdev/warp-server:.claude/skills/deploy/SKILL.md").
            Each spec is validated and normalized at attach time using the team's GitHub
            credentials; inaccessible or malformed specs are rejected.
        base_model:
          type: string
          nullable: true
          description: |
            Optional base model for runs executed by this agent.
        inference_providers:
          allOf:
            - $ref: '#/components/schemas/InferenceProvidersConfig'
          description: |
            Optional inference provider settings for this agent.
            Agent-level config takes precedence over the workspace's
            admin-configured defaults.
        memory:
          allOf:
            - $ref: '#/components/schemas/AgentMemoryCreateConfig'
          description: Optional memory settings for the agent.
        mcp_servers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MCPServerConfig'
          description: |
            Optional map of MCP server configurations by name to attach to runs executed by this agent.
            Run-level MCP config takes precedence over this agent-level default.
        base_harness:
          type: string
          nullable: true
          deprecated: true
          description: |
            Optional default harness for runs executed by this agent.
            Deprecated - use harness instead. Kept for backward compatibility;
            when both are sent, harness is authoritative and a conflicting
            type is rejected with invalid_request.
        harness:
          allOf:
            - $ref: '#/components/schemas/Harness'
          description: |
            Optional default harness for runs executed by this agent.
            Omission or an empty object stores no harness default.
        credential_strategy:
          allOf:
            - $ref: '#/components/schemas/AgentCredentialStrategy'
          nullable: true
          description: |
            Optional default credential strategy for runs executed by this
            agent. When omitted or null, the agent has no opinion and runs fall
            back to the factory default (for factory-seeded agents) and then to
            EXECUTOR.
        harness_auth_secrets:
          allOf:
            - $ref: '#/components/schemas/HarnessAuthSecrets'
          description: |
            Optional per-harness authentication secrets for this agent.
            Each field names a managed secret for the corresponding harness.
            Secrets are resolved at execution time from the agent's team scope.
        on_behalf_of_enabled:
          type: boolean
          description: |
            Whether runs created with this agent's API key may use the on_behalf_of
            field to attribute runs to another team member. Defaults to false.
            Only team admins may set this field.
        worker_host:
          type: string
          nullable: true
          description: |
            Optional default worker host for runs executed by this agent;
            omission, null, or an empty value stores no Agent default, in
            which case the workspace default applies. A non-empty value is
            trimmed and stored (use "warp" to force Warp-hosted execution
            over a self-hosted workspace default), and is resolved in this
            order:
            1. The host specified on the run itself
            2. The agent's default host
            3. The workspace default host
    UpdateAgentRequest:
      type: object
      description: |
        Partial update for an agent; each field is optional:
          * Omitted or `null`: leave the field unchanged.
          * Empty value: clear the field.
          * Non-empty: replace the field wholesale with the provided value.
      properties:
        name:
          type: string
          description: The new name for the agent
        description:
          type: string
          nullable: true
          description: |
            Replacement description. Omit or pass `null` to leave unchanged, or use an empty value to clear.
        prompt:
          type: string
          nullable: true
          description: |
            Replacement prompt. Omit or pass `null` to leave unchanged, or use an empty value to clear.
        environment_id:
          type: string
          nullable: true
          description: |
            Replacement default cloud environment ID. Omit or pass `null` to leave unchanged,
            or pass an empty string to clear.
        default_runner_uid:
          type: string
          nullable: true
          description: |
            Replacement default runner UID. Omit or pass `null` to leave unchanged,
            or pass an empty string to clear. A non-empty value must reference a
            runner the editor can View.
        secrets:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/SecretRef'
          description: |
            Replacement list of secrets. Omit to leave unchanged, pass an
            empty array to clear, or pass a non-empty array to replace.
            Duplicate names are rejected.
        skills:
          type: array
          nullable: true
          items:
            type: string
          description: |
            Replacement list of skill specs. Omit to leave unchanged, pass an empty array
            to clear, or pass a non-empty array to replace.
        base_model:
          type: string
          nullable: true
          description: |
            Replacement base model. Omit or pass `null` to leave unchanged,
            or pass an empty string to clear.
        memory:
          allOf:
            - $ref: '#/components/schemas/AgentMemoryUpdateConfig'
          nullable: true
          description: Replacement memory settings for this agent.
        mcp_servers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MCPServerConfig'
          description: |
            Replacement map of MCP server configurations by name. Omit to leave
            unchanged, pass an empty object to clear, or pass a non-empty object
            to replace. Run-level MCP config takes precedence over this agent-level
            default.
        inference_providers:
          type: object
          allOf:
            - $ref: '#/components/schemas/InferenceProvidersConfig'
          nullable: true
          description: |
            Replacement inference provider settings for this agent, which
            take precedence over the workspace's admin-configured defaults;
            omit or pass `null` to leave unchanged, or pass an empty object
            `{}` to clear.
        base_harness:
          type: string
          nullable: true
          deprecated: true
          description: |
            Replacement default harness; omit or pass `null` to leave
            unchanged, or pass an empty string to clear. Deprecated - use
            harness instead, kept only for backward compatibility: when both
            are sent, harness is authoritative and a conflicting type is
            rejected with invalid_request.
        harness:
          allOf:
            - $ref: '#/components/schemas/Harness'
          nullable: true
          description: |
            Replacement default harness for runs executed by this agent. Omit
            or pass `null` to leave unchanged, pass `{}` to clear the stored
            default, or pass a populated object to replace it wholesale.
        credential_strategy:
          allOf:
            - $ref: '#/components/schemas/AgentCredentialStrategy'
          nullable: true
          description: |
            Replacement default credential strategy. Omit or pass `null` to
            leave unchanged, or pass an empty string to clear the agent's
            default. An agent belonging to a file-managed factory cannot clear
            it: its agent file expresses the strategy by declaring it, and a
            file that declares none keeps the strategy already projected, so a
            clear is rejected with a 400.
        harness_auth_secrets:
          allOf:
            - $ref: '#/components/schemas/HarnessAuthSecrets'
          nullable: true
          description: |
            Replacement per-harness authentication secrets. Omit or pass `null`
            to leave unchanged, or pass an empty object to clear all secrets.
        on_behalf_of_enabled:
          type: boolean
          nullable: true
          description: |
            Whether runs created with this agent's API key may use the on_behalf_of
            field to attribute runs to another team member. Omit or pass `null` to
            leave unchanged. Only team admins may set this field.
        worker_host:
          type: string
          nullable: true
          description: |
            Replacement default worker host. Omit or pass `null` to leave
            unchanged, or pass an empty string to clear (the workspace default
            then applies). A non-empty value is trimmed and replaces the
            stored default; use "warp" to force Warp-hosted execution over a
            self-hosted workspace default.
    AgentResponse:
      type: object
      required:
        - uid
        - name
        - available
        - created_at
        - updated_at
        - secrets
        - skills
        - memory
        - default_runner_uid
      properties:
        uid:
          type: string
          description: Unique identifier for the agent
        name:
          type: string
          description: Name of the agent
        description:
          type: string
          nullable: true
          description: Optional description of the agent
        prompt:
          type: string
          nullable: true
          description: |
            Optional base prompt for this agent
        environment_id:
          type: string
          description: |
            Default cloud environment ID for runs executed by this agent;
            the precedence order for environment resolution is:
            1. The environment specified on the run itself
            2. The agent's default environment
            3. An empty environment
        default_runner_uid:
          type: string
          description: |
            Default runner UID for runs executed by this agent; when set,
            it overrides the selected environment's default runner for
            runs that do not specify their own `runner_id`. The precedence
            order for runner resolution is:
            1. The runner specified on the run itself
            2. The agent's default runner
            3. The selected environment's default runner
            4. The environment's legacy inline compute fields
            5. System defaults
        available:
          type: boolean
          description: Whether the agent is currently enabled. Defaults to true.
        created_at:
          type: string
          format: date-time
          description: When the agent was created (RFC3339)
        updated_at:
          type: string
          format: date-time
          description: When the agent was last updated (RFC3339)
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/SecretRef'
          description: |
            Secrets that this agent may access by default.
        skills:
          type: array
          items:
            type: string
          description: |
            Ordered list of normalized skill specs associated with this agent.
            Always present; empty when no skills are attached.
        base_model:
          type: string
          description: |
            Base model for runs executed by this agent; the precedence
            order for model resolution is:
            1. The model specified on the run itself
            2. The agent's base model
            3. The team's default model
        inference_providers:
          allOf:
            - $ref: '#/components/schemas/InferenceProvidersConfig'
          description: |
            The agent's stored inference provider settings. May be overridden
            by run-level config; if empty, falls back to the workspace's
            admin-configured defaults.
        memory:
          allOf:
            - $ref: '#/components/schemas/AgentMemoryResponse'
          description: |
            Memory settings for this agent.
            Always present; attached_stores is empty when no team stores are attached.
        mcp_servers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MCPServerConfig'
          description: |
            MCP server configurations attached to this agent by default.
            Run-level MCP config takes precedence over this agent-level default.
        base_harness:
          type: string
          deprecated: true
          description: |
            Default harness for runs executed by this agent; the
            precedence order for harness resolution is:
            1. The harness specified on the run itself
            2. The agent's base harness
            3. Warp
            Deprecated: use harness instead, which carries the full
            {type, model_id, reasoning_level} default.
        harness:
          allOf:
            - $ref: '#/components/schemas/Harness'
          description: |
            Default harness for runs executed by this agent. Absent when the
            agent has no harness default. A stored model_id/reasoning_level
            pair is still returned even if the model has since left the
            harness's catalog.
        credential_strategy:
          allOf:
            - $ref: '#/components/schemas/AgentCredentialStrategy'
          description: |
            Default credential strategy for runs executed by this agent.
            Absent when the agent has no default. The precedence order for
            credential strategy resolution is:
            1. The strategy specified on the run itself
            2. The agent's default strategy
            3. The factory's default strategy, for factory-seeded agents
            4. EXECUTOR
            The resolved strategy is credential-validated at run creation;
            an unavailable credential rejects the request before execution.
        harness_auth_secrets:
          allOf:
            - $ref: '#/components/schemas/HarnessAuthSecrets'
          description: |
            Per-harness authentication secrets configured on this agent.
            Each field names a managed secret for the corresponding harness.
            Secrets can be overridden per run.
        on_behalf_of_enabled:
          type: boolean
          description: |
            Whether runs created with this agent's API key may use the on_behalf_of
            field to attribute runs to another team member.
        worker_host:
          type: string
          description: |
            Default worker host for runs executed by this agent, or empty
            when unset; the precedence order for worker host resolution is:
            1. The host specified on the run itself
            2. The agent's default host
            3. The workspace default host
    ListAgentIdentitiesResponse:
      type: object
      required:
        - agents
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentResponse'
    EnvironmentLastTask:
      type: object
      description: Summary of the most recently created task for an environment
      required:
        - id
        - title
        - state
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: Unique identifier of the task
        title:
          type: string
          description: Title of the task
        state:
          $ref: '#/components/schemas/RunState'
        created_at:
          type: string
          format: date-time
          description: When the task was created (RFC3339)
        updated_at:
          type: string
          format: date-time
          description: When the task was last updated (RFC3339)
        started_at:
          type: string
          format: date-time
          nullable: true
          description: 'When the task started running (RFC3339), null if not yet started'
