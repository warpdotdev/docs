openapi: 3.2.0
info:
  title: Warp Platform API
  version: 1.0.0
  description: |
    API for creating, managing, and querying factory and cloud agent runs.

    Send work to factories, start standalone agents, list runs, and retrieve
    detailed run information.
  contact:
    name: Warp Support
    url: 'https://docs.warp.dev'
    email: support@warp.dev
  license:
    name: Proprietary
servers:
  - url: 'https://app.warp.dev/api/v1'
    description: Warp Server
tags:
  - name: agent
    description: Operations for running and managing cloud agents
  - name: schedules
    description: Operations for creating and managing scheduled agents
  - name: factory
    description: Operations for creating and managing factories
  - name: benchmark
    description: 'Operations for managing benchmark suites, tasks, runs, trials, and results'
  - name: networking
    description: Networking information for Warp-hosted agents
paths:
  /networking/egress-ranges:
    get:
      summary: List Warp-hosted agent egress ranges
      description: |
        Return the canonical IP network ranges used by outbound requests from
        Warp-hosted agents.
      operationId: getEgressRanges
      tags:
        - networking
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamUidHeaderParam'
      responses:
        '200':
          description: Current Warp-hosted agent egress ranges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EgressRangesResponse'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  /factory:
    get:
      summary: List factories
      description: |
        List factories accessible to the authenticated principal, restricted
        to the request's active team when one is set. An optional team_uid
        query parameter overrides the active team and restricts results to a
        single team, and an optional search query parameter filters by a
        case-insensitive substring match on the factory name or alias.
      operationId: listFactories
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamUidHeaderParam'
        - name: team_uid
          in: query
          description: |
            Optional team UID to filter factories by ownership. Takes
            precedence over the X-Warp-Team-Uid header.
          required: false
          schema:
            type: string
        - name: search
          in: query
          description: |
            Case-insensitive substring search over the factory name and
            alias.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: 'Maximum number of factories to return (default 50, max 100).'
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          description: Opaque cursor returned by a previous list response.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of factories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFactoriesResponse'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/{uid}':
    get:
      summary: Get a factory
      description: Get a factory by its UID.
      operationId: getFactory
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          description: The public UID of the factory.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Factory details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factory'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: Factory not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  /factory-inbox:
    get:
      summary: List Factory inbox notifications
      description: |
        List unresolved notifications across factories authorized for the
        authenticated principal and active team. The default `mine` scope
        preserves the personal Inbox and requires user credentials. The
        `team` scope lists notifications assigned to any recipient and
        can be used by user or agent credentials. Personal read state
        (`is_read`) is included only in `mine` scope and omitted in `team`
        scope, including when filtering by recipient.
      operationId: listFactoryInbox
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamUidHeaderParam'
        - name: scope
          in: query
          description: |
            `mine` returns notifications assigned to the authenticated user
            and is the default. `team` returns notifications across live
            recipients in the authorized Factory and team scope.
          required: false
          schema:
            $ref: '#/components/schemas/FactoryInboxScope'
        - name: factory_uid
          in: query
          description: 'Exact Factory UID filter, intersected with authorized factories.'
          required: false
          schema:
            type: string
        - name: recipient_uid
          in: query
          description: |
            Exact public user UID filter within the authorized Factory and
            team scope. In `mine` scope this can only match the authenticated
            user.
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of items to return. Defaults to 50.
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: Opaque cursor from page_info.next_cursor.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: One page of inbox notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFactoryInboxResponse'
        '400':
          description: 'Invalid scope, limit, cursor, or principal for the requested scope'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: Factory task APIs are not available
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  /factory-inbox/notifications/read:
    post:
      summary: Mark inbox notifications as read
      description: |
        Mark a batch of notifications as read for the authenticated user after
        checking access to each factory. The caller must be a recipient of
        each existing notification, and the notification must remain active;
        otherwise its outcome is unsuccessful. Missing notifications are
        successful no-ops. Outcomes are returned in request order.
      operationId: markFactoryInboxNotificationsRead
      tags:
        - factory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactoryInboxMutationRequest'
      responses:
        '200':
          description: Per-notification outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryInboxMutationResponse'
        '400':
          description: Invalid notification list
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is not a user
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  /factory-inbox/notifications/unread:
    post:
      summary: Mark inbox notifications as unread
      description: |
        Mark a batch of notifications as unread for the authenticated user
        after checking access to each factory. The caller must be a recipient
        of each existing notification, and the notification must remain active;
        otherwise its outcome is unsuccessful. Missing notifications are
        successful no-ops. Outcomes are returned in request order.
      operationId: markFactoryInboxNotificationsUnread
      tags:
        - factory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactoryInboxMutationRequest'
      responses:
        '200':
          description: Per-notification outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryInboxMutationResponse'
        '400':
          description: Invalid notification list
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is not a user
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/{uid}/tasks':
    post:
      summary: Create a factory task
      description: |
        Create a task in a factory, bound to an existing agent conversation.
        title and conversation_id are required. The stage defaults to TRIAGE. The
        conversation's most recent run must be owned by the factory's team,
        and a conversation may be bound to at most one live task across all
        factories.
      operationId: createFactoryTask
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          description: The public UID of the factory.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactoryTaskCreateRequest'
      responses:
        '201':
          description: Factory task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryTask'
        '400':
          description: Invalid request body or conversation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: Factory not found or not accessible
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The conversation is already bound to a live task
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List factory tasks
      description: |
        List the factory's tasks with optional filtering and search. List
        responses are lean by default; set full_list=true to include
        canonical ticket metadata and derived outputs for the returned page.
      operationId: listFactoryTasks
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          description: The public UID of the factory.
          required: true
          schema:
            type: string
        - name: stage
          in: query
          description: |
            Filter by task stage. Can be specified multiple times to match any
            of the given stages.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/FactoryTaskStage'
          style: form
          explode: true
        - name: created_by
          in: query
          description: |
            Filter to tasks whose seed run was started by any of these
            teammates, each given as their email address. Can be specified
            multiple times to match any of the given teammates.
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: q
          in: query
          description: Case-insensitive substring search over the task title.
          required: false
          schema:
            type: string
        - name: created_after
          in: query
          description: Filter to tasks created after this timestamp (RFC3339 format).
          required: false
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          description: Filter to tasks created before this timestamp (RFC3339 format).
          required: false
          schema:
            type: string
            format: date-time
        - name: updated_after
          in: query
          description: Filter to tasks updated after this timestamp (RFC3339 format).
          required: false
          schema:
            type: string
            format: date-time
        - name: sort_by
          in: query
          description: Sort field for results.
          required: false
          schema:
            type: string
            enum:
              - created_at
              - updated_at
            default: created_at
        - name: sort_order
          in: query
          description: Sort direction.
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: limit
          in: query
          description: 'Maximum number of tasks to return (default 50, max 100).'
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          description: |
            Opaque cursor returned by a previous list response.
            Valid only for the sort_by/sort_order it was issued under; omit
            to restart the listing.
          required: false
          schema:
            type: string
        - name: full_list
          in: query
          description: |
            Include canonical ticket_source and ticket_id metadata from each
            task's bound run, plus its derived outputs. Defaults to false.
          required: false
          schema:
            type: boolean
            default: false
        - name: include_current_run
          in: query
          description: |
            Include each task's current top-level run, resolved in one batch
            for the returned page. Defaults to false.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of factory tasks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFactoryTasksResponse'
        '400':
          description: 'Invalid filter, sort, limit, cursor, full_list, or include_current_run value'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: Factory not found or not accessible
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/{uid}/runs':
    post:
      summary: Dispatch a run to a factory
      description: |
        Dispatch a run to a factory, using prompt as the run's
        prompt and an optional title, ticket_ref, and ticket_url. Returns
        the created run; its factory task is created asynchronously and can
        be resolved afterwards with GET /factory/{uid}/task-by-run.
      operationId: createFactoryRun
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          description: The public UID of the factory.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactoryRunRequest'
      responses:
        '201':
          description: Run dispatched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryRunResponse'
        '400':
          description: Invalid request body or ticket_ref
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: Factory not found or not accessible
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The factory has no foreman agent to receive work
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/{uid}/branches/{branch_uid}':
    get:
      summary: Observe a tracked Factory Branch
      description: |
        Requires Factory view and matching parent Factory/team ownership.
        Does not create tracking, request repair, or mutate projections.
        Retired tracking remains DELETED until normal permadeletion.
        Unverifiable source freshness is UNKNOWN. Requires factory_branches.
      operationId: getFactoryBranch
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
        - name: branch_uid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/FactoryBranchStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/FactoryBranchNotFound'
        '500':
          $ref: '#/components/responses/FactoryBranchUnavailable'
    delete:
      summary: Stop tracking a Factory Branch
      description: |
        Requires Factory view plus source.apply. Retirement blocks future
        execution boundaries without deleting the Git head, cancelling
        already-loaded work, or deleting production resources.
        Repeated authorized deletion, including after purge, returns 204.
        Requires factory_branches.
      operationId: deleteFactoryBranch
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
        - name: branch_uid
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Tracking retired or already absent
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          $ref: '#/components/responses/FactoryBranchNotFound'
        '409':
          $ref: '#/components/responses/FactoryBranchConflict'
        '500':
          $ref: '#/components/responses/FactoryBranchUnavailable'
  '/factory/{uid}/branches/{branch_uid}/apply':
    post:
      summary: Apply a Factory Branch sync
      description: |
        Requires Factory view, source.apply, and complete projection
        authorization. Synchronizes to the current registered head with
        bounded freshness admission. Duplicate requests converge.
        Does not accept a target SHA or repository, create tracking, revive
        retired identity, or replace settings on existing runs.
        Requires factory_branches.
      operationId: applyFactoryBranch
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: string
        - name: branch_uid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/FactoryBranchStatusResponse'
        '400':
          description: Invalid source content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          $ref: '#/components/responses/FactoryBranchNotFound'
        '409':
          $ref: '#/components/responses/FactoryBranchConflict'
        '500':
          $ref: '#/components/responses/FactoryBranchUnavailable'
  '/factory/{uid}/tasks/{task_uid}':
    get:
      summary: Get a factory task
      description: |
        Get a task with its derived outputs, newest-first.
      operationId: getFactoryTask
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          description: The public UID of the factory.
          required: true
          schema:
            type: string
        - name: task_uid
          in: path
          description: The public UID of the task.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Factory task details with derived outputs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryTask'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: Factory or task not found under this factory
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update a factory task
      description: |
        Partially update a task's title, description, and/or stage. Last
        write wins. Stage writes are unrestricted: any stage-to-stage
        transition is allowed, including moving backwards or to completion.
      operationId: updateFactoryTask
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          description: The public UID of the factory.
          required: true
          schema:
            type: string
        - name: task_uid
          in: path
          description: The public UID of the task.
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FactoryTaskPatchRequest'
      responses:
        '200':
          description: Factory task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryTask'
        '400':
          description: Invalid request body
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: Factory or task not found under this factory
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a factory task
      description: |
        Soft-delete a task. The task disappears from list and get responses
        immediately, and its conversation may be bound to a new task.
        Deleting a task never deletes artifacts or the conversation.
      operationId: deleteFactoryTask
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          description: The public UID of the factory.
          required: true
          schema:
            type: string
        - name: task_uid
          in: path
          description: The public UID of the task.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Factory task deleted successfully
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: Factory or task not found under this factory
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  '/factory/{uid}/tasks/{task_uid}/cancel':
    post:
      summary: Stop a factory task
      description: |
        Cancel the task's current top-level run and move the task to
        CANCELLED. Every non-terminal descendant of the root run is
        cancelled as well.
      operationId: cancelFactoryTask
      tags:
        - factory
      security:
        - bearerAuth: []
      parameters:
        - name: uid
          in: path
          description: The public UID of the factory.
          required: true
          schema:
            type: string
        - name: task_uid
          in: path
          description: The public UID of the task.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: |
            Task stopped. The response reflects the refreshed task, including
            its current run and stage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactoryTask'
        '400':
          description: The resolved current run is already in a terminal state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            The caller can see the task but lacks access to its resolved
            current run.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Factory or task not found under this factory, or the task has no
            resolvable current run.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |
            The resolved current run is PENDING and cannot be cancelled yet.
            Retry after a moment.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The resolved current run's type does not support server-side cancellation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
