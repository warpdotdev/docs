        - prompt
        - success_criteria
      properties:
        uid:
          type: string
          format: uuid
          description: Immutable public task identifier.
        title:
          type: string
        prompt:
          type: string
        success_criteria:
          type: string
          description: |
            Plain-text criteria the built-in Correctness scorer grades each trial
            against, as the authoritative requirements. The task prompt provides
