      description: |
        Return fresh presigned download URLs for handoff snapshot files uploaded
        by the latest ended execution of this run. An empty list is returned
        when no ended execution exists or no snapshot files were uploaded.

        This endpoint is useful for third-party harnesses that want to download
        the snapshot files produced by a previous execution before starting a
        handoff execution themselves.
