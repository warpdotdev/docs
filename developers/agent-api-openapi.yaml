              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'No permission to access referenced resources (environment, MCP servers)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List agent runs
      description: |
        Retrieve a paginated list of agent runs with optional filtering.
        Results default to `sort_by=updated_at` and `sort_order=desc`.
      operationId: listRuns
      tags:
        - agent
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TeamUidHeaderParam'
        - name: limit
          in: query
          description: Maximum number of runs to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 20
        - name: cursor
          in: query
          description: Pagination cursor from previous response
          required: false
          schema:
            type: string
        - name: sort_by
          in: query
          description: |
            Sort field for results.
            - `updated_at`: Sort by last update timestamp (default)
            - `created_at`: Sort by creation timestamp
            - `title`: Sort alphabetically by run title
            - `agent`: Sort alphabetically by skill. Runs without a skill are grouped last.
          required: false
          schema:
            type: string
            enum:
              - updated_at
              - created_at
              - title
              - agent
            default: updated_at
        - name: sort_order
          in: query
          description: Sort direction
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - name: state
          in: query
          description: |
            Filter by run state. Can be specified multiple times to match any of the given states.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RunState'
          style: form
          explode: true
        - name: task_status
          in: query
          description: |
            Filter by high-level task status. Can be specified multiple times to match any value.
            `running` matches when the root or any descendant is queued, pending, claimed, or in progress.
            `failed`, `blocked`, `cancelled`, and `complete` match the root state only.
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - running
                - failed
                - blocked
                - cancelled
                - complete
          style: form
          explode: true
        - name: name
          in: query
          description: Filter by agent config name
          required: false
          schema:
            type: string
        - name: model_id
          in: query
          description: Filter by model ID
          required: false
          schema:
            type: string
        - name: creator
          in: query
          description: Filter by creator UID (user or service account)
          required: false
          schema:
            type: string
        - name: executor
          in: query
          description: |
            Filter by the user or agent that executed the run. This will often be the
            same as the creator, but not always: users may delegate tasks to agents.
          required: false
          schema:
            type: string
        - name: source
          in: query
          description: |
            Filter by run source type. Can be specified multiple times to match any of the given sources.
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RunSourceType'
          style: form
          explode: true
        - name: execution_location
          in: query
          description: Filter by where the run executed
          required: false
          schema:
            $ref: '#/components/schemas/RunExecutionLocation'
        - name: created_after
          in: query
          description: Filter runs created after this timestamp (RFC3339 format)
          required: false
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          description: Filter runs created before this timestamp (RFC3339 format)
          required: false
          schema:
            type: string
            format: date-time
        - name: updated_after
          in: query
          description: Filter runs updated after this timestamp (RFC3339 format)
          required: false
          schema:
            type: string
            format: date-time
        - name: environment_id
          in: query
          description: |
            Filter runs by environment ID. Passing the literal value
            `empty-environment` matches runs with no environment configured,
            rather than omitting the parameter, which applies no environment
            filter at all. `empty-environment` can never collide with a real
            environment ID: every environment ID is exactly 22 characters
            drawn from `[A-Za-z0-9]`, while this sentinel contains a hyphen
            and is a different length.
          required: false
          schema:
            type: string
        - name: skill
          in: query
          description: |
            Filter runs by skill spec (e.g., "owner/repo:path/to/SKILL.md").
            Alias for skill_spec.
          required: false
          schema:
            type: string
        - name: skill_spec
          in: query
          description: 'Filter runs by skill spec (e.g., "owner/repo:path/to/SKILL.md")'
          required: false
          schema:
            type: string
        - name: schedule_id
          in: query
          description: Filter runs by the scheduled agent ID that created them
          required: false
          schema:
            type: string
        - name: factory_uid
          in: query
          description: |
            Filter runs by one or more factories. Repeating this parameter
            matches runs executed by an agent from any selected factory. A UID
            outside the caller's accessible factories matches nothing.
          required: false
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          style: form
          explode: true
        - name: ancestor_run_id
          in: query
          description: Filter runs by ancestor run ID. The referenced run must exist and be accessible to the caller.
          required: false
          schema:
            type: string
        - name: metadata
          in: query
          description: |
            Filter by exact metadata key/value pairs using object notation
            (e.g. `metadata[ticket_id]=ACME-238`), combining multiple pairs
            with AND semantics, up to 5 per request. Returns
            `feature_not_available` when metadata filtering is not enabled.
          required: false
          schema:
            type: object
            maxProperties: 5
            additionalProperties:
              type: string
          style: deepObject
          explode: true
        - name: artifact_type
          in: query
          description: Filter runs by artifact type
          required: false
          schema:
            type: string
            enum:
              - PLAN
              - PULL_REQUEST
              - SCREENSHOT
              - FILE
              - EXTERNAL_REFERENCE
        - name: q
          in: query
          description: 'Search by full run ID or run URL, or fuzzy match across run title, prompt, and skill_spec'
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRunsResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Metadata filtering is not enabled for this environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /agent/run-by-external-reference:
