        '403':
          $ref: '#/components/responses/FactoryAccessDenied'
        '404':
          description: 'Suite not found, task not found, or task_uid belongs to another suite'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
