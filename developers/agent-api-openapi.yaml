      description: Lifecycle state of a benchmark trial.
      enum:
        - pending
        - running
        - succeeded
        - failed
        - cancelled
    BenchmarkRepoRef:
      type: object
      description: A repository location and optional starting ref for a suite task.
      required:
        - code_forge
        - owner
        - repo
      properties:
        code_forge:
          type: string
        owner:
          type: string
        repo:
          type: string
        ref:
          type: string
    BenchmarkSuiteTask:
      type: object
      required:
