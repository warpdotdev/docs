              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Edit one benchmark suite task
      description: |
        Edits a single task in place without resending the suite's full task
        list. Omitted fields keep their current values. title, prompt, and
        success_criteria reject null and empty-after-trim values. An
        explicit null source_run_id clears provenance. An explicit empty
        starting_repo_refs or tags clears that field.
      operationId: patchBenchmarkSuiteTask
      tags:
