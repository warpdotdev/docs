name: Stainless SDK

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - docs/developers/agent-api-openapi.yaml

env:
  STAINLESS_API_KEY: ${{ secrets.STAINLESS_API_KEY }}
  STAINLESS_ORG: Warp
  STAINLESS_PROJECT: warp-api
  OAS_PATH: docs/developers/agent-api-openapi.yaml

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: stainless-api/upload-openapi-spec-action/preview@v1

  merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    needs: preview
    permissions:
      id-token: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: stainless-api/upload-openapi-spec-action/merge@v1
