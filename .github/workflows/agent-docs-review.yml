name: Agent docs review

# Internal-PR-only: dispatches an independent review-docs-pr pass for every
# agent-marked PR (the `warpy-factory` label), pinned to the exact head SHA.
# A fork PR never receives secrets or dispatches agent work, since
# `pull_request` (not `pull_request_target`) runs with the fork's own
# read-only token and no repository secrets.
on:
  pull_request:
    types: [opened, labeled, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One review run per PR; a new push (synchronize) cancels the stale-SHA
  # run in progress rather than letting two reviews race on the same PR.
  group: agent-docs-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Agent docs review
    runs-on: ubuntu-latest
    # Only agent-marked PRs that are ready for human review get the
    # independent review pass, and only from this same repository (never a
    # fork, which carries no secrets here). Drafts may be opened, labeled, or
    # updated without receiving a blocking review; `ready_for_review` starts
    # the first eligible pass.
    if: |
      contains(github.event.pull_request.labels.*.name, 'warpy-factory') &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout docs
        uses: actions/checkout@v4

      - name: Run independent review-docs-pr agent
        env:
          WARP_API_KEY: ${{ secrets.WARP_API_KEY }}
          WARP_AGENT_PROFILE: ${{ vars.WARP_AGENT_PROFILE || '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gpg
          curl --fail --location https://releases.warp.dev/linux/keys/warp.asc \
            --output /tmp/warpdotdev.asc
          # Verified against releases.warp.dev/linux/keys/warp.asc on 2026-09-18.
          # Reverify this fingerprint before updating the Warp signing key.
          test "$(
            gpg --show-keys --with-colons /tmp/warpdotdev.asc |
              awk -F: '/^fpr:/ { print $10; exit }'
          )" = "0913165C78D5B7A41B42AC657FF7AB39D60F803F"
          gpg --dearmor --output /tmp/warpdotdev.gpg /tmp/warpdotdev.asc
          sudo install -D -o root -g root -m 644 /tmp/warpdotdev.gpg \
            /etc/apt/keyrings/warpdotdev.gpg
          sudo tee /etc/apt/sources.list.d/warpdotdev.list > /dev/null <<'EOF'
          deb [arch=amd64 signed-by=/etc/apt/keyrings/warpdotdev.gpg] https://releases.warp.dev/linux/deb stable main
          EOF
          sudo apt-get update
          sudo apt-get install -y oz-stable
          PROMPT="$(cat <<'EOF'
            Run the review-docs-pr skill against warpdotdev/docs PR #${{ github.event.pull_request.number }}
            at head SHA ${{ github.event.pull_request.head.sha }}. This PR carries the warpy-factory agent
            marker, so it requires the independent v1 agent-doc quality review pass (see
            .agents/references/doc-quality-policy.md):

            1. Re-validate the declared "## Documentation risk" level against the actual diff using
               the low-risk allowlist. A risk misclassification is an important finding.
            2. Verify technical claims against cited source files when the PR is
               engineering-review-required.
            3. Do not use `gh` or attempt to publish a GitHub review. The GitHub Actions runner
               publishes the review using its short-lived token after this run completes.
            4. Emit one [SIGNAL:pr-review] JSON record with this head SHA, verdict, severity
               counts, and top categories. For every critical, important, suggestion, or nit,
               include one actionable `actionable_findings` string. Each string must name the
               changed file and line or quoted text, explain the problem, and state the requested
               resolution. Set reviewer_login to `github-actions[bot]`, the runner account that
               will publish the review.
            5. Your final response must contain only the single [SIGNAL:pr-review] JSON record.
               Do not repeat the diff, review rationale, or findings outside that record.
          EOF
          )"
          args=(agent run --output-format text --prompt "$PROMPT")
          if [ -n "$WARP_AGENT_PROFILE" ]; then
            args+=(--profile "$WARP_AGENT_PROFILE")
          fi
          oz "${args[@]}" > /tmp/agent-output.txt
      - name: Dismiss stale automated change requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews?per_page=100" > /tmp/reviews.json
          python3 .agents/skills/doc_quality_policy/stale_review_requests.py \
            --reviews /tmp/reviews.json \
            --head-sha "${{ github.event.pull_request.head.sha }}" > /tmp/stale-review-ids.txt
          while IFS= read -r review_id; do
            [ -z "$review_id" ] && continue
            gh api --method PUT \
              "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews/${review_id}/dismissals" \
              -f "message=Superseded by the current Agent docs review check."
          done < /tmp/stale-review-ids.txt

      - name: Publish the independent review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .agents/skills/doc_quality_policy/publish_review_signal.py \
            --agent-output /tmp/agent-output.txt \
            --pr "${{ github.event.pull_request.number }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --output /tmp/review-request.json
          gh api --method POST \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
            --input /tmp/review-request.json

      # A successful agent action is not proof that the run reviewed this
      # exact head or passed: require its one structured signal and an
      # authoritative current GitHub review.
      - name: Verify the current review signal and GitHub review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .agents/skills/doc_quality_policy/verify_review_signal.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --agent-output /tmp/agent-output.txt \
            --reviewer-login github-actions[bot]
