version: 0.1
cli:
  version: 1.6.1
plugins:
  sources:
    - id: trunk
      ref: v0.0.13
      uri: https://github.com/trunk-io/plugins
lint:
  enabled:
    - oxipng@8.0.0
    - yamllint@1.29.0
    - gitleaks@8.16.1
    - prettier@2.8.6
    - markdownlint@0.33.0
runtimes:
  enabled:
    - python@3.10.8
    - go@1.18.3
    - node@16.14.2
actions:
  enabled:
    - git-lfs
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
