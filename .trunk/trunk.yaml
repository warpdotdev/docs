version: 0.1
cli:
  version: 1.9.1
plugins:
  sources:
    - id: trunk
      ref: v0.0.14
      uri: https://github.com/trunk-io/plugins
lint:
  disabled:
    - prettier@2.8.7
  enabled:
    - git-diff-check
    - markdownlint@0.34.0
    - oxipng@8.0.0
    - yamllint@1.31.0
    - gitleaks@8.16.3
runtimes:
  enabled:
    - python@3.10.8
    - go@1.19.5
    - node@18.12.1
actions:
  enabled:
    - git-lfs
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
