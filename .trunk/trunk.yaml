version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.10.0
      uri: https://github.com/trunk-io/plugins
lint:
  disabled:
    - git-diff-check
    - prettier
  enabled:
    - markdownlint@0.43.0
    - oxipng@9.1.4
    - yamllint@1.35.1
    - gitleaks@8.30.1
runtimes:
  enabled:
    - python@3.12.7
    - go@1.23.4
    - node@22.13.0
actions:
  enabled:
    - git-lfs
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
